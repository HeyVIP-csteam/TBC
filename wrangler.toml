name = "hub-merged"
pages_build_output_dir = "public"

# 三国合并（2026-08-20）—— 真实的绑定配置，不是补丁说明。下面每一个
# id / bucket_name / database_id 都是从三份原始 wrangler.toml 里原样
# 抄过来的真实值，不是占位符（除了 ACCOUNTS_KV，这是全新概念，见下）。

# === 全局共享（不按国家拆分）===
# 账号/办公室/session/在线状态 —— 见 functions/_shared/countries.js
# 顶部的架构说明：账号要能同时属于多个国家，不能被拆进某一国的 KV 里。
#
# ⚠️ 临时方案（2026-08-20）—— 暂时借用 INR 的 THREADS_KV_INR namespace
# （inr-ticket-threads，id 4821238464004b8289e4ded5a467d582）当
# ACCOUNTS_KV 用，不是新建的独立 namespace。这是业务方明确确认过的临时
# 决定：核对过两边用到的 KV key 前缀（账号侧 account:/office:/
# offices-index/accounts-index/activitylog:/presence:current:/
# presence:daily:/promo-code-sheet:/blocked-ips/pending-ips/
# ip-access-log/route:_security:alerts，工单侧 thread:/msgid:/
# mention-registry:/deposit-sheet:/deposit-backup:/issue-sheet:/
# announcements/route:<brandId>:<moduleId> 等），没有任何一个前缀会
# 撞车，混用不会导致数据互相覆盖。
# 但账号密码哈希/session token 这些"全局"数据目前是先寄存在这个本来是
# "INR 工单专用"的 namespace 里 —— 等以后建了真正独立的 ACCOUNTS_KV，
# 需要手动把 account:*/office:*/offices-index/accounts-index/
# activitylog:*/presence:*/promo-code-sheet:*/blocked-ips/pending-ips/
# ip-access-log/route:_security:alerts 这些 key 导出来搬过去（
# `wrangler kv key list` + 逐个 `get`/`put`），不会自动发生。
[[kv_namespaces]]
binding = "ACCOUNTS_KV"
id = "4821238464004b8289e4ded5a467d582"

# === INR（真实值，从 INR 项目原始 wrangler.toml 抄）===
[[r2_buckets]]
binding = "SCREENSHOTS_BUCKET_INR"
bucket_name = "inr-issuescreenshot"

[[kv_namespaces]]
binding = "THREADS_KV_INR"
id = "4821238464004b8289e4ded5a467d582"

[[d1_databases]]
binding = "THREADS_DB_INR"
database_name = "inr-ticket-threads"
database_id = "1327b88e-ceda-405d-94ff-8a7ea7da269d"

# === PKR（暂时注释掉 —— 2026-08-20：这两个 ID 是原 PKR 项目账号下的
# 真实 ID，但当前部署用的是新 Cloudflare 账号，这个账号下还没有对应的
# namespace/bucket，直接留着会导致部署报错。等你把 PKR 的 KV
# namespace 和 R2 bucket 移到这个新账号后，把下面取消注释、把 id 换成
# 新账号里的真实 ID 即可 —— resolveThreadsKv() 在绑定缺失时会优雅返回
# null，PKR 功能会正常显示"该国存储未绑定"而不是让别的国家一起崩掉，
# 所以先注释掉不会影响 INR 现在能正常工作。）===
# [[r2_buckets]]
# binding = "SCREENSHOTS_BUCKET_PKR"
# bucket_name = "pkr-issuescreenshot"
#
# [[kv_namespaces]]
# binding = "THREADS_KV_PKR"
# id = "c8ca68f7781a4f1b88d0997af023aec7"

# === PHP（暂时注释掉，原因同上 PKR ===
# [[r2_buckets]]
# binding = "SCREENSHOTS_BUCKET_PHP"
# bucket_name = "php-issuescreenshot"
#
# [[kv_namespaces]]
# binding = "THREADS_KV_PHP"
# id = "0e6719a9def74126ad2071feb919d625"

[vars]
# Bot Token 走 Cloudflare 加密 secret（不进这个文件/git），部署后要在
# Cloudflare 控制台 Settings → Environment variables 分别设置：
#   TELEGRAM_BOT_TOKEN_INR
#   TELEGRAM_BOT_TOKEN_PKR
#   TELEGRAM_BOT_TOKEN_PHP
# （PKR 现在这三个的值大概率还是空的——PKR 项目本来就是"群组还没配好"
# 的占位符状态，这个不是我漏填，是原项目就这样）

# Google Sheets 服务账号——如果三国原本用同一个服务账号，这里继续只
# 设一份即可：
# GOOGLE_SERVICE_ACCOUNT_EMAIL = "..."
# GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY = "..."

# 依然需要在 Cloudflare 控制台把 Build command 设成 "npm install"
# （telegramImageCompress.js 的 @cf-wasm/photon 依赖），这个和合并
# 无关，PKR 原项目本来就需要这一步。
