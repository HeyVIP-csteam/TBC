<style>
/* Inline placeholder canvas background — see promo.html for the full
   explanation; kept byte-for-byte in sync with style.css's html{} rule
   so there's zero visible change once the stylesheet finishes loading. */
html {
  background-color: #090c1c;
  background-image:
    linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
    url('/assets/img/bg-space.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
html[data-theme="light"] {
  background-color: #dbe7fb;
  background-image:
    radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),
    linear-gradient(160deg, #dbe7fb 0%, #d9cef4 45%, #cdbdf2 75%, #c4b2ee 100%);
}
</style>

<style>
  /* 2026-10-30 — same look as the other content pages (Deposit Issue,
     Promo Code Search, Report): --aa-* tokens from style.css, header band
     with icon tile, 18px cards, teal accent, unified inputs/table/buttons.
     Visual only — markup ids, script and data handling are unchanged. */
  .actlog-shell { max-width: 1800px; width: 100%; margin: 0 auto; padding: 0 24px 80px; display: flex; flex-direction: column; gap: 14px; color: var(--aa-ink); }

  .actlog-shell :is(.actlog-title-card, .actlog-filter-card, .actlog-results-card) {
    background: var(--aa-bg); border: 1px solid var(--aa-line-strong); border-radius: 18px; box-shadow: var(--aa-shadow); margin: 0;
  }

  /* header band */
  .actlog-title-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 20px; background: var(--aa-head) !important; }
  .actlog-title-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .actlog-title-left .header-icon {
    width: 46px; height: 46px; flex-shrink: 0; display: grid; place-items: center; margin: 0; border-radius: 13px; font-size: 21px; line-height: 1;
    background: color-mix(in srgb, var(--aa-accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--aa-accent) 30%, transparent);
  }
  .actlog-title-text { font-family: var(--font-display, "Space Grotesk", "Inter", sans-serif); font-size: 19px; font-weight: 700; color: var(--aa-ink); letter-spacing: -0.01em; }
  .actlog-title-sub { margin-top: 3px; font-size: 12.5px; color: var(--aa-ink-2); }

  /* Refresh — secondary button; turns red while a refresh is running (existing behaviour) */
  #actlogRefreshBtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 10px;
    background: var(--aa-surface-2); border: 1px solid var(--aa-line-strong); color: var(--aa-ink); font: 600 13px/1 inherit; cursor: pointer; box-shadow: none; transform: none;
    transition: background .15s, border-color .15s, color .15s;
  }
  #actlogRefreshBtn:hover { background: var(--aa-surface-hover); border-color: color-mix(in srgb, var(--aa-accent) 55%, transparent); transform: none; }
  #actlogRefreshBtn:focus-visible { outline: 2px solid var(--aa-accent); outline-offset: 2px; }
  #actlogRefreshBtn.is-refreshing {
    background: color-mix(in srgb, var(--aa-danger) 14%, transparent);
    border-color: color-mix(in srgb, var(--aa-danger) 50%, transparent);
    color: var(--aa-danger);
  }

  /* filters */
  .actlog-filter-card { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; padding: 16px 18px; overflow-x: auto; }
  .actlog-filter-card select,
  .actlog-filter-card input[type="text"] {
    height: 42px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; flex-shrink: 0;
    background: var(--aa-surface-2); border: 1px solid var(--aa-line-strong); color: var(--aa-ink); font-size: 13.5px; font-family: inherit;
    transition: border-color .15s, background .15s;
  }
  .actlog-filter-card input[type="text"]::placeholder { color: var(--aa-ink-3); }
  .actlog-filter-card select:focus,
  .actlog-filter-card input[type="text"]:focus { outline: none; border-color: var(--aa-accent); background: var(--aa-bg); }
  .actlog-filter-card select { cursor: pointer; padding-right: 8px; }
  .actlog-filter-card select option { background: var(--aa-bg); color: var(--aa-ink); }
  #actlogCategory { min-width: 170px; }
  #actlogAgentFilter { min-width: 180px; }
  #actlogSearch { flex: 1; min-width: 160px; }
  .actlog-filter-count {
    flex-shrink: 0; padding: 4px 10px; border-radius: 7px; white-space: nowrap;
    background: var(--aa-chip); border: 1px solid var(--aa-chip-line);
    font-family: var(--font-mono, "JetBrains Mono", ui-monospace, monospace); font-size: 11.5px; font-weight: 600; color: var(--aa-ink-2);
  }
  .actlog-filter-count:empty { display: none; }

  /* results card */
  .actlog-results-card { padding: 0; overflow: hidden; }
  .actlog-results-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    margin: 0; padding: 12px 18px; background: var(--aa-surface-2); border-bottom: 1px solid var(--aa-line);
  }
  .actlog-results-title { display: flex; align-items: center; gap: 8px; font-family: var(--font-display, "Space Grotesk", "Inter", sans-serif); font-weight: 700; font-size: 14px; color: var(--aa-ink); }
  .actlog-results-title .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--aa-online); box-shadow: 0 0 0 3px var(--aa-online-bg); flex-shrink: 0; }
  .actlog-results-right { display: flex; align-items: center; gap: 10px; }
  .actlog-results-card .ipa-page-size {
    height: 32px; padding: 0 8px; border-radius: 8px; background: var(--aa-bg); border: 1px solid var(--aa-line-strong);
    color: var(--aa-ink); font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .actlog-results-card .ipa-page-size:focus { outline: none; border-color: var(--aa-accent); }
  .actlog-found-pill {
    background: var(--aa-online-bg); color: var(--aa-online-ink); border: 1px solid var(--aa-online-line);
    font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
  }
  .actlog-found-pill:empty { display: none; }

  /* table — Detail takes the free width and wraps; every other column
     sizes to its content (avoids long Action text bleeding into Detail). */
  .actlog-table-wrap { overflow-x: auto; }
  .actlog-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  .actlog-table th, .actlog-table td {
    white-space: nowrap; padding: 11px 14px; vertical-align: top; text-align: left;
    border-bottom: 1px solid var(--aa-line);
  }
  .actlog-table :is(th + th, td + td) { border-left: 1px solid var(--aa-line); }
  .actlog-table th {
    position: sticky; top: 0; z-index: 1; background: var(--aa-surface-2);
    font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--aa-ink-3);
  }
  .actlog-table td { color: var(--aa-ink); }
  .actlog-table tbody tr:last-child td { border-bottom: 0; }
  .actlog-table tbody tr:hover td { background: var(--aa-surface-hover); }
  .actlog-table td:nth-child(1), .actlog-table td:nth-child(2) { font-variant-numeric: tabular-nums; color: var(--aa-ink-2); }
  .actlog-table th.actlog-col-detail,
  .actlog-table td.actlog-col-detail { width: 100%; min-width: 280px; white-space: normal; word-break: break-word; }
  .actlog-action { font-weight: 600; color: var(--aa-ink); }
  .actlog-ip { font-family: var(--font-mono, "JetBrains Mono", ui-monospace, monospace); color: var(--aa-ink-3); font-size: 12px; }

  /* long detail: clamp to 3 lines, click the row to expand */
  .actlog-detail { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; color: var(--aa-ink); }
  .actlog-detail.is-expanded { display: block; -webkit-line-clamp: unset; }
  tr[data-detail-row] { cursor: pointer; }

  /* pagination — same secondary buttons as the rest of the page */
  .actlog-results-card .ipa-pagination { margin: 0; padding: 12px 18px; gap: 12px; border-top: 1px solid var(--aa-line); }
  .actlog-results-card .ipa-page-link {
    height: 32px; padding: 0 14px; border-radius: 8px; text-decoration: none;
    background: var(--aa-surface-2); border: 1px solid var(--aa-line-strong); color: var(--aa-ink); font: 600 12.5px/1 inherit; cursor: pointer;
  }
  .actlog-results-card .ipa-page-link:hover:not(:disabled) { color: var(--aa-ink); border-color: color-mix(in srgb, var(--aa-accent) 55%, transparent); background: var(--aa-surface-hover); }
  .actlog-results-card .ipa-page-link:disabled { opacity: .45; cursor: default; }
  .actlog-results-card .ipa-page-status { color: var(--aa-ink-2); font-weight: 600; font-size: 12.5px; }

  /* empty / error state */
  #actlogEmpty { min-height: 160px; margin: 16px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--aa-ink-2); font-size: 13.5px; border: 1px dashed var(--aa-line-strong); border-radius: 14px; }
  .actlog-state.err { color: var(--aa-danger); }

  @media (max-width: 640px) {
    .actlog-shell { padding: 0 16px 60px; }
    .actlog-title-card { flex-wrap: wrap; }
    .actlog-filter-card { flex-wrap: wrap; }
    .actlog-filter-card :is(select, input[type="text"]) { width: 100%; min-width: 0 !important; flex: 1 1 100%; }
  }
</style>

<body class="subpage-fixed">
  <header class="topbar">

      <span class="wordmark">CS TEAM - TBC</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <button class="theme-pill" id="themeToggle"></button>

  <div class="subpage-shell">
    <aside class="sidebar" id="hubNavMount"></aside>

    <div class="subpage-right-col">
      <div id="announcementBanner"></div>
      <main class="subpage-main">

  <div class="actlog-shell">
    <div class="actlog-title-card">
      <div class="actlog-title-left">
        <span class="header-icon">🔎</span>
        <div>
          <div class="actlog-title-text">Activity Logs</div>
          <div class="actlog-title-sub">Who did what, when, and from where — 90-day retention</div>
        </div>
      </div>
      <button type="button" id="actlogRefreshBtn" title="Refresh">↻ Refresh</button>
    </div>

    <div class="actlog-filter-card">
      <select id="actlogCategory">
        <option value="">All categories</option>
        <option value="Auth">🔐 Auth</option>
        <option value="Account">👤 Account</option>
        <option value="Thread">🎫 Thread</option>
        <option value="Config">⚙️ Config</option>
      </select>
      <input type="text" id="actlogAgentFilter" placeholder="Filter by agent…" autocomplete="off" />
      <input type="text" id="actlogSearch" placeholder="Search action or detail…" autocomplete="off" />

    </div>

    <div class="actlog-results-card">

        <div class="actlog-results-right">
          <select class="ipa-page-size" id="actlogPageSize" autocomplete="off" style="display:none;">
            <option value="10" selected>10 / page</option>
            <option value="20">20 / page</option>

      </div>

      <div id="actlogTableArea"></div>

    </div>

  <script src="/assets/schemas.js?v=c135f22f"></script>
  <script src="/assets/hub-nav.js?v=c712b8aa"></script>
  <script src="/assets/brand-row.js?v=ea371f55"></script>
  <script>
    window.initThemeToggle();
    window.initClock();
    window.AgentAuth.renderWhoami("agentWhoami");
    window.HubNav.mount("hubNavMount", {});
    window.BrandRow.mount("pageBrandRow");

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    const categorySelect = document.getElementById("actlogCategory");
    const agentFilterInput = document.getElementById("actlogAgentFilter");
    const searchInput = document.getElementById("actlogSearch");
    const filterCountEl = document.getElementById("actlogFilterCount");
    const pageSizeSelect = document.getElementById("actlogPageSize");
    const foundPillEl = document.getElementById("actlogFoundPill");
    const tableArea = document.getElementById("actlogTableArea");
    const emptyEl = document.getElementById("actlogEmpty");
    const paginationEl = document.getElementById("actlogPagination");
    const refreshBtn = document.getElementById("actlogRefreshBtn");

    let allEntries = [];
    let actlogPage = 1;
    let actlogPageSize = 10; // 10 / 20 / 30 — matches this project's own ipa-page-size default (see IP Access page)

    // Belt-and-suspenders against Chrome/Firefox's own "restore this
    // control's value across a plain refresh" behavior — that's a
    // browser feature independent of autocomplete="off" support (which
    // isn't 100% consistent for <select> across browsers/versions), so
    // force it back to the real default on every load regardless of
    // whatever the browser tried to restore it to.
    pageSizeSelect.value = "10";

    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    function formatDateTime(ts) {
      const d = new Date(ts);
      const date = d.toLocaleDateString(undefined, { year: "numeric", month: "2-digit", day: "2-digit" });
      const time = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      return { date, time };
    }

    function getFiltered() {
      const category = categorySelect.value;
      const agentQuery = agentFilterInput.value.trim().toLowerCase();
      const searchQuery = searchInput.value.trim().toLowerCase();
      return allEntries.filter((e) => {
        if (category && e.category !== category) return false;
        if (agentQuery && !(e.agent || "").toLowerCase().includes(agentQuery)) return false;
        if (searchQuery) {
          const hay = `${e.action || ""} ${e.detail || ""}`.toLowerCase();
          if (!hay.includes(searchQuery)) return false;
        }
        return true;
      });
    }

    function renderRow(e) {
      const { date, time } = formatDateTime(e.ts);
      return `
        <tr data-detail-row>
          <td>${escapeHtml(date)}</td>
          <td>${escapeHtml(time)}</td>
          <td>${escapeHtml(e.agent || "unknown")}</td>
          <td class="actlog-action">${escapeHtml(e.action || "")}</td>
          <td class="actlog-col-detail"><div class="actlog-detail">${escapeHtml(e.detail || "")}</div></td>
          <td class="actlog-ip">${escapeHtml(e.ip || "")}</td>
        </tr>`;
    }

    function render() {
      const filtered = getFiltered();

      filterCountEl.textContent = `${filtered.length} of ${allEntries.length}`;
      foundPillEl.textContent = `${filtered.length} found`;
      pageSizeSelect.style.display = filtered.length ? "" : "none";

      if (!filtered.length) {
        tableArea.innerHTML = "";
        emptyEl.style.display = "flex";
        emptyEl.textContent = allEntries.length ? "No activity matches your filters." : "No activity recorded yet.";
        paginationEl.style.display = "none";
        return;
      }
      emptyEl.style.display = "none";

      const totalPages = Math.max(1, Math.ceil(filtered.length / actlogPageSize));
      if (actlogPage > totalPages) actlogPage = totalPages; // filtered list shrank past the current page — clamp back
      const start = (actlogPage - 1) * actlogPageSize;
      const pageEntries = filtered.slice(start, start + actlogPageSize);

      tableArea.innerHTML = `
        <div class="actlog-table-wrap">
          <table class="actlog-table">
            <thead>
              <tr>
                <th>Date</th><th>Time</th><th>Agent</th><th>Action</th>
                <th class="actlog-col-detail">Detail</th><th>IP</th>
              </tr>
            </thead>
            <tbody>${pageEntries.map(renderRow).join("")}</tbody>
          </table>
        </div>`;

      if (filtered.length > actlogPageSize) {
        paginationEl.style.display = "flex";
        paginationEl.innerHTML = `
          <button type="button" class="ipa-page-link" data-page-prev${actlogPage <= 1 ? " disabled" : ""}>Previous</button>
          <span class="ipa-page-status">Page ${actlogPage} of ${totalPages}</span>
          <button type="button" class="ipa-page-link" data-page-next${actlogPage >= totalPages ? " disabled" : ""}>Next</button>`;
      } else {
        paginationEl.style.display = "none";
      }
    }

    tableArea.addEventListener("click", (e) => {
      const row = e.target.closest("tr[data-detail-row]");
      if (row) row.querySelector(".actlog-detail")?.classList.toggle("is-expanded");
    });

    paginationEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".ipa-page-link");
      if (!btn || btn.disabled) return;
      actlogPage += btn.hasAttribute("data-page-next") ? 1 : -1;
      render();
    });

    categorySelect.addEventListener("change", () => { actlogPage = 1; render(); });
    agentFilterInput.addEventListener("input", debounce(() => { actlogPage = 1; render(); }, 150));
    searchInput.addEventListener("input", debounce(() => { actlogPage = 1; render(); }, 150));
    pageSizeSelect.addEventListener("change", (e) => {
      actlogPageSize = Number(e.target.value);
      actlogPage = 1;
      render();
    });

    async function load() {
      if (refreshBtn.disabled) return; // prevent double-click stacking
      refreshBtn.classList.add("is-refreshing");
      refreshBtn.disabled = true;
      refreshBtn.textContent = "⏳ Loading…"; // red + label change, no rotation
      const startedAt = Date.now();
      const MIN_VISIBLE_MS = 400; // a fast response still shows the red state briefly, so it never looks like nothing happened
      try {
        const res = await window.AgentAuth.authFetch("/api/admin/activity-logs", { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) {
          tableArea.innerHTML = "";
          emptyEl.style.display = "flex";
          emptyEl.className = "actlog-state err";
          emptyEl.textContent = data.error || "Failed to load activity logs.";
          paginationEl.style.display = "none";
          filterCountEl.textContent = "";
          foundPillEl.textContent = "";
          return;
        }
        allEntries = data.entries || [];
        render();
      } catch {
        tableArea.innerHTML = "";
        emptyEl.style.display = "flex";
        emptyEl.className = "actlog-state err";
        emptyEl.textContent = "Failed to load — check your connection.";
        paginationEl.style.display = "none";
      } finally {
        // Red clears on BOTH success and failure — the button itself
        // isn't what reports the error (the card's own error text
        // does), it's only ever "in progress" vs "idle".
        const elapsed = Date.now() - startedAt;
        if (elapsed < MIN_VISIBLE_MS) await new Promise((r) => setTimeout(r, MIN_VISIBLE_MS - elapsed));
        refreshBtn.classList.remove("is-refreshing");
        refreshBtn.disabled = false;
        refreshBtn.textContent = "↻ Refresh";
      }
    }

    refreshBtn.addEventListener("click", load);
    load();
  </script>
</body>
