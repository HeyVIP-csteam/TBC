<style>
/* Inline placeholder canvas background — see promo.html for the full
   explanation; kept byte-for-byte in sync with style.css's html{} rule
   so there's zero visible change once the stylesheet finishes loading. */
html {
  background-color: #090c1c;
  background-image:
    linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
    url('/assets/img/bg-space.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
html[data-theme="light"] {
  background-color: #dbe7fb;
  background-image:
    radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),

}

<style>
  /* Three visually separate cards (own radius/border/shadow each), not
     one big card split into sections — matches Promo Code Search's own
     card rhythm. */
  .actlog-shell { max-width: 1800px; width: 100%; margin: 0 auto; padding: 0 24px 80px; }

  .actlog-title-card {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 22px; margin-bottom: 16px;
  }
  .actlog-title-left { display: flex; align-items: flex-start; gap: 10px; }
  .actlog-title-left .header-icon { font-size: 20px; line-height: 1; margin-top: -1px; flex-shrink: 0; }
  .actlog-title-text { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink); }
  .actlog-title-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  .actlog-filter-card {
    display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px 18px; margin-bottom: 16px; overflow-x: auto;
  }
  .actlog-filter-card select,
  .actlog-filter-card input[type="text"] {
    background: var(--field-bg); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 8px 12px; font-size: 12.5px; color: var(--ink); font-family: inherit; flex-shrink: 0;
  }
  .actlog-filter-card select:focus,
  .actlog-filter-card input[type="text"]:focus { outline: none; border-color: var(--accent-gold); }
  .actlog-filter-card select { cursor: pointer; }
  #actlogCategory { min-width: 150px; }
  #actlogAgentFilter { min-width: 150px; }
  #actlogSearch { flex: 1; min-width: 160px; }
  .actlog-filter-count {
    flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: var(--ink-soft);
    white-space: nowrap;
  }

  .actlog-results-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px 18px;
  }
  .actlog-results-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .actlog-results-title {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-display); font-weight: 700; font-size: 13.5px; color: var(--ink);
  }
  .actlog-results-title .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  .actlog-results-right { display: flex; align-items: center; gap: 10px; }
  .actlog-found-pill {
    background: rgba(34, 197, 94, 0.14); color: #16a34a; font-size: 11.5px;
    font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }

  /* Table column widths — NOT written as fixed percentages. Every
     column except Detail is white-space:nowrap with no width set, so
     the browser sizes each to its own content's minimum; Detail alone
     gets width:100% to soak up the rest and wraps normally. This is
     the fix for long badge-like Action text (e.g. "TG Route Changed")
     overflowing a hard-coded percentage column and bleeding into its
     neighbor. */
  .actlog-table-wrap { overflow-x: auto; }
  .actlog-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .actlog-table th, .actlog-table td {
    white-space: nowrap; padding: 10px 10px; vertical-align: top;
    border-top: 1px solid var(--border);
    /* Vertical divider between every column — both header and body
       cells, so the line runs unbroken from the header straight down
       through each row. Dropped on the last column (IP) since a
       trailing divider against the card's own edge looks like a stray
       line rather than a separator. */
    border-right: 1px solid var(--border);
  }
  .actlog-table th:last-child, .actlog-table td:last-child { border-right: none; }
  .actlog-table th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--ink-soft); font-weight: 700; background: var(--field-bg);
    border-top: none; position: sticky; top: 0;
  }
  .actlog-table tr:first-child td { border-top: 1px solid var(--border); }
  .actlog-table th.actlog-col-detail,
  .actlog-table td.actlog-col-detail { width: 100%; white-space: normal; word-break: break-word; }
  .actlog-action { font-weight: 600; color: var(--ink); }
  .actlog-ip { font-family: var(--font-mono); color: var(--ink-soft); font-size: 11.5px; }

  /* Long detail text (edit/recall diffs) — clamp to 3 lines by
     default, click the row to expand. No modal needed. */
  .actlog-detail {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; cursor: pointer; color: var(--ink);
  }
  .actlog-detail.is-expanded { display: block; -webkit-line-clamp: unset; }
  tr[data-detail-row] { cursor: pointer; }

  /* Refresh button — deliberately NOT the site's usual spin animation
     (see threads.html's #refreshBtn). Per this page's own request: on
     click it turns solid red immediately (so a fast response still
     reads as "something happened"), then reverts to the normal look
     once the refresh finishes — success or failure both clear it, only
     the wording of the button itself differs by outcome via JS. */
  #actlogRefreshBtn.is-refreshing {
    background: rgba(224, 87, 122, 0.16);
    border-color: rgba(224, 87, 122, 0.55);
    color: #e0577a;
  }

  /* Only the empty-state placeholder text gets a min-height (roughly 3
     lines) so it doesn't collapse to a single line — the card itself
     is left to size naturally from however many rows actually render,
     with no min-height on the card, so a short page of results doesn't
     leave a big empty gap underneath. */
  #actlogEmpty { min-height: 160px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
  .actlog-state.err { color: #e0577a; }

  @media (max-width: 640px) {
    .actlog-title-card { flex-direction: column; }
    .actlog-filter-card { flex-wrap: wrap; }
    #actlogSearch { width: 100%; }
  }
</style>

<body class="subpage-fixed">
  <header class="topbar">
    <div class="topbar-left">

      <span class="wordmark">PKR CS TEAM - TBC</span>

    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <button class="theme-pill" id="themeToggle"></button>
      <span class="agent-whoami" id="agentWhoami"></span>

  </header>

  <div class="subpage-shell">
    <aside class="sidebar" id="hubNavMount"></aside>
    <div class="subpage-content-col">
      <nav class="brand-row" id="pageBrandRow"><div class="brand-row-track"></div></nav>
    <div class="subpage-right-col">
      <div id="announcementBanner"></div>
      <main class="subpage-main">

  <div class="actlog-shell">
    <div class="actlog-title-card">
      <div class="actlog-title-left">
        <span class="header-icon">🔎</span>
        <div>
          <div class="actlog-title-text">Activity Logs</div>
          <div class="actlog-title-sub">Who did what, when, and from where — 90-day retention</div>
        </div>
      </div>
      <button type="button" class="icon-btn labeled" id="actlogRefreshBtn" title="Refresh">↻ Refresh</button>
    </div>

    <div class="actlog-filter-card">
      <select id="actlogCategory">
        <option value="">All categories</option>
        <option value="Auth">🔐 Auth</option>
        <option value="Account">👤 Account</option>
        <option value="Thread">🎫 Thread</option>
        <option value="Config">⚙️ Config</option>
      </select>
      <input type="text" id="actlogAgentFilter" placeholder="Filter by agent…" autocomplete="off" />
      <input type="text" id="actlogSearch" placeholder="Search action or detail…" autocomplete="off" />
      <span class="actlog-filter-count" id="actlogFilterCount"></span>
    </div>

    <div class="actlog-results-card">
      <div class="actlog-results-head">
        <div class="actlog-results-title"><span class="status-dot"></span> Recent activity</div>
        <div class="actlog-results-right">
          <select class="ipa-page-size" id="actlogPageSize" autocomplete="off" style="display:none;">
            <option value="10" selected>10 / page</option>
            <option value="20">20 / page</option>
            <option value="30">30 / page</option>
          </select>
          <span class="actlog-found-pill" id="actlogFoundPill"></span>
        </div>
      </div>

      <div id="actlogTableArea"></div>
      <div id="actlogEmpty" style="display:none;"></div>

      <div class="ipa-pagination" id="actlogPagination" style="display:none;"></div>
    </div>
  </div>

      </main>
    </div>
    </div>
  </div>

  <script src="/assets/schemas.js?v=189eea70"></script>
  <script src="/assets/hub-nav.js?v=b4fd698d"></script>
  <script src="/assets/brand-row.js?v=ea371f55"></script>
  <script>
    window.initThemeToggle();
    window.initClock();
    window.AgentAuth.renderWhoami("agentWhoami");
    window.HubNav.mount("hubNavMount", {});
    window.BrandRow.mount("pageBrandRow");

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    const categorySelect = document.getElementById("actlogCategory");
    const agentFilterInput = document.getElementById("actlogAgentFilter");
    const searchInput = document.getElementById("actlogSearch");
    const filterCountEl = document.getElementById("actlogFilterCount");
    const pageSizeSelect = document.getElementById("actlogPageSize");
    const foundPillEl = document.getElementById("actlogFoundPill");
    const tableArea = document.getElementById("actlogTableArea");
    const emptyEl = document.getElementById("actlogEmpty");
    const paginationEl = document.getElementById("actlogPagination");
    const refreshBtn = document.getElementById("actlogRefreshBtn");

    let allEntries = [];
    let actlogPage = 1;
    let actlogPageSize = 10; // 10 / 20 / 30 — matches this project's own ipa-page-size default (see IP Access page)

    // Belt-and-suspenders against Chrome/Firefox's own "restore this
    // control's value across a plain refresh" behavior — that's a
    // browser feature independent of autocomplete="off" support (which
    // isn't 100% consistent for <select> across browsers/versions), so
    // force it back to the real default on every load regardless of
    // whatever the browser tried to restore it to.
    pageSizeSelect.value = "10";

    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    function formatDateTime(ts) {
      const d = new Date(ts);
      const date = d.toLocaleDateString(undefined, { year: "numeric", month: "2-digit", day: "2-digit" });
      const time = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      return { date, time };
    }

    function getFiltered() {
      const category = categorySelect.value;
      const agentQuery = agentFilterInput.value.trim().toLowerCase();
      const searchQuery = searchInput.value.trim().toLowerCase();
      return allEntries.filter((e) => {
        if (category && e.category !== category) return false;
        if (agentQuery && !(e.agent || "").toLowerCase().includes(agentQuery)) return false;
        if (searchQuery) {
          const hay = `${e.action || ""} ${e.detail || ""}`.toLowerCase();
          if (!hay.includes(searchQuery)) return false;
        }
        return true;
      });
    }

    function renderRow(e) {
      const { date, time } = formatDateTime(e.ts);
      return `
        <tr data-detail-row>
          <td>${escapeHtml(date)}</td>
          <td>${escapeHtml(time)}</td>
          <td>${escapeHtml(e.agent || "unknown")}</td>
          <td class="actlog-action">${escapeHtml(e.action || "")}</td>
          <td class="actlog-col-detail"><div class="actlog-detail">${escapeHtml(e.detail || "")}</div></td>
          <td class="actlog-ip">${escapeHtml(e.ip || "")}</td>
        </tr>`;
    }

    function render() {
      const filtered = getFiltered();

      filterCountEl.textContent = `${filtered.length} of ${allEntries.length}`;
      foundPillEl.textContent = `${filtered.length} found`;
      pageSizeSelect.style.display = filtered.length ? "" : "none";

      if (!filtered.length) {
        tableArea.innerHTML = "";
        emptyEl.style.display = "flex";
        emptyEl.textContent = allEntries.length ? "No activity matches your filters." : "No activity recorded yet.";
        paginationEl.style.display = "none";
        return;
      }
      emptyEl.style.display = "none";

      const totalPages = Math.max(1, Math.ceil(filtered.length / actlogPageSize));
      if (actlogPage > totalPages) actlogPage = totalPages; // filtered list shrank past the current page — clamp back
      const start = (actlogPage - 1) * actlogPageSize;
      const pageEntries = filtered.slice(start, start + actlogPageSize);

      tableArea.innerHTML = `
        <div class="actlog-table-wrap">
          <table class="actlog-table">
            <thead>
              <tr>
                <th>Date</th><th>Time</th><th>Agent</th><th>Action</th>
                <th class="actlog-col-detail">Detail</th><th>IP</th>
              </tr>
            </thead>
            <tbody>${pageEntries.map(renderRow).join("")}</tbody>
          </table>
        </div>`;

      if (filtered.length > actlogPageSize) {
        paginationEl.style.display = "flex";
        paginationEl.innerHTML = `
          <button type="button" class="ipa-page-link" data-page-prev${actlogPage <= 1 ? " disabled" : ""}>Previous</button>
          <span class="ipa-page-status">Page ${actlogPage} of ${totalPages}</span>
          <button type="button" class="ipa-page-link" data-page-next${actlogPage >= totalPages ? " disabled" : ""}>Next</button>`;
      } else {
        paginationEl.style.display = "none";
      }
    }

    tableArea.addEventListener("click", (e) => {
      const row = e.target.closest("tr[data-detail-row]");
      if (row) row.querySelector(".actlog-detail")?.classList.toggle("is-expanded");
    });

    paginationEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".ipa-page-link");
      if (!btn || btn.disabled) return;
      actlogPage += btn.hasAttribute("data-page-next") ? 1 : -1;
      render();
    });

    categorySelect.addEventListener("change", () => { actlogPage = 1; render(); });
    agentFilterInput.addEventListener("input", debounce(() => { actlogPage = 1; render(); }, 150));
    searchInput.addEventListener("input", debounce(() => { actlogPage = 1; render(); }, 150));
    pageSizeSelect.addEventListener("change", (e) => {
      actlogPageSize = Number(e.target.value);
      actlogPage = 1;
      render();
    });

    async function load() {
      if (refreshBtn.disabled) return; // prevent double-click stacking
      refreshBtn.classList.add("is-refreshing");
      refreshBtn.disabled = true;
      refreshBtn.textContent = "⏳ Loading…"; // red + label change, no rotation
      const startedAt = Date.now();
      const MIN_VISIBLE_MS = 400; // a fast response still shows the red state briefly, so it never looks like nothing happened
      try {
        const res = await window.AgentAuth.authFetch("/api/admin/activity-logs", { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) {
          tableArea.innerHTML = "";
          emptyEl.style.display = "flex";
          emptyEl.className = "actlog-state err";
          emptyEl.textContent = data.error || "Failed to load activity logs.";
          paginationEl.style.display = "none";
          filterCountEl.textContent = "";
          foundPillEl.textContent = "";
          return;
        }
        allEntries = data.entries || [];
        render();
      } catch {
        tableArea.innerHTML = "";
        emptyEl.style.display = "flex";
        emptyEl.className = "actlog-state err";
        emptyEl.textContent = "Failed to load — check your connection.";
        paginationEl.style.display = "none";
      } finally {
        // Red clears on BOTH success and failure — the button itself
        // isn't what reports the error (the card's own error text
        // does), it's only ever "in progress" vs "idle".
        const elapsed = Date.now() - startedAt;
        if (elapsed < MIN_VISIBLE_MS) await new Promise((r) => setTimeout(r, MIN_VISIBLE_MS - elapsed));
        refreshBtn.classList.remove("is-refreshing");
        refreshBtn.disabled = false;
        refreshBtn.textContent = "↻ Refresh";
      }
    }

    refreshBtn.addEventListener("click", load);
    load();
  </script>
</body>
</html>
