<style>
/* Inline placeholder canvas background — first thing the browser parses
   in <head>, so it paints before any network request (external CSS, the
   photo itself) resolves. Values are hard-coded here (can't use var()
   yet — style.css may not have loaded) but are kept in exact sync with
   the "real" html{}/html[data-theme=light]{} rule in style.css, so the
   moment that stylesheet finishes loading there is zero visible change.
   Must stay inline and first — an external <link> here would leave a
   blank gap for a network round trip before anything paints. Only sets
   background on <html>, never <body>: <body> has its own
   theme-toggle transition, and animating from this photo to some other
   background would try to interpolate image -> gradient, which browsers
   can't do and would just look like a broken flash. */
html {
  background-color: #090c1c;
  background-image:
    linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
    url('/assets/img/bg-space.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
html[data-theme="light"] {
  background-color: #dbe7fb;
  background-image:
    radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),
    linear-gradient(160deg, #dbe7fb 0%, #d9cef4 45%, #cdbdf2 75%, #c4b2ee 100%);
}
</style>

<body class="subpage-fixed">

    <div class="topbar-left">

    </div>

      <button class="theme-pill" id="themeToggle"></button>
      <span class="agent-whoami" id="agentWhoami"></span>

    <div class="subpage-right-col">

      <form id="issueForm">

        <div id="dynamicFields"></div>

          <input type="file" id="fileInput" multiple hidden />
        </div>

        <div class="field">

          <input type="text" name="reporter" required placeholder="Your agent name..." autocomplete="off" />

        </div>

        <div class="form-actions">
          <button type="submit" class="btn-submit" id="submitBtn">
            <span>📨</span><span id="submitLabel">Submit</span>
          </button>
          <span id="statusMsg" class="status-msg"></span>
        </div>
      </form>
    </div>
      </div>
      </main>
    </div>
    </div>
  </div>

  <script src="/assets/schemas.js?v=3f70df87"></script>

  <script src="/assets/app.js?v=6f370b0e"></script>
  <script>
    window.HubNav.mount("hubNavMount", { activeModule: new URLSearchParams(location.search).get("module") });
    window.BrandRow.mount("pageBrandRow");
    // Switching country here would leave half the form (brand dropdown,
    // optionsByBrand-driven selects, fixedAmounts) pointing at the OLD
    // country's data structures that app.js already built the DOM from —
    // simplest correct fix is a full reload with the new country already
    // persisted (agent-country.js's setCountry() runs before this), same
    // as picking a different module link would naturally do.
    if (window.AgentCountry) window.AgentCountry.renderSwitcher("countrySwitcherMount", () => location.reload());
  </script>
