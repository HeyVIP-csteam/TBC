     then the data (summary cards + ranking, or one module table).

<style id="reportStyles">
  /* Report-only tokens, scoped to .rp so nothing else in the app changes.

    --rp-ink-3: #6e7797;
    --rp-accent: #8b7cf6;
    --rp-accent-soft: rgba(139, 124, 246, 0.16);
    --rp-accent-ink: #c9c1ff;
    --rp-danger: #f2708a;
    --rp-danger-soft: rgba(242, 112, 138, 0.12);
    --rp-warn: #f5b84b;

      --rp-ink: #161b38;
      --rp-ink-2: #4c5576;
      --rp-ink-3: #7c84a2;
      --rp-accent: #5b4bd8;

      --rp-warn-soft: rgba(214, 140, 20, 0.10);
      --rp-gold: #c8901f;
      --rp-silver: #7d879f;
      --rp-bronze: #a8693a;
      --rp-shadow: 0 1px 2px rgba(20, 30, 80, 0.05), 0 10px 28px -20px rgba(20, 30, 80, 0.35);

    --rp-warn-soft: rgba(214, 140, 20, 0.10);
    --rp-gold: #c8901f;
    --rp-silver: #7d879f;
    --rp-bronze: #a8693a;

  .rp, .rp * { box-sizing: border-box; }
  .rp {

    padding-block: 20px 72px; padding-inline: 24px;

  .rp-head-text { min-width: 0; }

  .rp-toolbar {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px;

  .rp-seg { display: inline-flex; height: var(--rp-h); padding: 3px; gap: 2px; background: var(--rp-surface-2); border: 1px solid var(--rp-line); border-radius: var(--rp-r-md); }
  .rp-seg button {
    border: 0; background: transparent; color: var(--rp-ink-2); font: 600 13px/1 var(--rp-font);
    padding: 0 12px; border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  .rp-seg button:hover { color: var(--rp-ink); }
  .rp-seg button.active { background: var(--rp-accent-soft); color: var(--rp-accent-ink); box-shadow: inset 0 0 0 1px var(--rp-accent); }
  .rp-select { position: relative; display: block; }
  .rp-select select {
    appearance: none; -webkit-appearance: none; height: var(--rp-h); width: 100%; min-width: 210px; max-width: 280px;
    padding: 0 34px 0 12px; border-radius: var(--rp-r-md); border: 1px solid var(--rp-line-strong);
    background: var(--rp-surface-2); color: var(--rp-ink); font: 500 13px/1 var(--rp-font); cursor: pointer;
    text-overflow: ellipsis;
  }
  .rp-select select:hover { border-color: var(--rp-accent); }
  .rp-select::after {
    content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; margin-top: -5px;
    border-right: 1.5px solid var(--rp-ink-2); border-bottom: 1.5px solid var(--rp-ink-2); transform: rotate(45deg); pointer-events: none;
  }
  .rp-select select option { background: var(--rp-surface); color: var(--rp-ink); }
  .rp-select select option:disabled { color: var(--rp-ink-3); }
  /* Custom range — same #customRange / #fromDate / #toDate the page already uses */
  .report-custom-range { display: none; align-items: flex-end; gap: 8px; }
  .report-custom-range.open { display: flex; }
  .report-custom-range .arrow { height: var(--rp-h); display: flex; align-items: center; color: var(--rp-ink-3); }
  .rp input[type="date"] {
    height: var(--rp-h); padding: 0 10px; border-radius: var(--rp-r-md); border: 1px solid var(--rp-line-strong);
    background: var(--rp-surface-2); color: var(--rp-ink); font: 500 13px/1 var(--rp-font);
  }
  .rp-spacer { flex: 1 1 0; }
  .rp-total { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 120px; }

  .rp-total .num { font-family: var(--rp-font-display); font-size: 26px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .rp-status { display: inline-flex; align-items: center; gap: 6px; height: var(--rp-h); font-size: 12px; color: var(--rp-ink-2); }
  .rp-status[hidden] { display: none; }
  .rp-spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rp-line-strong); border-top-color: var(--rp-accent); animation: rp-spin .8s linear infinite; }
  @keyframes rp-spin { to { transform: rotate(360deg); } }

  /* ---- states ---- */
  #reportContainer { display: flex; flex-direction: column; gap: 14px; transition: opacity .15s; min-width: 0; }
  #reportContainer.is-refreshing { opacity: .55; pointer-events: none; }
  .report-state {
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
    padding: 36px 20px; color: var(--rp-ink-2); font-size: 13.5px;
    background: var(--rp-surface); border: 1px solid var(--rp-line); border-radius: var(--rp-r-lg);
  }
  .report-state .st-title { color: var(--rp-ink); font-weight: 600; font-size: 14px; }

  .report-state.err .st-title { color: var(--rp-danger); }

  .rp-banner {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--rp-r-md);
    background: var(--rp-warn-soft); border: 1px solid color-mix(in srgb, var(--rp-warn) 40%, transparent);
    color: var(--rp-ink); font-size: 13px;
  }
  .rp-banner b { color: var(--rp-warn); }
  .rp-skel { background: var(--rp-surface); border: 1px solid var(--rp-line); border-radius: var(--rp-r-lg); position: relative; overflow: hidden; }
  .rp-skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--rp-ink) 5%, transparent), transparent); animation: rp-shimmer 1.3s infinite; }
  @keyframes rp-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  .summary-card {
    --m-accent: var(--rp-accent);
    display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; min-width: 0;
    padding: 14px 16px 12px; border-radius: var(--rp-r-lg); cursor: pointer;
    background: var(--rp-surface); border: 1px solid var(--rp-line); color: var(--rp-ink); box-shadow: var(--rp-shadow);
    font: inherit; transition: border-color .12s, background .12s, transform .12s;

  .summary-card:hover { border-color: var(--rp-line-strong); background: var(--rp-surface-2); }

  .summary-card .sc-num { font-family: var(--rp-font-display); font-size: 30px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--rp-ink); }

  .summary-card:hover .sc-cta, .summary-card.selected .sc-cta { color: var(--m-accent); }

  /* ---- tables (ranking + module detail) ---- */
  .report-card { background: var(--rp-surface); border: 1px solid var(--rp-line); border-radius: var(--rp-r-lg); box-shadow: var(--rp-shadow); overflow: hidden; min-width: 0; }
  .rcard-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--rp-line); }
  .rcard-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .rcard-title h2 { margin: 0; font-family: var(--rp-font-display); font-size: 15px; font-weight: 600; color: var(--rp-ink); }
  .rcard-title .by { color: var(--rp-ink-3); font-weight: 500; font-size: 13px; }

  .rcard-head .sub b { color: var(--rp-ink); font-variant-numeric: tabular-nums; }
  .icon-tile { width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; background: color-mix(in srgb, var(--m-accent, var(--rp-accent)) 16%, transparent); }
  .rtable { overflow-x: auto; }
  .rtable-inner { min-width: 460px; }
  .rgrid { display: grid; grid-template-columns: 28px minmax(0, 1.6fr) minmax(80px, 1fr) 72px; align-items: center; gap: 12px; padding: 0 18px; }
  .rlist-head { height: 34px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--rp-ink-3); background: var(--rp-surface-2); border-bottom: 1px solid var(--rp-line); }
  .rlist-head .c-count, .rlist-foot .c-count { text-align: right; }

  .rrow-chevron { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--rp-ink-3); transition: transform .15s; }

  <script>
    window.initThemeToggle();
    window.initClock();
    window.AgentAuth.renderWhoami("agentWhoami");
    window.HubNav.mount("hubNavMount", { activeModule: "report" });
    window.BrandRow.mount("pageBrandRow");

  /* ====================================================================
     2026-10-12 REDESIGN — data handling is unchanged from the previous
     version: one GET /api/admin/report per date-range change (module and
     country are client-side filters), the same grouping/ranking/brand
     matching/country lock, and the same self-contained HTML export.
     What changed is presentation: summary cards, ranking table, and the
     brand × (issue type | day) matrix that replaced the expandable chips
     — the matrix only re-arranges rows already fetched (each row carries
     its date), so totals are identical. Export reuses these same
     functions via .toString(), so the downloaded file matches the page.
     ==================================================================== */
  const EXCLUDED_MODULES = ["daily_report"];
  const REPORT_MODULE_LIST = (window.MODULES || []).filter((m) => !EXCLUDED_MODULES.includes(m.id));
  const MODULE_BY_ID = {};
  REPORT_MODULE_LIST.forEach((m) => { MODULE_BY_ID[m.id] = m; });

  const COUNTRY_COLORS = { INR: "#4ADE80", PKR: "#38BDF8", PHP: "#F472B6" };
  const BRAND_PALETTE = ["#38BDF8", "#A78BFA", "#4ADE80", "#FB923C", "#F472B6", "#FBBF24", "#F87171", "#34D399", "#818CF8"];
  function brandColor(brandId) {
    const ids = (window.BRANDS || []).map((b) => b.id);
    const idx = ids.indexOf(brandId);
    return BRAND_PALETTE[(idx >= 0 ? idx : 0) % BRAND_PALETTE.length];
  }
  function brandName(brandId) {
    const b = (window.BRANDS || []).find((x) => x.id === brandId);
    return b ? b.name : (brandId || "(unknown)");
  }

  const moduleSelect = document.getElementById("moduleSelect");
  moduleSelect.innerHTML =
    `<option value="ALL_MODULES">🗂️ All</option>` +
    REPORT_MODULE_LIST.map((m) => {
      const phpOnly = Array.isArray(m.countries) && m.countries.length === 1 && m.countries[0] === "PHP";
      return `<option value="${m.id}">${m.icon} ${m.name}${phpOnly ? " (PHP only)" : ""}</option>`;
    }).join("");
  const countrySelect = document.getElementById("countrySelect");
  countrySelect.innerHTML =
    `<option value="ALL">All</option>` +
    (window.COUNTRY_CODES || []).map((c) => `<option value="${c}">${c}</option>`).join("");

  const state = { range: "today", moduleId: "ALL_MODULES", country: "ALL", selectedDim: null, view: "type" };
  let allRows = [];
  let lastError = null;
  let lastPartialErrors = null;
  let hasRendered = false; // NEW (visual only): keep old results on screen while a new range loads

  const REPORT_TZ_OFFSET_MS = 8 * 60 * 60 * 1000; // GMT+8
  function pad2(n) { return String(n).padStart(2, "0"); }
  function gmt8Now() { return new Date(Date.now() + REPORT_TZ_OFFSET_MS); }
  function todayStr() {
    const d = gmt8Now();
    return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
  }
  function monthRangeStrs() {
    const now = gmt8Now();
    const from = `${now.getUTCFullYear()}-${pad2(now.getUTCMonth() + 1)}-01`;
    return { from, to: todayStr() };
  }
  function currentFromTo() {
    if (state.range === "today") return { from: todayStr(), to: todayStr() };
    if (state.range === "month") return monthRangeStrs();
    return { from: document.getElementById("fromDate").value, to: document.getElementById("toDate").value };
  }
  function formatDateDisplay(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(Date.UTC(y, (m || 1) - 1, d || 1));
    return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  }
  function matrixDateBounds() { return currentFromTo(); }
  function rangeLabel() {
    const { from, to } = currentFromTo();
    if (!from || !to) return "Custom range";
    const modePrefix = state.range === "today" ? "Today · " : state.range === "month" ? "This Month · " : "";
    return from === to ? `${modePrefix}${formatDateDisplay(from)}` : `${modePrefix}${formatDateDisplay(from)} – ${formatDateDisplay(to)}`;
  }

  function sumRows(rows) { return rows.reduce((a, r) => a + r.count, 0); }
  function rowsFor(moduleId, country) {
    return allRows.filter((r) => (moduleId === "ALL_MODULES" || r.module === moduleId) && (country === "ALL" || r.country === country));
  }
  function dimLabel(name, isCountry) { return isCountry ? name : brandName(name); }

  function computeModuleRows(moduleId, country) {
    const rows = rowsFor(moduleId, country);
    const isAll = country === "ALL";
    const hasTypes = rows.some((r) => r.type);
    const groups = {};
    if (hasTypes) {
      rows.forEach((r) => {
        const t = r.type || "(unspecified)";
        groups[t] = groups[t] || {};
        const dim = isAll ? r.country : (r.brand || "(unknown)");
        groups[t][dim] = (groups[t][dim] || 0) + r.count;
      });
    } else {
      rows.forEach((r) => {
        const dim = isAll ? r.country : (r.brand || "(unknown)");
        groups[dim] = groups[dim] || {};
        groups[dim]._total = (groups[dim]._total || 0) + r.count;
      });
    }
    if (hasTypes) {
      return Object.keys(groups).map((t) => {
        const dims = groups[t];
        const total = Object.values(dims).reduce((a, b) => a + b, 0);
        const breakdown = Object.keys(dims).map((d) => ({ name: dimLabel(d, isAll), count: dims[d] })).sort((a, b) => b.count - a.count);
        return { name: t, count: total, breakdown };
      }).sort((a, b) => b.count - a.count);
    }
    return Object.keys(groups).map((d) => ({ name: dimLabel(d, isAll), count: groups[d]._total || 0, breakdown: null })).sort((a, b) => b.count - a.count);
  }

  function rowMatchesBrand(row, brandObj) {
    if (!row.brand) return false;
    if (row.brand === brandObj.id) return true;
    return String(row.brand).toLowerCase() === String(brandObj.name).toLowerCase();
  }
  function topCardDimension(country) {
    if (country === "ALL") {
      return (window.COUNTRY_CODES || []).map((c) => ({ name: c, color: COUNTRY_COLORS[c] || "#f3c463", total: sumRows(allRows.filter((r) => r.country === c)) }));
    }
    return (window.BRANDS || []).filter((b) => b.country === country)
      .map((b) => ({ name: b.name, id: b.id, color: brandColor(b.id), total: sumRows(allRows.filter((r) => r.country === country && rowMatchesBrand(r, b))) }));
  }
  function moduleTotalsForDim(dimId, isCountryDim, country) {
    let filtered;
    if (isCountryDim) {
      filtered = allRows.filter((r) => r.country === dimId);
    } else {
      const brandObj = (window.BRANDS || []).find((b) => b.id === dimId);
      filtered = allRows.filter((r) => r.country === country && brandObj && rowMatchesBrand(r, brandObj));
    }
    const byModule = {};
    filtered.forEach((r) => { byModule[r.module] = (byModule[r.module] || 0) + r.count; });
    return Object.keys(byModule).filter((m) => MODULE_BY_ID[m])
      .map((m) => ({ moduleId: m, total: byModule[m] })).filter((x) => x.total > 0).sort((a, b) => b.total - a.total);
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // Display-only helpers (new): thousands separators, and a chip colour that
  // reuses the same country/brand colours the cards use.
  function fmt(n) { return Number(n || 0).toLocaleString("en-US"); }
  function chipColor(name, isCountryDim, country) {
    if (isCountryDim) return COUNTRY_COLORS[name] || "#f3c463";
    const b = (window.BRANDS || []).find((x) => x.country === country && x.name === name);
    return b ? brandColor(b.id) : "#8b93b0";
  }
  const CHEVRON_SVG = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 1.5 7 5l-3.5 3.5"/></svg>';

  // ---- data matrix (display only: re-arranges the same rows the report
  // already holds — same counts, no extra request) ----
  function brandAbbr(b) {
    const map = { crickex: "CX", betjili: "BJ", mostplay: "MP", betvisa: "BV", jeetway: "JWY", jeetwin: "JW", sbj66: "S66", heybaji: "HB", superbaji: "SB", kv8: "KV8", darazplay: "DP" };
    return map[String(b.name).toLowerCase()] || String(b.name).slice(0, 3).toUpperCase();
  }
  function matrixGroups(moduleId, country) {
    const m = MODULE_BY_ID[moduleId];
    return (country === "ALL" ? (window.COUNTRY_CODES || []) : [country])
      .filter((c) => moduleId === "ALL_MODULES" || !m || m.countries.includes(c))
      .map((c) => ({ country: c, color: COUNTRY_COLORS[c] || "#f3c463", brands: (window.BRANDS || []).filter((b) => b.country === c) }));
  }
  function enumerateDates(from, to) {
    const out = [];
    if (!from || !to) return out;
    for (const d = new Date(from + "T00:00:00Z"); out.length <= 400; d.setUTCDate(d.getUTCDate() + 1)) {
      const s = d.toISOString().slice(0, 10);
      if (s > to) break;
      out.push(s);
    }
    return out;
  }
  function dayLabelHtml(s) {
    const [y, m, d] = s.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.toLocaleDateString("en-US", { month: "short", day: "2-digit", timeZone: "UTC" }) +
      `<span class="wd">${dt.toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" })}</span>`;
  }
  // spec: { data, groups, rowKeys, rowOf(r), rowLabel(key) -> html, firstColLabel }
  function buildMatrixTable(spec) {
    const cells = {}, colTot = {}, rowTot = {};
    let grand = 0;
    spec.data.forEach((r) => {
      const g = spec.groups.find((x) => x.country === r.country);
      if (!g) return;
      const rk = spec.rowOf(r);
      if (rk == null) return;
      // Rows / grand totals count every ticket (same totals as the cards and the old page);
      // a ticket whose brand matches no current brand has no column of its own.
      rowTot[rk] = (rowTot[rk] || 0) + r.count;
      const b = g.brands.find((x) => rowMatchesBrand(r, x));
      if (b) {
        const ck = r.country + "|" + b.id;
        cells[rk] = cells[rk] || {};
        cells[rk][ck] = (cells[rk][ck] || 0) + r.count;
        colTot[ck] = (colTot[ck] || 0) + r.count;
      }
      grand += r.count;
    });
    const cols = [];
    spec.groups.forEach((g) => {
      const list = g.brands.map((b) => ({ key: g.country + "|" + b.id, abbr: brandAbbr(b), full: b.name + " (" + g.country + ")", g }));
      list.forEach((c, i) => { c.first = i === 0; });
      g.cols = list;
      g.total = list.reduce((a, c) => a + (colTot[c.key] || 0), 0);
      cols.push(...list);
    });
    const cell = (v, c, tag) => `<${tag} class="v${v ? "" : " z"}${c.first ? " gs" : ""}" style="--g:${c.g.color}">${fmt(v)}</${tag}>`;
    const head1 = spec.groups.map((g) => `<th class="grp gs" colspan="${g.cols.length}" style="--g:${g.color}">${escapeHtml(g.country)}</th>`).join("");
    const head2 = cols.map((c) => `<th class="bc${c.first ? " gs" : ""}" style="--g:${c.g.color}" title="${escapeHtml(c.full)}">${escapeHtml(c.abbr)}</th>`).join("");
    const body = spec.rowKeys.map((rk) => `<tr><th class="rowh" scope="row">${spec.rowLabel(rk)}</th>${cols.map((c) => cell((cells[rk] || {})[c.key] || 0, c, "td")).join("")}<td class="tot">${fmt(rowTot[rk] || 0)}</td></tr>`).join("");
    const foot = `<tr><th class="rowh" scope="row">Grand total</th>${cols.map((c) => cell(colTot[c.key] || 0, c, "td")).join("")}<td class="tot">${fmt(grand)}</td></tr>`;
    const wrap = document.createElement("div");
    wrap.className = "mx-wrap";
    wrap.setAttribute("tabindex", "0");
    wrap.innerHTML = spec.rowKeys.length
      ? `<table class="mx"><thead><tr><th class="rowh" rowspan="2">${escapeHtml(spec.firstColLabel)}</th>${head1}<th class="tot" rowspan="2">Total</th></tr><tr>${head2}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`
      : `<div class="mx-empty">No tickets in this range.</div>`;
    return wrap;
  }
  function buildDailyMatrixCard(moduleId, country, title) {
    const { from, to } = matrixDateBounds();
    const card = document.createElement("section");
    card.className = "report-card matrix-card";
    card.innerHTML = `
      <div class="rcard-head">
        <div class="rcard-title"><h2>${escapeHtml(title)} <span class="by">by day</span></h2></div>
        <div class="sub"><span>${escapeHtml(rangeLabel())}</span><span class="sep">·</span><span>${country === "ALL" ? "All countries" : escapeHtml(country)}</span></div>
      </div>`;
    card.appendChild(buildMatrixTable({
      data: rowsFor(moduleId, country),
      groups: matrixGroups(moduleId, country),
      rowKeys: enumerateDates(from, to),
      rowOf: (r) => r.date,
      rowLabel: dayLabelHtml,
      firstColLabel: "Date / Day",
    }));
    return card;
  }

  function buildSummaryCard(entry, grandAcrossAll) {
    const pct = grandAcrossAll ? Math.round((entry.total / grandAcrossAll) * 100) : 0;
    const key = entry.id || entry.name;
    const selected = state.selectedDim === key;
    const el = document.createElement("button");
    el.type = "button";
    el.className = "summary-card" + (selected ? " selected" : "");
    el.setAttribute("aria-pressed", selected ? "true" : "false");
    el.style.setProperty("--m-accent", entry.color);
    el.innerHTML = `
      <span class="sc-head"><span class="sc-dot"></span><span class="sc-name">${escapeHtml(entry.name)}</span></span>
      <span class="sc-num">${fmt(entry.total)}</span>
      <span class="sc-bar-track"><span class="sc-bar-fill" style="width:${pct}%"></span></span>
      <span class="sc-foot"><span class="sc-pct">${pct}% of total</span><span class="sc-cta">${selected ? "Hide ranking" : "View ranking ›"}</span></span>`;
    el.addEventListener("click", () => {
      state.selectedDim = state.selectedDim === key ? null : key;
      render();
    });
    return el;
  }

  function buildModuleCard(moduleId, country) {
    const m = MODULE_BY_ID[moduleId];
    const rows = computeModuleRows(moduleId, country); // same grouping + order as before
    const isAll = country === "ALL";
    const grandTotal = rows.reduce((a, b) => a + b.count, 0);
    const hasTypes = rowsFor(moduleId, country).some((r) => r.type);
    const typeColLabel = hasTypes ? "Issue Type" : (isAll ? "Country" : "Brand");
    const byDay = state.view === "day";
    const card = document.createElement("section");
    card.className = "report-card matrix-card";
    card.style.setProperty("--m-accent", m ? m.accent : "#8b7cf6");
    card.innerHTML = `
      <div class="rcard-head">
        <div class="rcard-title">
          <span class="icon-tile" aria-hidden="true">${m ? m.icon : "❓"}</span>
          <h2>${m ? escapeHtml(m.name) : escapeHtml(moduleId)} <span class="by">by ${byDay ? "Day" : typeColLabel}</span></h2>
        </div>
        <div class="sub"><span>${escapeHtml(rangeLabel())}</span><span class="sep">·</span><span>${isAll ? "All countries" : escapeHtml(country)}</span><span class="sep">·</span><span>Total <b>${fmt(grandTotal)}</b></span></div>
      </div>
      <div class="rcard-tools">
        <div class="rp-seg sm" role="group" aria-label="Rows">
          <button type="button" data-view="type" class="${byDay ? "" : "active"}" aria-pressed="${!byDay}">By ${hasTypes ? "issue type" : "total"}</button>
          <button type="button" data-view="day" class="${byDay ? "active" : ""}" aria-pressed="${byDay}">By day</button>
        </div>
        <span class="hint">Columns: brands grouped by country · hover a code for the full name</span>
      </div>`;
    card.querySelectorAll("[data-view]").forEach((btn) => btn.addEventListener("click", () => { state.view = btn.dataset.view; render(); }));
    let spec;
    if (byDay) {
      const { from, to } = matrixDateBounds();
      spec = { rowKeys: enumerateDates(from, to), rowOf: (r) => r.date, rowLabel: dayLabelHtml, firstColLabel: "Date / Day" };
    } else if (hasTypes) {
      spec = { rowKeys: rows.map((r) => r.name), rowOf: (r) => r.type || "(unspecified)", rowLabel: (k) => `<span title="${escapeHtml(k)}">${escapeHtml(k)}</span>`, firstColLabel: "Issue Type" };
    } else {
      spec = { rowKeys: grandTotal ? ["__all"] : [], rowOf: () => "__all", rowLabel: () => (m ? escapeHtml(m.name) : "All tickets"), firstColLabel: "Issue Type" };
    }
    card.appendChild(buildMatrixTable({ ...spec, data: rowsFor(moduleId, country), groups: matrixGroups(moduleId, country) }));
    return card;
  }

  function buildRankList(entries, title) {
    const grand = entries.reduce((a, b) => a + b.total, 0);
    const max = Math.max(1, ...entries.map((e) => e.total));
    const card = document.createElement("section");
    card.className = "report-card rank-list";
    card.innerHTML = `
      <div class="rcard-head">
        <div class="rcard-title"><h2>Ranking <span class="by">· ${escapeHtml(title)}</span></h2></div>
        <div class="sub"><span>${escapeHtml(rangeLabel())}</span></div>
      </div>
      <div class="rtable"><div class="rtable-inner">
        <div class="rgrid rlist-head"><span>#</span><span>Issue Type</span><span>Relative to top</span><span class="c-count">Count</span></div>
        <div class="rlist-body"></div>
        <div class="rgrid rlist-foot"><span></span><span>Total</span><span></span><span class="c-count">${fmt(grand)}</span></div>
      </div></div>`;
    const body = card.querySelector(".rlist-body");
    if (!entries.length) body.innerHTML = `<div class="report-state inline">No tickets in this range.</div>`;
    entries.forEach((e, i) => {
      const m = MODULE_BY_ID[e.moduleId];
      const wrap = document.createElement("div");
      wrap.className = "rrow";
      wrap.innerHTML = `
        <div class="rgrid rrow-main" style="--m-accent:${m ? m.accent : "#f3c463"}">
          <span class="rank-badge">${i + 1}</span>
          <span class="rrow-name"><span class="icon-tile" aria-hidden="true">${m ? m.icon : "❓"}</span><span class="txt" title="${m ? escapeHtml(m.name) : escapeHtml(e.moduleId)}">${m ? escapeHtml(m.name) : escapeHtml(e.moduleId)}</span></span>
          <span class="rrow-bar-track"><span class="rrow-bar-fill" style="width:${Math.round((e.total / max) * 100)}%"></span></span>
          <span class="rrow-count">${fmt(e.total)}</span>
        </div>`;
      body.appendChild(wrap);
    });
    return card;
  }

  function renderSkeleton() {
    const c = document.getElementById("reportContainer");
    c.innerHTML = `<div class="summary-grid">${'<div class="rp-skel" style="height:118px"></div>'.repeat(3)}</div><div class="rp-skel" style="height:220px"></div>`;
    c.setAttribute("aria-busy", "true");
  }

  function render() {
    const container = document.getElementById("reportContainer");
    container.innerHTML = "";
    container.classList.remove("is-refreshing");
    container.removeAttribute("aria-busy");
    { const _t = document.getElementById("totalLbl"); if (_t) _t.textContent = "Total " + (state.range === "today" ? "Today" : state.range === "month" ? "This Month" : "(range)"); }

    if (lastError) {
      container.innerHTML = `<div class="report-state err" role="alert"><div class="st-title">Couldn't load the report</div><div>${escapeHtml(lastError)}</div><button type="button" class="rp-btn" id="retryBtn">Try again</button></div>`;
      document.getElementById("retryBtn").addEventListener("click", () => fetchAndRender());
      { const _t = document.getElementById("totalNum"); if (_t) _t.textContent = "—"; }
      return;
    }
    if (lastPartialErrors) {
      const warn = document.createElement("div");
      warn.className = "rp-banner";
      warn.setAttribute("role", "status");
      warn.innerHTML = `<b>⚠</b><span>Couldn't scan ${escapeHtml(lastPartialErrors.join(", "))} — totals below may be undercounted for ${lastPartialErrors.length > 1 ? "those countries" : "that country"}. Try again shortly.</span>`;
      container.appendChild(warn);
    }

    if (state.moduleId === "ALL_MODULES") {
      const cardEntries = topCardDimension(state.country);
      const grand = cardEntries.reduce((a, b) => a + b.total, 0);
      const grid = document.createElement("div");
      grid.className = "summary-grid";
      cardEntries.forEach((entry) => grid.appendChild(buildSummaryCard(entry, grand)));
      container.appendChild(grid);
      if (state.selectedDim) {
        const isCountryCard = state.country === "ALL";
        const ranked = moduleTotalsForDim(state.selectedDim, isCountryCard, state.country);
        const title = isCountryCard ? state.selectedDim : brandName(state.selectedDim);
        container.appendChild(buildRankList(ranked, title));
      }
      container.appendChild(buildDailyMatrixCard("ALL_MODULES", state.country, "All issue types"));
      { const _t = document.getElementById("totalNum"); if (_t) _t.textContent = fmt(grand); }
    } else {
      container.appendChild(buildModuleCard(state.moduleId, state.country));
      { const _t = document.getElementById("totalNum"); if (_t) _t.textContent = fmt(sumRows(rowsFor(state.moduleId, state.country))); }
    }
    hasRendered = true;
  }

  async function fetchAndRender() {
    const { from, to } = currentFromTo();
    if (!from || !to) return;
    const container = document.getElementById("reportContainer");
    const status = document.getElementById("rpStatus");
    // Visual only: first load shows a skeleton; later loads keep the previous
    // results (dimmed) so the page doesn't jump while the new range arrives.
    if (hasRendered && !lastError) { container.classList.add("is-refreshing"); container.setAttribute("aria-busy", "true"); }
    else renderSkeleton();
    status.hidden = false;
    lastError = null;
    lastPartialErrors = null;
    try {
      const params = new URLSearchParams({ from, to, module: "ALL", country: "ALL" });
      const res = await window.AgentAuth.authFetch(`/api/admin/report?${params.toString()}`, { cache: "no-store" });
      const data = await res.json();
      if (!data.ok) {
        lastError = data.error || "Failed to load report.";
        allRows = [];
      } else {
        allRows = data.rows || [];
        if (data.partialErrors && data.partialErrors.length) lastPartialErrors = data.partialErrors;
      }
    } catch {
      lastError = "Failed to load — check your connection.";
      allRows = [];
    }
    status.hidden = true;
    render();
  }

  function setRangeButtons(btn) {
    document.querySelectorAll("#rangeSeg button").forEach((b) => { b.classList.toggle("active", b === btn); b.setAttribute("aria-pressed", String(b === btn)); });
  }
  document.getElementById("rangeSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    setRangeButtons(btn); state.range = btn.dataset.val; state.selectedDim = null;
    const customBox = document.getElementById("customRange");
    if (state.range === "custom") {
      customBox.classList.add("open");
      if (!document.getElementById("fromDate").value) {
        const from = gmt8Now(); from.setUTCDate(from.getUTCDate() - 6);
        document.getElementById("fromDate").value = `${from.getUTCFullYear()}-${pad2(from.getUTCMonth() + 1)}-${pad2(from.getUTCDate())}`;
        document.getElementById("toDate").value = todayStr();
        fetchAndRender();
        return;
      }
    } else {
      customBox.classList.remove("open");
    }
    fetchAndRender();
  });
  document.getElementById("fromDate").addEventListener("change", () => { state.selectedDim = null; fetchAndRender(); });
  document.getElementById("toDate").addEventListener("change", () => { state.selectedDim = null; fetchAndRender(); });

  function applyCountryLock() {
    const m = MODULE_BY_ID[state.moduleId];
    const allowed = state.moduleId === "ALL_MODULES" || !m ? (window.COUNTRY_CODES || []) : m.countries;
    Array.from(countrySelect.options).forEach((opt) => {
      opt.disabled = opt.value === "ALL" ? false : !allowed.includes(opt.value);
    });
    const currentOk = state.country === "ALL" ? allowed.length > 1 : allowed.includes(state.country);
    if (!currentOk) {
      state.country = allowed[0];
      countrySelect.value = state.country;
    }
  }
  moduleSelect.addEventListener("change", (e) => {
    state.moduleId = e.target.value; state.selectedDim = null;
    applyCountryLock();
    render();
  });
  countrySelect.addEventListener("change", (e) => { state.country = e.target.value; state.selectedDim = null; render(); });

  // ---- Export (same data + same functions as today; restyled document) ----
  document.getElementById("exportBtn").addEventListener("click", () => {
    const btn = document.getElementById("exportBtn");
    const label = document.getElementById("exportBtnLabel");
    btn.disabled = true; label.textContent = "Exporting…";
    try {
      const exportedRangeLabel = rangeLabel();
      const { from, to } = currentFromTo();
      const spanDays = Math.round((Date.parse(to) - Date.parse(from)) / 86400000) + 1;
      const showDateFilter = spanDays > 2;
      const reportStyles = document.getElementById("reportStyles")?.textContent || "";
      const exportStyles = `
        body { margin:0; background:#070a18; color:#e8ebf7; font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif; }
        .exp-wrap { padding-inline:0; }
        .exp-meta { margin:4px 0 0; color:var(--rp-ink-2); font-size:12.5px; }`;
      const reusedFuncsSrc = [
        escapeHtml, fmt, chipColor, brandColor, brandName, dimLabel, sumRows, rowsFor, rowMatchesBrand,
        brandAbbr, matrixGroups, enumerateDates, dayLabelHtml, buildMatrixTable, buildDailyMatrixCard,
        computeModuleRows, topCardDimension, moduleTotalsForDim,
        buildSummaryCard, buildModuleCard, buildRankList, applyCountryLock,
        formatDateDisplay,
      ].map((fn) => fn.toString()).join("\n\n");
      const embedded = {
        rows: allRows,
        modules: REPORT_MODULE_LIST.map((m) => ({ id: m.id, name: m.name, icon: m.icon, accent: m.accent, countries: m.countries })),
        brands: (window.BRANDS || []).map((b) => ({ id: b.id, name: b.name, country: b.country })),
        countries: window.COUNTRY_CODES || [],
        countryColors: COUNTRY_COLORS,
        brandPalette: BRAND_PALETTE,
        rangeLabel: exportedRangeLabel,
        exportFrom: from,
        exportTo: to,
        showDateFilter,
      };
      const scriptOpenTag = "<" + "script>";
      const scriptCloseTag = "<" + "/script>";
      const snapshotHtml = `<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Report export — ${escapeHtml(from)} to ${escapeHtml(to)}</title>
<style>
${reportStyles}
${exportStyles}
</style></head><body><div class="exp-wrap"><div class="rp">
<header class="rp-head"><div class="rp-head-text"><h1 class="rp-title">Report export</h1>
<p class="exp-meta">${escapeHtml(exportedRangeLabel)} · Exported ${escapeHtml(new Date().toLocaleString())} · Days in GMT+8 · Scoped to the countries and modules this account can see</p></div></header>
<section class="rp-toolbar" aria-label="Report filters">
  <div class="rp-field" style="${showDateFilter ? "" : "display:none;"}"><label for="subFromDate">From</label><input type="date" id="subFromDate" min="${escapeHtml(from)}" max="${escapeHtml(to)}" value="${escapeHtml(from)}" /></div>
  <div class="rp-field" style="${showDateFilter ? "" : "display:none;"}"><label for="subToDate">To</label><input type="date" id="subToDate" min="${escapeHtml(from)}" max="${escapeHtml(to)}" value="${escapeHtml(to)}" /></div>
  <div class="rp-field"><label for="moduleSelect">Issue type</label><span class="rp-select"><select id="moduleSelect"></select></span></div>
  <div class="rp-field"><label for="countrySelect">Country</label><span class="rp-select"><select id="countrySelect"></select></span></div>

</section>
<div id="reportContainer"></div>
</div></div>
${scriptOpenTag}
  const EMBEDDED = ${JSON.stringify(embedded).replace(/</g, "\\u003c")};
  const ALL_ROWS_FULL = EMBEDDED.rows;
  let allRows = ALL_ROWS_FULL;
  const REPORT_MODULE_LIST = EMBEDDED.modules;
  const MODULE_BY_ID = {};
  REPORT_MODULE_LIST.forEach(function (m) { MODULE_BY_ID[m.id] = m; });
  window.BRANDS = EMBEDDED.brands;
  window.COUNTRY_CODES = EMBEDDED.countries;
  const COUNTRY_COLORS = EMBEDDED.countryColors;
  const BRAND_PALETTE = EMBEDDED.brandPalette;
  const CHEVRON_SVG = ${JSON.stringify(CHEVRON_SVG)};
  const state = { moduleId: "ALL_MODULES", country: "ALL", selectedDim: null, view: "type" };
  let subFrom = EMBEDDED.exportFrom, subTo = EMBEDDED.exportTo;
  function matrixDateBounds() { return { from: subFrom, to: subTo }; }
  function rangeLabel() {
    if (subFrom === EMBEDDED.exportFrom && subTo === EMBEDDED.exportTo) return EMBEDDED.rangeLabel;
    return subFrom === subTo ? formatDateDisplay(subFrom) : formatDateDisplay(subFrom) + " – " + formatDateDisplay(subTo);
  }

  ${reusedFuncsSrc}

  const moduleSelect = document.getElementById("moduleSelect");
  moduleSelect.innerHTML = "<option value=\\"ALL_MODULES\\">🗂️ All</option>" +
    REPORT_MODULE_LIST.map(function (m) {
      const phpOnly = Array.isArray(m.countries) && m.countries.length === 1 && m.countries[0] === "PHP";
      return "<option value=\\"" + m.id + "\\">" + m.icon + " " + m.name + (phpOnly ? " (PHP only)" : "") + "</option>";
    }).join("");
  const countrySelect = document.getElementById("countrySelect");
  countrySelect.innerHTML = "<option value=\\"ALL\\">All</option>" +
    EMBEDDED.countries.map(function (c) { return "<option value=\\"" + c + "\\">" + c + "</option>"; }).join("");

  function render() {
    const container = document.getElementById("reportContainer");
    container.innerHTML = "";
    if (state.moduleId === "ALL_MODULES") {
      const cardEntries = topCardDimension(state.country);
      const grand = cardEntries.reduce(function (a, b) { return a + b.total; }, 0);
      const grid = document.createElement("div");
      grid.className = "summary-grid";
      cardEntries.forEach(function (entry) { grid.appendChild(buildSummaryCard(entry, grand)); });
      container.appendChild(grid);
      if (state.selectedDim) {
        const isCountryCard = state.country === "ALL";
        const ranked = moduleTotalsForDim(state.selectedDim, isCountryCard, state.country);
        const title = isCountryCard ? state.selectedDim : brandName(state.selectedDim);
        container.appendChild(buildRankList(ranked, title));
      }
      container.appendChild(buildDailyMatrixCard("ALL_MODULES", state.country, "All issue types"));
      { const _t = document.getElementById("totalNum"); if (_t) _t.textContent = fmt(grand); }
    } else {
      container.appendChild(buildModuleCard(state.moduleId, state.country));
      { const _t = document.getElementById("totalNum"); if (_t) _t.textContent = fmt(sumRows(rowsFor(state.moduleId, state.country))); }
    }
  }
  moduleSelect.addEventListener("change", function (e) { state.moduleId = e.target.value; state.selectedDim = null; applyCountryLock(); render(); });
  countrySelect.addEventListener("change", function (e) { state.country = e.target.value; state.selectedDim = null; render(); });

  if (EMBEDDED.showDateFilter) {
    const subFromInput = document.getElementById("subFromDate");
    const subToInput = document.getElementById("subToDate");
    function applyDateFilter() {
      subFrom = subFromInput.value || EMBEDDED.exportFrom;
      subTo = subToInput.value || EMBEDDED.exportTo;
      if (subFrom > subTo) { const t = subFrom; subFrom = subTo; subTo = t; subFromInput.value = subFrom; subToInput.value = subTo; }
      allRows = ALL_ROWS_FULL.filter(function (r) { return r.date >= subFrom && r.date <= subTo; });
      state.selectedDim = null;
      render();
    }
    subFromInput.addEventListener("change", applyDateFilter);
    subToInput.addEventListener("change", applyDateFilter);
  }

  applyCountryLock();
  render();
${scriptCloseTag}
</body></html>`;
      openExportPreview(snapshotHtml, `report-all-permitted-data-${from}_to_${to}.html`, exportedRangeLabel);
    } catch (e) {
      if (window.showToast) window.showToast("Export failed — " + (e && e.message ? e.message : "try again"));
    } finally {
      btn.disabled = false; label.textContent = "Export";
    }
  });

  // 2026-10-12 — Export now opens a preview of the exact file first; the
  // download only happens on Confirm. The preview frame runs the file's own
  // (offline, self-contained) script in a sandbox, so filters, rankings and
  // date narrowing can be tried before downloading.
  let exportPreviewPending = null;
  function openExportPreview(html, filename, rangeText) {
    exportPreviewPending = { html, filename };
    const back = document.getElementById("exportPreview");
    document.getElementById("exportPreviewFile").textContent = filename;
    document.getElementById("exportPreviewRange").textContent = rangeText || "";
    document.getElementById("exportPreviewSize").textContent = Math.max(1, Math.round(new Blob([html]).size / 1024)) + " KB";
    document.getElementById("exportPreviewFrame").srcdoc = html;
    back.hidden = false;
    document.body.style.overflow = "hidden";
    setTimeout(() => document.getElementById("exportPreviewConfirm").focus(), 0);
  }
  function closeExportPreview() {
    const back = document.getElementById("exportPreview");
    if (back.hidden) return;
    back.hidden = true;
    document.body.style.overflow = "";
    document.getElementById("exportPreviewFrame").srcdoc = "";
    exportPreviewPending = null;
    document.getElementById("exportBtn").focus();
  }
  document.getElementById("exportPreviewConfirm").addEventListener("click", () => {
    if (!exportPreviewPending) return;
    const { html, filename } = exportPreviewPending;
    deliverExport(html, filename);
    closeExportPreview();
  });
  document.getElementById("exportPreviewClose").addEventListener("click", closeExportPreview);
  document.getElementById("exportPreview").addEventListener("click", (e) => { if (e.target.id === "exportPreview") closeExportPreview(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeExportPreview(); });

  // Same delivery as before the redesign: download the file + toast.
  function deliverExport(html, filename) {
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    if (window.showToast) window.showToast(`Exported: ${filename}`);
  }

  applyCountryLock();
  fetchAndRender();
  </script>
</body>
</html>
