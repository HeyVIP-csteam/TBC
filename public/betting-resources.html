<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HeyVIP Betting Rules</title>
<script src="/assets/theme.js?v=c61fb537"></script>
<style>
/* See announcements.html for why this inline block exists and must stay
   first/inline — kept in exact sync with style.css's html{}/html[data-
   theme=light]{} rule. */

  background-color: #090c1c;
  background-image:
    linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
    url('/assets/img/bg-space.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
html[data-theme="light"] {
  background-color: #dbe7fb;
  background-image:
    radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),
    linear-gradient(160deg, #dbe7fb 0%, #d9cef4 45%, #cdbdf2 75%, #c4b2ee 100%);
}
</style>
<link rel="stylesheet" href="/assets/style.css?v=ea9e36f7" />
<link rel="stylesheet" href="/assets/toast.css?v=5779b14e" />
<script src="/assets/toast.js?v=d9d84724"></script>
<script src="/assets/starfield.js?v=b6e92821" defer></script>
<script src="/assets/authguard.js?v=101bd636"></script>
<script src="/assets/countries.js?v=78bdc076"></script>
<script src="/assets/country-modules.js?v=7caef210"></script>
<script src="/assets/agent-country.js?v=d01804d8"></script>
<script src="/assets/presence-heartbeat.js?v=10aea858"></script>
<script src="/assets/announcement-banner.js?v=26c15118" defer></script>
<script src="/assets/schemas.js?v=3f70df87"></script>
</head>
<body class="threads-page">
  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/img/logo.webp" alt="HeyVIP" class="logo-img" />
      <span class="wordmark">CS TEAM - TBC</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <span class="country-switcher-mount" id="countrySwitcherMount"></span>
      <button class="theme-pill" id="themeToggle"></button>
    </div>
  </header>

  <div class="threads-shell">
    <aside class="sidebar" id="hubNavMount"></aside>
    <div class="threads-content-col">
      <nav class="brand-row" id="pageBrandRow"><div class="brand-row-track"></div></nav>
      <div id="announcementBanner"></div>

      <main class="hub-main" style="padding-top:30px;">
        <div class="inner br-inner">
          <p class="edit-modal-title" style="margin-bottom:4px;">🎲 HeyVIP Betting Rules</p>
          <p style="color:var(--ink-soft); margin:0 0 22px; font-size:12.5px;">Reference links — guidance docs on the left, result/score lookup tools on the right.</p>

          <div id="brLoading" class="edit-modal-note">Loading…</div>
          <div id="brError" class="edit-modal-note err" style="display:none;"></div>

          <div id="brPanels" style="display:none;"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/hub-nav.js?v=b4fd698d"></script>
  <script src="/assets/brand-row.js?v=ea371f55"></script>
  <script>
    window.initThemeToggle();
    window.initClock();
    window.HubNav.mount("hubNavMount", {});
    window.BrandRow.mount("pageBrandRow");
    if (window.AgentCountry) window.AgentCountry.renderSwitcher("countrySwitcherMount", () => load());

    function esc(str) {
      return String(str == null ? "" : str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderLinkCard(link) {
      if (!link || !link.url) {
        return '<p class="edit-modal-note">Not set up yet — an admin can add this in Betting Resources Links.</p>';
      }
      return `
        <a class="br-link-card" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">
          <span class="br-link-icon">${esc(link.icon || "📄")}</span>
          <span class="br-link-body">
            <span class="br-link-name">${esc(link.name || "Untitled")}</span>
            <span class="br-link-url">${esc(link.url)}</span>
          </span>
          <span class="br-link-arrow">&rarr;</span>
        </a>`;
    }

    // MERGED (2026-08-21) — this page was fully broken before this pass:
    // it expected `data.rules`/`data.results` directly on the response,
    // but /api/betting-resources has returned `{ byCountry: [...] }`
    // (one entry per allowed country, see that file's own comment on
    // why) since the merge — meaning EVERY agent viewing this page saw
    // an empty "not set up yet" state regardless of what was actually
    // configured, for any country. Not something this pass broke — a
    // pre-existing mismatch this pass found while wiring up the country
    // switcher here.
    //
    // Renders one section per COUNTRY (not the old fixed two-section
    // layout) — a specific country selection shows just that one
    // country's section; "All Countries" shows every allowed country's
    // section stacked, each labeled, since this is read-only reference
    // content (unlike an edit form, there's no ambiguity risk in
    // showing more than one country's data on screen at once here).
    function renderCountrySection(entry) {
      const label = (window.COUNTRIES && window.COUNTRIES[entry.country]) ? window.COUNTRIES[entry.country].name : entry.country;
      const results = Array.isArray(entry.results) ? entry.results : [];
      return `
        <div class="br-country-block">
          <p class="edit-modal-title" style="font-size:13px; margin:0 0 10px; opacity:0.75;">${esc(label)} (${esc(entry.country)})</p>
          <div class="br-panels">
            <section class="br-panel">
              <div class="br-panel-title">HeyVIP Betting Resources</div>
              <div>${renderLinkCard(entry.rules)}</div>
            </section>
            <section class="br-panel">
              <div class="br-panel-title">Results Finding Websites</div>
              <div class="br-links-list">${results.map(renderLinkCard).join("")}</div>
              ${results.length ? "" : '<p class="edit-modal-note">No links added yet.</p>'}
            </section>
          </div>
        </div>`;
    }

    async function load() {
      try {
        const res = await window.AgentAuth.authFetch("/api/betting-resources");
        const data = await res.json();
        document.getElementById("brLoading").style.display = "none";
        if (!data.ok) {
          const errEl = document.getElementById("brError");
          errEl.textContent = data.error || "Failed to load.";
          errEl.style.display = "";
          return;
        }
        const byCountry = Array.isArray(data.byCountry) ? data.byCountry : [];
        const country = window.AgentCountry ? window.AgentCountry.getCountry() : null;
        const isAll = window.AgentCountry && window.AgentCountry.isAll(country);
        const toShow = isAll || !country ? byCountry : byCountry.filter((e) => e.country === country);

        const panelsEl = document.getElementById("brPanels");
        panelsEl.style.display = "";
        if (!toShow.length) {
          panelsEl.innerHTML = '<p class="edit-modal-note">Betting Resources isn\'t offered for your current country selection.</p>';
          return;
        }
        panelsEl.innerHTML = toShow.map(renderCountrySection).join("");
      } catch (e) {
        document.getElementById("brLoading").style.display = "none";
        const errEl = document.getElementById("brError");
        errEl.textContent = "Network error — please retry.";
        errEl.style.display = "";
      }
    }

    load();
  </script>
</body>
</html>
