<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Announcements</title>
<script src="/assets/theme.js?v=c61fb537"></script>
<style>
/* Inline placeholder canvas background — first thing the browser parses
   in <head>, so it paints before any network request (external CSS, the
   photo itself) resolves. Values are hard-coded here (can't use var()
   yet — style.css may not have loaded) but are kept in exact sync with
   the "real" html{}/html[data-theme=light]{} rule in style.css, so the
   moment that stylesheet finishes loading there is zero visible change.
   Must stay inline and first — an external <link> here would leave a
   blank gap for a network round trip before anything paints. Only sets
   background on <html>, never <body>: <body> has its own
   theme-toggle transition, and animating from this photo to some other
   background would try to interpolate image -> gradient, which browsers
   can't do and would just look like a broken flash. */
html {
  background-color: #090c1c;
  background-image:
    linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
    url('/assets/img/bg-space.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
html[data-theme="light"] {
  background-color: #dbe7fb;
  background-image:
    radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),
    linear-gradient(160deg, #dbe7fb 0%, #d9cef4 45%, #cdbdf2 75%, #c4b2ee 100%);
}
</style>
<link rel="stylesheet" href="/assets/style.css?v=09d78b3d" />
<link rel="stylesheet" href="/assets/toast.css?v=5779b14e" />
<script src="/assets/toast.js?v=d9d84724"></script>
<script src="/assets/starfield.js?v=b6e92821" defer></script>
<script src="/assets/authguard.js?v=101bd636"></script>
<script src="/assets/countries.js?v=78bdc076"></script>
<script src="/assets/country-modules.js?v=7cb5b511"></script>
<script src="/assets/agent-country.js?v=9d067776"></script>
<script src="/assets/presence-heartbeat.js?v=10aea858"></script>
<script src="/assets/announcement-banner.js?v=26c15118" defer></script>
<script src="/assets/schemas.js?v=3f70df87"></script>
</head>
<body class="threads-page">
  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/img/logo.webp" alt="HeyVIP" class="logo-img" />
      <span class="wordmark">CS TEAM - TBC</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <span class="country-switcher-mount" id="countrySwitcherMount"></span>
      <button class="theme-pill" id="themeToggle"></button>
    </div>
  </header>

  <div class="threads-shell">
    <aside class="sidebar" id="hubNavMount"></aside>
    <div class="threads-content-col">
      <nav class="brand-row" id="pageBrandRow"><div class="brand-row-track"></div></nav>
      <div id="announcementBanner"></div>
      <div class="threads-body-row">
    <aside class="threads-sidebar" style="width:280px;">
      <button type="button" class="announce-new-btn" id="newBtn">+ New announcement</button>
      <div class="threads-search">
        <span>🔍</span>
        <input type="text" id="announceSearch" placeholder="Search topic or message..." autocomplete="off" />
      </div>
      <div class="threads-section-title" style="cursor:default;">
        <span>Announcements</span>
        <span class="count" id="announceCount">0</span>
      </div>
      <div class="thread-list" id="announceList" style="margin-bottom:0;"></div>
    </aside>

    <div class="threads-right-col">
      <main class="threads-main">
        <div class="thread-scroll-area" style="padding:30px 40px; display:flex; justify-content:center;">
          <div id="formArea" style="width:640px; height:100%; flex:none;"></div>
        </div>
      </main>
    </div>
      </div>
    </div>
  </div>

  <script src="/assets/hub-nav.js?v=615e67a7"></script>
  <script src="/assets/brand-row.js?v=ea371f55"></script>
  <script>
    window.initThemeToggle();
    window.initClock();
    window.HubNav.mount("hubNavMount", {});
    window.BrandRow.mount("pageBrandRow");

    const ROLE_RANK = { agent: 0, senior: 1, admin: 2, superadmin: 3, owner: 4 };
    const auth = window.AgentAuth.getAuth();
    // Mirrors _shared/accounts.js's canSeeAdminSection/canEditAdminSection
    // default-tier logic for the "announcements" section specifically
    // (admin+ by default, overridable per account via Agent Profile) —
    // this is UI convenience only, the server independently re-checks
    // on every request.
    function defaultSeesAnnouncements(rank) { return rank >= ROLE_RANK.admin; }
    function defaultEditsAnnouncements(rank) { return rank >= ROLE_RANK.admin; }
    function canSee() {
      if (!auth) return false;
      if (auth.role === "owner") return true;
      if (auth.allowedAdminSections !== undefined) {
        return auth.allowedAdminSections === "all" || (Array.isArray(auth.allowedAdminSections) && auth.allowedAdminSections.includes("announcements"));
      }
      return defaultSeesAnnouncements(ROLE_RANK[auth.role] ?? 0);
    }
    function canEdit() {
      if (!auth) return false;
      if (auth.role === "owner") return true;
      if (!canSee()) return false;
      if (auth.adminSectionEditAccess !== undefined) {
        return auth.adminSectionEditAccess === "all" || (Array.isArray(auth.adminSectionEditAccess) && auth.adminSectionEditAccess.includes("announcements"));
      }
      return defaultEditsAnnouncements(ROLE_RANK[auth.role] ?? 0);
    }
    if (!canSee()) location.replace("/");
    const canEditAnnouncements = canEdit();
    document.getElementById("newBtn").style.display = canEditAnnouncements ? "" : "none";

    const authFetch = window.AgentAuth.authFetch;
    let announcements = [];
    let topics = ["Friendly reminder", "Game maintenance", "System maintenance", "Deposit / Withdraw Issues"]; // overwritten by the server's list once loaded — kept here just so the dropdown isn't empty for a split second
    let selectedId = null; // null + mode "new" = creating; otherwise editing this id
    let mode = canEditAnnouncements ? "new" : "list"; // "list" | "new" | "edit"
    let searchQuery = "";

    function esc(str) {
      return String(str == null ? "" : str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function fmtLocal(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleString(undefined, { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }
    // Full date + time (e.g. "8/2/2026, 9:54:23 PM") for the sidebar list items.
    function fmtFullLocal(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString();
    }
    // <input type="datetime-local"> wants "YYYY-MM-DDTHH:mm" in LOCAL time,
    // not the ISO/UTC string the server stores.
    function isoToLocalInput(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function localInputToIso(val) {
      if (!val) return null;
      const d = new Date(val); // parsed as local time
      return isNaN(d.getTime()) ? null : d.toISOString();
    }

    function effectiveStatus(a) {
      const now = Date.now();
      if (!a.enabled) return { label: "Inactive", color: "#8890c0" };
      if (a.startAt && now < new Date(a.startAt).getTime()) return { label: "Scheduled", color: "#8890c0" };
      if (a.endAt && now > new Date(a.endAt).getTime()) return { label: "Expired", color: "#8890c0" };
      return { label: "Active", color: "#1a9c6e" };
    }

    // MERGED (2026-08-21) — resolves the country every fetch below needs
    // (admin/announcements.js has required `country` on GET and POST
    // since Announcements became per-country content — see that file's
    // header — but this page never actually sent one, a real pre-
    // existing bug this pass found).
    //
    // REVISED (2026-08-21, same day) — direct business-owner feedback:
    // "All Countries" should show every country's announcements
    // COMBINED into one list, not require picking one at a time. This
    // is actually straightforward for Announcements specifically (unlike
    // Betting Resources Links, which has nested per-category editing
    // state that doesn't merge cleanly) — it's just a list of
    // independent items, so this fetches every allowed country in
    // parallel and tags each announcement with which country it came
    // from (`.country`), same pattern threads.html already uses for its
    // own combined multi-country list. Editing an existing item always
    // uses ITS OWN tagged country (not whatever the current mode is) —
    // creating a brand-new one in "All Countries" mode needs an explicit
    // country picker IN THE FORM ITSELF instead (see renderForm() —
    // there's no "which country" to infer for something that doesn't
    // exist yet).
    let announcementsAreCombined = false; // true only while "All Countries" was the mode this list was loaded under

    async function loadAnnouncements() {
      const top = window.AgentCountry ? window.AgentCountry.getCountry() : null;
      const isAll = window.AgentCountry && window.AgentCountry.isAll(top);
      const allowed = window.AgentCountry ? window.AgentCountry.getAllowedCountries() : [];
      announcementsAreCombined = isAll;

      if (isAll) {
        if (!allowed.length) {
          document.getElementById("formArea").innerHTML = `<p class="edit-modal-note err">No country available.</p>`;
          document.getElementById("announceList").innerHTML = "";
          document.getElementById("announceCount").textContent = "0";
          return;
        }
        const results = await Promise.all(allowed.map(async (code) => {
          try {
            const res = await authFetch(`/api/admin/announcements?country=${encodeURIComponent(code)}`);
            const data = await res.json();
            return data.ok ? { code, data } : { code, error: data.error || "Failed to load." };
          } catch {
            return { code, error: "Network error." };
          }
        }));
        const failed = results.filter((r) => r.error);
        announcements = results.filter((r) => r.data).flatMap((r) => r.data.announcements.map((a) => ({ ...a, country: r.code })));
        const firstGoodTopics = results.find((r) => r.data && r.data.topics && r.data.topics.length);
        if (firstGoodTopics) topics = firstGoodTopics.data.topics;
        if (failed.length) {
          showToast(`Couldn't load: ${failed.map((f) => f.code).join(", ")} — ${failed[0].error}`, "err");
        }
      } else {
        if (!top) {
          document.getElementById("formArea").innerHTML = `<p class="edit-modal-note err">No country available.</p>`;
          document.getElementById("announceList").innerHTML = "";
          document.getElementById("announceCount").textContent = "0";
          return;
        }
        const res = await authFetch(`/api/admin/announcements?country=${encodeURIComponent(top)}`);
        const data = await res.json();
        if (!data.ok) {
          document.getElementById("formArea").innerHTML = `<p class="edit-modal-note err">${esc(data.error || "Failed to load.")}</p>`;
          return;
        }
        announcements = data.announcements.map((a) => ({ ...a, country: top }));
        if (data.topics && data.topics.length) topics = data.topics;
      }

      if (!canEditAnnouncements && mode === "list" && announcements.length) { selectedId = announcements[0].id; mode = "edit"; }
      render();
    }

    // Used by the 30s background poll — refreshes the sidebar list only.
    // Never touches formArea: if the agent is mid-typing a new or edited
    // announcement, a poll landing mid-keystroke would otherwise wipe out
    // whatever they haven't saved yet (renderForm() rebuilds the textarea
    // from server data). Save/Delete still call the full loadAnnouncements()
    // above afterward, since at that point there's nothing unsaved to lose.
    // Re-fetches however many countries the list was originally combined
    // from (1, or every allowed country) — same shape as loadAnnouncements()
    // above, just skipping the formArea/topics work since nothing there
    // needs to change on a background poll.
    async function pollAnnouncements() {
      const top = window.AgentCountry ? window.AgentCountry.getCountry() : null;
      const isAll = window.AgentCountry && window.AgentCountry.isAll(top);
      const codes = isAll ? (window.AgentCountry ? window.AgentCountry.getAllowedCountries() : []) : (top ? [top] : []);
      if (!codes.length) return;
      try {
        const results = await Promise.all(codes.map(async (code) => {
          const res = await authFetch(`/api/admin/announcements?country=${encodeURIComponent(code)}`);
          const data = await res.json();
          return data.ok ? { code, data } : null;
        }));
        const good = results.filter(Boolean);
        if (!good.length) return;
        announcements = good.flatMap((r) => r.data.announcements.map((a) => ({ ...a, country: r.code })));
        renderList();
      } catch {
        // Non-fatal — list just stays as-is until the next poll.
      }
    }

    function render() {
      renderList();
      renderForm();
    }

    function renderList() {
      const list = document.getElementById("announceList");
      document.getElementById("announceCount").textContent = announcements.length;
      const q = searchQuery.trim().toLowerCase();
      const filtered = !q ? announcements : announcements.filter((a) =>
        (a.topic || "").toLowerCase().includes(q) || (a.text || "").toLowerCase().includes(q)
      );
      if (!announcements.length) {
        list.innerHTML = '<div class="threads-empty">No announcements yet.<br/>Click + New to create one.</div>';
        return;
      }
      if (!filtered.length) {
        list.innerHTML = '<div class="threads-empty">No matches.</div>';
        return;
      }
      list.innerHTML = "";
      filtered.forEach((a) => {
        const status = effectiveStatus(a);
        const breathing = status.label === "Active" ? " breathing" : "";
        const el = document.createElement("div");
        el.className = "thread-item announce-item" + (mode === "edit" && selectedId === a.id ? " selected" : "");
        el.style.setProperty("--thread-accent", status.color);
        // MERGED (2026-08-21) — country badge, only shown while the
        // list is actually combined across countries (announcementsAreCombined
        // — a single-country list never needs to say which country
        // every item is from, that's the only one there is). Same
        // visual pattern as threads.html's own thread-country-badge.
        const countryBadge = announcementsAreCombined ? `<span class="thread-country-badge">${esc(a.country)}</span>` : "";
        el.innerHTML = `
          <div class="meta">
            <div class="t-title">${countryBadge}${esc(a.topic || "(no topic)")}</div>
            <div class="t-sub">${esc(a.updatedBy || a.createdBy || "")} · ${fmtFullLocal(a.updatedAt)}</div>
          </div>
          <span class="status-indicator">
            <span class="status-dot${breathing}" style="background:${status.color};"></span>
            <span class="status-text" style="color:${status.color};">${status.label}</span>
          </span>
        `;
        el.addEventListener("click", () => { selectedId = a.id; mode = "edit"; render(); });
        list.appendChild(el);
      });
    }

    function renderForm() {
      const area = document.getElementById("formArea");
      area.classList.toggle("form-card", mode !== "list");
      if (mode === "list") { area.innerHTML = ""; return; }
      const a = mode === "edit" ? announcements.find((x) => x.id === selectedId) : null;
      const ro = canEditAnnouncements ? "" : "disabled";
      // The state Save will switch TO: for an existing announcement, the
      // opposite of what it is now; for a brand new one, Active by default
      // (nothing to toggle yet, so it just shows what creating it will do).
      const nextEnabled = a ? !a.enabled : true;
      // MERGED (2026-08-21) — a NEW announcement has no country yet — in
      // combined ("All Countries") mode there's no way to infer one, so
      // this shows an explicit picker right in the form (editing an
      // EXISTING one never shows this — it always keeps whatever
      // country it already belongs to, see `a.country` used directly in
      // save()/remove() below, never re-derived from this field).
      const allowedCountries = window.AgentCountry ? window.AgentCountry.getAllowedCountries() : [];
      const showNewCountryPicker = mode === "new" && announcementsAreCombined && allowedCountries.length > 1;
      const countryPickerHtml = showNewCountryPicker ? `
          <div class="field">
            <label>Country<span class="required">*</span></label>
            <select id="fCountry" ${ro}>
              ${allowedCountries.map((c) => `<option value="${esc(c)}">${esc((window.COUNTRIES && window.COUNTRIES[c]) ? window.COUNTRIES[c].name : c)} (${esc(c)})</option>`).join("")}
            </select>
          </div>` : "";
      area.style.display = "flex";
      area.style.flexDirection = "column";
      area.innerHTML = `
        <div style="flex:1; overflow-y:auto; min-height:0;">
          <p class="edit-modal-title" style="margin-bottom:18px;">${mode === "new" ? "New announcement" : "Edit announcement"}${a && announcementsAreCombined ? ` <span class="edit-modal-note" style="display:inline; opacity:0.7;">(${esc(a.country)})</span>` : ""}</p>
          ${countryPickerHtml}
          <div class="field">
            <label>Issue topic<span class="required">*</span></label>
            <select id="fTopic" ${ro}>
              ${topics.map((t) => `<option value="${esc(t)}" ${a && a.topic === t ? "selected" : ""}>${esc(t)}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>Message<span class="required">*</span></label>
            <textarea id="fText" rows="8" placeholder="Shown in the reminder banner on every page" ${ro}>${esc(a ? a.text : "")}</textarea>
          </div>
          <div style="display:flex; gap:16px;">
            <div class="field" style="flex:1;">
              <label>Starts (optional)</label>
              <input type="datetime-local" id="fStart" value="${a ? isoToLocalInput(a.startAt) : ""}" ${ro} />
            </div>
            <div class="field" style="flex:1;">
              <label>Ends (optional)</label>
              <input type="datetime-local" id="fEnd" value="${a ? isoToLocalInput(a.endAt) : ""}" ${ro} />
            </div>
          </div>
          ${canEditAnnouncements ? "" : '<p class="edit-modal-note">View only.</p>'}
          <p class="edit-modal-note err" id="formErr"></p>
        </div>
        ${canEditAnnouncements ? `
        <div style="display:flex; justify-content:flex-end; gap:10px; flex:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--panel-border);">
          ${a ? '<button type="button" class="announce-delete-btn" id="deleteBtn">🗑 Delete</button>' : ""}
          <button type="button" class="announce-save-btn ${nextEnabled ? "state-active" : "state-inactive"}" id="saveBtn">${nextEnabled ? "Active" : "Inactive"}</button>
        </div>` : ""}
      `;
      if (canEditAnnouncements) {
        document.getElementById("saveBtn").addEventListener("click", () => save(nextEnabled));
        if (a) document.getElementById("deleteBtn").addEventListener("click", () => remove(a.id, a.country));
      }
    }

    async function save(enabled) {
      const text = document.getElementById("fText").value.trim();
      const topic = document.getElementById("fTopic").value;
      const errEl = document.getElementById("formErr");
      errEl.textContent = "";
      if (!text) { errEl.textContent = "Message can't be empty."; return; }
      // MERGED (2026-08-21) — editing an EXISTING announcement always
      // uses its own tagged country (never re-derived from the current
      // mode — see loadAnnouncements()'s comment on why every item
      // carries `.country`). Creating a NEW one uses the in-form country
      // picker when combined mode showed one (see renderForm()), else
      // just the single top-switcher country there's only ever one
      // choice for.
      const existing = mode === "edit" ? announcements.find((x) => x.id === selectedId) : null;
      const countryFieldEl = document.getElementById("fCountry");
      const country = existing ? existing.country : (countryFieldEl ? countryFieldEl.value : (window.AgentCountry ? window.AgentCountry.getCountry() : null));
      if (!country) { errEl.textContent = `No country available.`; return; }
      const startAt = localInputToIso(document.getElementById("fStart").value);
      const endAt = localInputToIso(document.getElementById("fEnd").value);
      if (startAt && endAt && new Date(startAt) >= new Date(endAt)) {
        errEl.textContent = "End time must be after start time.";
        return;
      }
      const id = mode === "edit" ? selectedId : null;
      const res = await authFetch("/api/admin/announcements", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "save", country, id, text, topic, enabled, startAt, endAt }),
      });
      const data = await res.json();
      if (!data.ok) {
        const errText = data.error || "Save failed.";
        errEl.textContent = errText;
        showToast(errText, "err");
        return;
      }
      errEl.textContent = "";
      // The save button doubles as an Active/Inactive toggle (same button,
      // text flips with state) — the toast text has to be derived from
      // `enabled`, the value actually being saved, not hard-coded, or a
      // toggle to Inactive would still show a confusing "Active success."
      showToast(enabled ? "Active success." : "Inactive success.", "ok");
      selectedId = data.announcement.id;
      mode = "edit";
      await loadAnnouncements();
      window.refreshAnnouncementBanner?.();
    }

    async function remove(id, country) {
      if (!confirm("Delete this announcement? This can't be undone.")) return;
      if (!country) { showToast("No country available.", "err"); return; }
      const res = await authFetch("/api/admin/announcements", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "delete", country, id }),
      });
      const data = await res.json();
      if (!data.ok) { showToast(data.error || "Delete failed.", "err"); return; }
      showToast("Delete success.", "ok");
      selectedId = null;
      mode = "new";
      await loadAnnouncements();
      window.refreshAnnouncementBanner?.();
    }

    document.getElementById("announceSearch").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderList();
    });

    document.getElementById("newBtn").addEventListener("click", () => {
      selectedId = null;
      mode = "new";
      render();
    });

    loadAnnouncements();
    setInterval(pollAnnouncements, 30000);
    if (window.AgentCountry) window.AgentCountry.renderSwitcher("countrySwitcherMount", () => loadAnnouncements());
  </script>
</body>
</html>
