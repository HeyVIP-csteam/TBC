                ? `<div class="inline-attach-slot msg-inline-attach" data-attachment-file="${escapeAttr(m.attachmentFileId)}" data-attachment-name="${escapeAttr(m.attachmentName || "attachment")}" data-attachment-country="${escapeAttr((selectedThread && selectedThread.country) || "")}"><div class="inline-attach-loading">Loading attachment…</div></div>`
                : '<span class="msg-attach-tag" title="Sent before this dashboard could look attachments back up — check the Telegram group for it.">📎 attachment</span>'))
        : "";
      return `
        <div class="msg-row ${m.self ? "self" : ""}">
          <div class="msg-avatar" style="background:${color};">${initials}</div>
          <div class="msg-body">
            <div class="msg-who">${escapeHtml(m.from)}${m.handle ? ` <span class="msg-handle">${escapeHtml(m.handle)}</span>` : ""}${m.editedAt ? ' <span class="msg-edited">(edited)</span>' : ""}</div>
            <div class="msg-bubble">${replyTargetBtn}${replyQuote}${escapeHtml(m.text)}${attachTag}</div>
            <div class="msg-time">${timeAgo(m.ts)} ${deliveredTick} ${selfControls}</div>
          </div>
        </div>
      `;
    }

    async function toggleSolved() {
      const action = selectedThread.solved ? "unsolve" : "solve";
      const res = await authFetch(`/api/threads/${selectedThread.id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, country: selectedThread.country }),
      });
      const data = await res.json();
      if (data.ok) {
        selectedThread = data.thread;
        updateThreadContent(selectedThread, true);
        patchLocalThread(selectedThread);
        loadList();
      }
    }

    async function deleteThread() {
      if (!confirm("Delete this tracking record? Telegram and the Sheet are untouched — this only removes it from the dashboard.")) return;
      const deletedId = selectedThread.id;
      const deletedCountry = selectedThread.country;
      const res = await authFetch(`/api/threads/${deletedId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "delete", country: deletedCountry }),
      });
      const data = await res.json();
      if (!data.ok) {
        alert(data.error || "Delete failed.");
        return;
      }
      selectedId = null;
      selectedThread = null;
      main.innerHTML = `<div class="threads-placeholder">Pick a thread on the left, or submit a form to start one.</div>`;
      removeLocalThread(deletedId);
      loadList();
    }

    async function sendReply() {
      const input = document.getElementById("replyInput");
      const text = input.value.trim();
      if (!text && !pendingAttachments.length) return;
      const btn = document.getElementById("replySend");
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        const payload = { action: "reply", text, country: selectedThread.country };
        if (replyTarget) payload.replyToMessageId = replyTarget.messageId;
        if (pendingAttachments.length) {
          payload.attachments = await Promise.all(pendingAttachments.map(async (f) => ({
            name: f.name,
            type: f.type,
            dataUrl: await fileToDataUrl(f),
          })));
        }
        const res = await authFetch(`/api/threads/${selectedThread.id}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!data.ok) {
          alert("❌ Send failed: " + (data.error || "unknown error") + "\n\nYour message wasn't sent — try again.");
          return; // keep input + attachment so the agent can retry without retyping
        }
        selectedThread = data.thread;
        input.value = "";
        pendingAttachments = [];
        replyTarget = null;
        renderReplyTargetBanner();
        renderAttachPreview();
        document.getElementById("replyFileInput").value = "";
        updateThreadContent(selectedThread, true);
        patchLocalThread(selectedThread);
        loadList();
      } catch {
        alert("❌ Send failed: network error.\n\nYour message wasn't sent — try again.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Send";
      }
    }

    async function editRoot() {
      const newText = prompt("Edit the original Telegram message text:\n(This edits the exact message, including any formatting tags.)", selectedThread.rootText || "");
      if (newText === null) return; // cancelled
      if (!newText.trim()) return alert("Text can't be empty.");
      const res = await postAction({ action: "editRoot", text: newText });
      if (!res.ok) return alert(res.error || "Edit failed.");
      selectedThread = res.thread;
      updateThreadContent(selectedThread);
    }

    // "🔄 Sync to Sheet" flow — a real per-field form (built straight off
    // window.MODULES, same source of truth the submission form itself
    // uses) instead of editRoot's single free-text prompt(). Saving posts
    // { action: "editDetails", fields, fieldMap } to the same endpoint,
    // which rebuilds the Telegram message AND (if this ticket wrote a
    // trackable Sheet row — see submit.js's `sheetRef`) that Sheet row,
    // using the exact same builder functions the original submission
    // used. Only offered at all when the thread has t.fieldMap/t.brandId
    // saved — see the showIf on the 📊 button in buildHeaderHTML.
    function openEditDetailsModal() {
      const t = selectedThread;
      const module = (window.MODULES || []).find((m) => m.id === t.module);
      if (!module) return alert(`Unknown module "${t.module}" — can't build an edit form for this ticket.`);
      const fieldMap = t.fieldMap || {};
      // MERGED (2026-08-20) — resolves this module's field set for the
      // TICKET'S OWN country (t.country, sent by GET /api/threads — see
      // that endpoint's own comment on why it's tagged there), not the
      // agent's currently-selected country. An agent working PKR who
      // opens an INR ticket (allowed if their account can see both) must
      // still get INR's field definitions, since that's what the ticket
      // was actually submitted with — using the viewer's own country
      // here would silently show the wrong fields/options for tickets
      // from any OTHER country than whichever one happens to be selected
      // right now.
      const fields = window.getModuleFields ? window.getModuleFields(module, t.country) : (module.fields || []);

      const overlay = document.createElement("div");
      overlay.className = "edit-details-overlay";
      overlay.innerHTML = `
        <div class="edit-details-modal">
          <button type="button" class="modal-close-btn" id="editDetailsClose" title="Close" aria-label="Close">✕</button>
          <div class="edit-details-title">${module.icon || "📊"} Edit fields — ${escapeHtml(module.name)}</div>
          <div class="edit-details-sub">Updates the Telegram message${t.sheetRef ? " and the Google Sheet row" : ""} from these values — not a guess at parsed text.</div>
          <div class="edit-details-fields" id="editDetailsFields"></div>
          <div class="edit-details-status" id="editDetailsStatus"></div>
          <div class="edit-details-actions">
            <button type="button" class="icon-btn" id="editDetailsCancel" style="width:auto; padding:0 16px;">Cancel</button>
            <button type="button" class="btn-submit" id="editDetailsSave" style="width:auto; padding:10px 22px;">Save &amp; Sync</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const container = overlay.querySelector("#editDetailsFields");
      const fieldEls = {};

      fields.forEach((f) => {
        const wrap = document.createElement("div");
        wrap.className = "field";
        const value = fieldMap[f.key] != null ? fieldMap[f.key] : "";
        let controlHtml;
        if (f.type === "textarea") {
          controlHtml = `<textarea name="${escapeAttr(f.key)}">${escapeHtml(value)}</textarea>`;
        } else if (f.type === "select") {
          const rawOpts = f.optionsByBrand ? (f.optionsByBrand[t.brandId] || []) : (f.options || []);
          const opts = rawOpts.map((o) => (typeof o === "object" ? o.value : o));
          controlHtml = `<select name="${escapeAttr(f.key)}">
            <option value="">— Select —</option>
            ${opts.map((o) => `<option value="${escapeAttr(o)}" ${o === value ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
          </select>`;
        } else {
          const inputType = f.type === "number" ? "number" : f.type === "date" ? "date" : "text";
          controlHtml = `<input type="${inputType}" name="${escapeAttr(f.key)}" value="${escapeAttr(value)}" />`;
        }
        wrap.innerHTML = `<label>${escapeHtml(f.label)}${f.required ? ' <span class="required">*</span>' : ""}</label>${controlHtml}`;
        container.appendChild(wrap);
        fieldEls[f.key] = { wrap, control: wrap.querySelector("input,select,textarea") };
      });

      // Same AND-of-conditions showIf logic as the submission form
      // (public/assets/app.js) — deliberately re-implemented here rather
      // than shared, since this modal's fieldEls are plain DOM lookups
      // with no brand-select/attachment/reporter concepts to worry about.
      function conditionMet(showIf) {
        const conditions = Array.isArray(showIf) ? showIf : [showIf];
        return conditions.every((c) => {
          if (c.field === "brand") return c.oneOf.includes(t.brandId); // brand isn't editable here — fixed to the ticket's own
          const driver = fieldEls[c.field];
          return driver && c.oneOf.includes(driver.control.value);
        });
      }
      function refreshVisibility() {
        fields.forEach((f) => {
          if (!f.showIf) return;
          fieldEls[f.key].wrap.style.display = conditionMet(f.showIf) ? "" : "none";
        });
      }
      fields.forEach((f) => {
        if (fieldEls[f.key].control.tagName === "SELECT") {
          fieldEls[f.key].control.addEventListener("change", refreshVisibility);
        }
      });
      refreshVisibility();

      function close() { overlay.remove(); }
      overlay.querySelector("#editDetailsClose").addEventListener("click", close);
      overlay.querySelector("#editDetailsCancel").addEventListener("click", close);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

      overlay.querySelector("#editDetailsSave").addEventListener("click", async () => {
        const submittedFields = fields
          .filter((f) => !f.showIf || fieldEls[f.key].wrap.style.display !== "none")
          .map((f) => ({ key: f.key, label: f.label, value: (fieldEls[f.key].control.value || "").trim() }));
        const missingRequired = fields.find((f) =>
          f.required && (!f.showIf || fieldEls[f.key].wrap.style.display !== "none") && !fieldEls[f.key].control.value.trim()
        );
        const statusEl = overlay.querySelector("#editDetailsStatus");
        if (missingRequired) {
          statusEl.textContent = `"${missingRequired.label}" is required.`;
          statusEl.className = "edit-details-status err";
          return;
        }

        const newFieldMap = Object.fromEntries(submittedFields.map((f) => [f.key, f.value]));
        const saveBtn = overlay.querySelector("#editDetailsSave");
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        statusEl.textContent = "";
        statusEl.className = "edit-details-status";

        const res = await postAction({ action: "editDetails", fields: submittedFields, fieldMap: newFieldMap });
        if (!res.ok) {
          statusEl.textContent = res.error || "Save failed.";
          statusEl.className = "edit-details-status err";
          saveBtn.disabled = false;
          saveBtn.textContent = "Save & Sync";
          return;
        }
        selectedThread = res.thread;
        updateThreadContent(selectedThread);
        patchLocalThread(selectedThread);
        loadList();
        if (res.sheetHasRef && !res.sheetSynced) {
          alert("Telegram message updated, but the Sheet row couldn't be updated:\n" + (res.sheetError || "unknown error") + "\n\nYou may need to fix that row manually.");
        }
        close();
      });
    }

    // "Generate to another Topic" (forwarding) — see functions/api/
    // forward.js for the full write-up. Two-stage modal: pick a target
    // Topic first, THEN its full field form appears, pre-filled
    // wherever a field key happens to match something on the source
    // ticket (UID/Number/Email/Remark, etc.) — everything ELSE (most
    // often Issue Type) starts blank. Every field is editable, INCLUDING
    // pre-filled ones (see point 1 of the design discussion — carried
    // values might not be exactly right for the new Topic). Brand is the
    // one exception: shown read-only, always inherited from the source
    // ticket, never re-typed here.
    function openForwardModal() {
      const source = selectedThread;
      const otherModules = (window.MODULES || []).filter((m) => m.id !== source.module);

      const overlay = document.createElement("div");
      overlay.className = "edit-details-overlay";
      overlay.innerHTML = `
        <div class="edit-details-modal">
          <button type="button" class="modal-close-btn" id="fwdClose" title="Close" aria-label="Close">✕</button>
          <div class="edit-details-title">↗️ Generate to another Topic</div>
          <div class="edit-details-sub">Creates a brand-new ticket in the Topic you pick — new Telegram message, new Sheet row (if that Topic logs to one) — pre-filled from this ticket, same as submitting it fresh.</div>
          <div class="field">
            <label>Send to Topic</label>
            <select id="fwdModule">
              <option value="">— Select a Topic —</option>
              ${otherModules.map((m) => `<option value="${escapeAttr(m.id)}">${m.icon || ""} ${escapeHtml(m.name)}</option>`).join("")}
            </select>
          </div>
          <div id="fwdFieldsWrap" style="display:none;">
            <div class="field"><label>Brand</label><input type="text" value="${escapeAttr(source.brand)}" disabled /></div>
            <div class="field"><label>Reporter / PIC <span class="required">*</span></label><input type="text" id="fwdReporter" value="${escapeAttr(getAuth()?.username || "")}" /></div>
            <div class="edit-details-fields" id="fwdFields"></div>
            <p class="agent-profile-section-label" style="margin-top:4px;">Attachments carried over</p>
            <div class="thread-summary-attachments" id="fwdCarriedAttachments"></div>
            <div class="field" style="margin-top:10px;">
              <label>Add another attachment (optional — e.g. this Topic's group needs a photo the original one didn't)</label>
              <div class="dropzone" id="fwdDropzone" tabindex="0">
                <div class="dz-icon">📎</div>
                <p class="dz-main">Click or drag files here</p>
                <p class="dz-sub">JPG, PNG, PDF — Max 3 files, 20MB each</p>
                <p class="dz-paste">📋 Ctrl+V / ⌘V to paste screenshot</p>
              </div>
              <div class="file-list" id="fwdFileList"></div>
              <input type="file" id="fwdNewFile" multiple hidden />
            </div>
          </div>
          <div class="edit-details-status" id="fwdStatus"></div>
          <div class="edit-details-actions">
            <button type="button" id="fwdCancel" style="width:auto; padding:14px 22px; font-size:14px; font-weight:800; border-radius:12px; border:1px solid var(--required); background:transparent; color:var(--required); cursor:pointer;">Cancel</button>
            <button type="button" class="btn-submit" id="fwdSubmit" style="width:auto; padding:14px 22px;" disabled>Generate &amp; Send</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      function close() { window.removeEventListener("paste", onWindowPaste); overlay.remove(); }
      overlay.querySelector("#fwdClose").addEventListener("click", close);
      overlay.querySelector("#fwdCancel").addEventListener("click", close);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

      const fieldsWrap = overlay.querySelector("#fwdFieldsWrap");
      const fieldsContainer = overlay.querySelector("#fwdFields");
      const submitBtn = overlay.querySelector("#fwdSubmit");
      const statusEl = overlay.querySelector("#fwdStatus");
      const newFileListEl = overlay.querySelector("#fwdFileList");
      let fieldEls = {};
      let targetModule = null;
      let targetFields = []; // resolved via getModuleFields(targetModule, source.country) below — see that call site's comment for why source.country, not the viewer's current country
      const newFiles = []; // File objects, converted to base64 only at submit time

      // Show the source ticket's own attachments as the "carried over"
      // preview — reuses the EXACT SAME inline-attach-slot markup +
      // loadInlineAttachments() the ticket detail view itself uses
      // (defined below), not a re-implementation.
      const carriedFileIds = source.attachmentFileIds || [];
      const carriedWrap = overlay.querySelector("#fwdCarriedAttachments");
      carriedWrap.innerHTML = carriedFileIds.length
        ? carriedFileIds.map((fid, i) => `<div class="inline-attach-slot" data-attachment-file="${escapeAttr(fid)}" data-attachment-name="carried-${i + 1}" data-attachment-country="${escapeAttr(source.country || "")}"><div class="inline-attach-loading">Loading…</div></div>`).join("")
        : `<p style="font-size:12.5px; color:var(--ink-soft); margin:4px 0 0;">This ticket has no attachments to carry over.</p>`;
      loadInlineAttachments();

      overlay.querySelector("#fwdModule").addEventListener("change", (e) => {
        targetModule = otherModules.find((m) => m.id === e.target.value) || null;
        fieldEls = {};
        fieldsContainer.innerHTML = "";
        if (!targetModule) {
          fieldsWrap.style.display = "none";
          submitBtn.disabled = true;
          return;
        }
        // A forwarded ticket keeps the SAME brand (and therefore the
        // same country) as its source — see submit.js's forward handler
        // — so the target module's fields must be resolved for
        // source.country, not whatever country the viewing agent
        // currently has selected in the switcher (those can differ: an
        // agent working PKR can still forward/view an INR ticket they
        // have access to).
        targetFields = window.getModuleFields ? window.getModuleFields(targetModule, source.country) : (targetModule.fields || []);
        fieldsWrap.style.display = "";
        submitBtn.disabled = false;

        const sourceFieldMap = source.fieldMap || {};
        targetFields.forEach((f) => {
          const wrap = document.createElement("div");
          wrap.className = "field";
          const value = sourceFieldMap[f.key] != null ? sourceFieldMap[f.key] : "";
          let controlHtml;
          if (f.type === "textarea") {
            controlHtml = `<textarea name="${escapeAttr(f.key)}">${escapeHtml(value)}</textarea>`;
          } else if (f.type === "select") {
            const rawOpts = f.optionsByBrand ? (f.optionsByBrand[source.brandId] || []) : (f.options || []);
            const opts = rawOpts.map((o) => (typeof o === "object" ? o.value : o));
            controlHtml = `<select name="${escapeAttr(f.key)}">
              <option value="">— Select —</option>
              ${opts.map((o) => `<option value="${escapeAttr(o)}" ${o === value ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
            </select>`;
          } else {
            const inputType = f.type === "number" ? "number" : f.type === "date" ? "date" : "text";
            controlHtml = `<input type="${inputType}" name="${escapeAttr(f.key)}" value="${escapeAttr(value)}" />`;
          }
          wrap.innerHTML = `<label>${escapeHtml(f.label)}${f.required ? ' <span class="required">*</span>' : ""}</label>${controlHtml}`;
          fieldsContainer.appendChild(wrap);
          fieldEls[f.key] = { wrap, control: wrap.querySelector("input,select,textarea") };
        });

        // Same AND-of-conditions showIf logic openEditDetailsModal above
        // uses — re-implemented locally here too, same reasoning (no
        // brand-select/attachment/reporter concepts to entangle with).
        function conditionMet(showIf) {
          const conditions = Array.isArray(showIf) ? showIf : [showIf];
          return conditions.every((c) => {
            if (c.field === "brand") return c.oneOf.includes(source.brandId);
            const driver = fieldEls[c.field];
            return driver && c.oneOf.includes(driver.control.value);
          });
        }
        function refreshVisibility() {
          targetFields.forEach((f) => {
            if (!f.showIf) return;
            fieldEls[f.key].wrap.style.display = conditionMet(f.showIf) ? "" : "none";
          });
        }
        targetFields.forEach((f) => {
          if (fieldEls[f.key].control.tagName === "SELECT") {
            fieldEls[f.key].control.addEventListener("change", refreshVisibility);
          }
        });
        refreshVisibility();
      });

      // Same dropzone behavior (click / drag&drop / paste, with a
      // removable chip list) the submission form itself uses — see
      // public/assets/app.js's own copy of this same logic. Re-
      // implemented locally rather than shared since this one has to be
      // scoped to just this modal (the paste listener in particular
      // must NOT fire while some other part of the page has focus, and
      // must be torn down again on close()).
      const fwdDropzone = overlay.querySelector("#fwdDropzone");
      const fwdFileInput = overlay.querySelector("#fwdNewFile");
      const FWD_MAX_FILES = 3;
      const FWD_MAX_SIZE_MB = 20;

      function renderNewFileList() {
        newFileListEl.innerHTML = newFiles
          .map((f, i) => `<div class="file-chip"><span class="name">${escapeHtml(f.name)}</span><button type="button" data-i="${i}">&times;</button></div>`)
          .join("");
        newFileListEl.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            newFiles.splice(Number(btn.dataset.i), 1);
            renderNewFileList();
          });
        });
      }

      function addNewFiles(list) {
        const rejected = [];
        for (const f of list) {
          if (newFiles.length >= FWD_MAX_FILES) break;
          if (f.size > FWD_MAX_SIZE_MB * 1024 * 1024) {
            rejected.push(f.name);
            continue;
          }
          newFiles.push(f);
        }
        renderNewFileList();
        if (rejected.length) {
          statusEl.textContent = `Skipped (over ${FWD_MAX_SIZE_MB}MB): ${rejected.join(", ")}`;
          statusEl.className = "edit-details-status err";
        }
      }

      fwdDropzone.addEventListener("click", () => fwdFileInput.click());
      fwdDropzone.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") fwdFileInput.click();
      });
      fwdFileInput.addEventListener("change", () => {
        addNewFiles(fwdFileInput.files);
        fwdFileInput.value = ""; // lets the same file (or more) be picked again
      });
      ["dragenter", "dragover"].forEach((evt) =>
        fwdDropzone.addEventListener(evt, (e) => { e.preventDefault(); fwdDropzone.classList.add("drag-over"); })
      );
      ["dragleave", "drop"].forEach((evt) =>
        fwdDropzone.addEventListener(evt, (e) => { e.preventDefault(); fwdDropzone.classList.remove("drag-over"); })
      );
      fwdDropzone.addEventListener("drop", (e) => addNewFiles(e.dataTransfer.files));

      // Scoped to while THIS modal is open only — added here, removed
      // again in close() below — so pasting elsewhere on the page (e.g.
      // the reply box) is never intercepted by a modal that isn't even
      // visible anymore.
      function onWindowPaste(e) {
        const items = Array.from(e.clipboardData.items).filter((i) => i.kind === "file");
        if (!items.length) return;
        addNewFiles(items.map((i) => i.getAsFile()).filter(Boolean));
      }
      window.addEventListener("paste", onWindowPaste);

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      submitBtn.addEventListener("click", async () => {
        if (!targetModule) return;
        const reporter = overlay.querySelector("#fwdReporter").value.trim();
        if (!reporter) {
          statusEl.textContent = "Reporter / PIC is required.";
          statusEl.className = "edit-details-status err";
          return;
        }
        const fields = targetFields
          .filter((f) => !f.showIf || fieldEls[f.key].wrap.style.display !== "none")
          .map((f) => ({ key: f.key, label: f.label, value: (fieldEls[f.key].control.value || "").trim() }));
        const missingRequired = targetFields.find((f) =>
          f.required && (!f.showIf || fieldEls[f.key].wrap.style.display !== "none") && !fieldEls[f.key].control.value.trim()
        );
        if (missingRequired) {
          statusEl.textContent = `"${missingRequired.label}" is required.`;
          statusEl.className = "edit-details-status err";
          return;
        }
        const fieldMap = Object.fromEntries(fields.map((f) => [f.key, f.value]));

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending…";
        statusEl.textContent = "";
        statusEl.className = "edit-details-status";

        let newAttachments;
        try {
          newAttachments = await Promise.all(newFiles.map(async (file) => ({
            name: file.name, type: file.type, dataUrl: await fileToDataUrl(file),
          })));
        } catch {
          statusEl.textContent = "Couldn't read one of the new attachments.";
          statusEl.className = "edit-details-status err";
          submitBtn.disabled = false;
          submitBtn.textContent = "Generate & Send";
          return;
        }

        let res;
        try {
          const r = await authFetch("/api/forward", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            // MERGED (2026-08-21) — sourceCountry was required server-
            // side (forward.js) but never actually sent here — a real
            // pre-existing bug this pass found (Generate & Send has been
            // unconditionally failing with a country-authorization error
            // the whole time, not something this pass introduced).
            // `source` already carries `.country` (see GET /api/threads'
            // own comment on why every thread is tagged with it).
            body: JSON.stringify({ sourceThreadId: source.id, sourceCountry: source.country, targetModule: targetModule.id, fields, fieldMap, reporter, newAttachments }),
          });
          res = await r.json();
        } catch {
          statusEl.textContent = "Network error — check your connection and try again.";
          statusEl.className = "edit-details-status err";
          submitBtn.disabled = false;
          submitBtn.textContent = "Generate & Send";
          return;
        }

        if (!res.ok) {
          statusEl.textContent = res.error || "Forward failed.";
          statusEl.className = "edit-details-status err";
          submitBtn.disabled = false;
          submitBtn.textContent = "Generate & Send";
          return;
        }
        if (res.sheetAttempted && !res.sheetLogged) {
          alert("Ticket was generated and sent to Telegram, but the Sheet row couldn't be written:\n" + (res.sheetError || "unknown error"));
        }

        // Reflect the new "↗️ Forwarded to..." reference on the ORIGINAL
        // ticket immediately (matches what addForwardedToLink() just
        // saved server-side) — patched locally rather than re-fetched,
        // same pattern editRoot()/recallRoot() already use elsewhere on
        // this page.
        selectedThread = {
          ...source,
          forwardedTo: [...(source.forwardedTo || []), { threadId: res.thread.id, module: targetModule.id, moduleName: targetModule.name, title: res.thread.title, at: new Date().toISOString() }],
        };
        updateThreadContent(selectedThread);
        patchLocalThread(selectedThread);
        loadList();
        close();
        openThread(res.thread.id, source.country); // jump straight to the newly generated ticket
      });
    }

    async function recallRoot() {
      if (!confirm("Recall the original ticket message from Telegram? This removes it from the group. Your tracking record, the Sheet row, and this conversation stay.")) return;
      const res = await postAction({ action: "recallRoot" });
      if (!res.ok) return alert(res.error || "Recall failed.");
      selectedThread = res.thread;
      updateThreadContent(selectedThread);
      patchLocalThread(selectedThread);
      loadList();
    }

    async function editReply(messageId, currentText) {
      const newText = prompt("Edit this reply:", currentText || "");
      if (newText === null) return;
      if (!newText.trim()) return alert("Text can't be empty.");
      const res = await postAction({ action: "editReply", messageId: Number(messageId), text: newText });
      if (!res.ok) return alert(res.error || "Edit failed.");
      selectedThread = res.thread;
      updateThreadContent(selectedThread);
    }

    async function recallReply(messageId) {
      if (!confirm("Recall this reply from Telegram?")) return;
      const res = await postAction({ action: "recallReply", messageId: Number(messageId) });
      if (!res.ok) return alert(res.error || "Recall failed.");
      selectedThread = res.thread;
      updateThreadContent(selectedThread);
    }

    // MERGED (2026-08-21) — injects `country` into every payload here,
    // once, rather than at each of this helper's 5 call sites — every
    // mutating /api/threads/<id> action needs it (see that endpoint's
    // own comment), and this was the actual root cause of "Couldn't
    // load this thread"/action-failed errors across this whole file:
    // this helper (and several other call sites fixed alongside it)
    // simply never got updated to send it when the requirement was
    // added during the D1-migration pass.
    async function postAction(payload) {
      const res = await authFetch(`/api/threads/${selectedThread.id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...payload, country: selectedThread.country }),
      });
      return res.json();
    }


    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, "&quot;");
    }

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ---- Attachment lightbox ----
    //
    // Reverse of the server's guessContentType() in
    // functions/api/attachment/[fileId].js — given a MIME type, returns
    // the file extension a downloaded file should have. Needed because
    // "ticket-attachment-N" (the placeholder name used when we never
    // captured the agent's original filename — see the comment above)
    // has NO extension at all; downloading a file with no extension
    // means the OS has no idea which app to open it with, which is
    // exactly why a downloaded PDF can look "broken" even though the
    // actual bytes came through Telegram completely intact.
    function guessExtensionFromMime(mimeType) {
      const map = {
        "image/jpeg": "jpg", "image/png": "png", "image/gif": "gif", "image/webp": "webp",
        "image/bmp": "bmp", "image/heic": "heic", "image/heif": "heif",
        "video/mp4": "mp4", "video/quicktime": "mov", "video/webm": "webm", "video/3gpp": "3gp",
        "application/pdf": "pdf",
      };
      return map[(mimeType || "").split(";")[0].trim().toLowerCase()] || null;
    }

    // Last-resort universal fallback: for OLDER tickets (submitted before
    // today's fix, or ones where Telegram genuinely never retained a
    // resolvable filename/extension on its own side), neither the
    // filename NOR the server's declared Content-Type can be trusted —
    // there's simply no metadata left to guess from. Rather than give
    // up, read the file's own first few bytes and check them against
    // known "magic number" signatures every one of these formats starts
    // with. This works regardless of what any filename or header claims,
    // because it's reading the actual file content, not a label someone
    // else attached to it.
    async function sniffTypeFromBlob(blob) {
      const head = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
      const hex = Array.from(head).map((b) => b.toString(16).padStart(2, "0")).join("");
      if (hex.startsWith("25504446")) return "application/pdf"; // %PDF
      if (hex.startsWith("ffd8ff")) return "image/jpeg";
      if (hex.startsWith("89504e47")) return "image/png";
      if (hex.startsWith("474946383761") || hex.startsWith("474946383961")) return "image/gif"; // GIF87a / GIF89a
      if (hex.startsWith("52494646") && hex.slice(16, 24) === "57454250") return "image/webp"; // RIFF....WEBP
      if (hex.startsWith("504b0304")) return "application/zip"; // also covers docx/xlsx/pptx (all zip-based)
      // MERGED (2026-08-21) — kept in sync with the server-side version
      // of this exact function (functions/api/attachment/[fileId].js's
      // sniffTypeFromBytes) — that file's own comment explains why
      // these 3 were added (all 3 original per-country projects
      // independently converged on the same signature set).
      if (hex.startsWith("4d5a")) return "application/x-msdownload"; // MZ (exe/dll)
      if (hex.slice(8, 16) === "66747970") return "video/mp4"; // ....ftyp
      if (hex.startsWith("1f8b")) return "application/gzip";
      return null;
    }

    function withExtension(name, mimeType) {
      if (/\.[a-zA-Z0-9]{2,5}$/.test(name)) return name; // already has something extension-shaped
      const ext = guessExtensionFromMime(mimeType);
      return ext ? `${name}.${ext}` : name;
    }

    // Fetches the real bytes live from /api/attachment/<fileId> only at
    // the moment someone clicks — nothing is pre-fetched or cached
    // beyond the browser's own in-memory object URL for as long as the
    // lightbox stays open (revoked on close, see closeAttachLightbox()).
    // Non-image files (PDF, etc.) just trigger a normal browser download
    // instead of trying to preview inline.
    const attachLightbox = document.getElementById("attachLightbox");
    const attachLightboxBody = document.getElementById("attachLightboxBody");

    // ---- Shared attachment cache ----
    //
    // Images/videos now load AUTOMATICALLY the moment a thread opens
    // (inline in the summary card + each reply bubble) rather than
    // needing a click first. But the thread view re-renders from
    // scratch on every 6-second poll (see updateThreadContent()) — no
    // caching would mean re-fetching every visible attachment from
    // Telegram every single poll, which is slow and pointless (nothing
    // about an already-loaded attachment ever changes). This Map caches
    // by fileId, storing the in-flight/completed Promise itself (not
    // just the result) so two nearly-simultaneous requests for the same
    // fileId (e.g. the inline slot AND a lightbox click both wanting it
    // at once) share one fetch instead of firing two.
    const attachmentCache = new Map(); // fileId -> Promise<{url, type}>

    function getAttachmentUrl(fileId, name, country) {
      // MERGED (2026-08-21) — cache key now includes country: a
      // Telegram file_id is only ever resolvable by the SAME bot that
      // originally received it (Telegram scopes file_ids per-bot), so
      // the request MUST tell the server which country's bot token to
      // use — this endpoint had no way to know that at all before this
      // pass (real bug: viewing ANY ticket attachment has been broken
      // since the single global TELEGRAM_BOT_TOKEN binding was removed
      // in the merge, not something this specific pass introduced).
      const cacheKey = `${country || ""}:${fileId}`;
      if (!attachmentCache.has(cacheKey)) {
        attachmentCache.set(cacheKey, (async () => {
          const params = new URLSearchParams();
          if (name) params.set("name", name);
          if (country) params.set("country", country);
          const qs = params.toString() ? `?${params.toString()}` : "";
          const res = await authFetch(`/api/attachment/${encodeURIComponent(fileId)}${qs}`);
          if (!res.ok) {
            const msg = await res.text().catch(() => "");
            throw new Error(msg || "Couldn't load this attachment.");
          }
          const blob = await res.blob();
          let type = blob.type || "";
          // Server had nothing better to declare than the generic
          // catch-all (see the comment on sniffTypeFromBlob above) — try
          // reading the actual bytes before giving up on knowing the type.
          if (!type || type === "application/octet-stream") {
            const sniffed = await sniffTypeFromBlob(blob).catch(() => null);
            if (sniffed) type = sniffed;
          }
          return { url: URL.createObjectURL(blob), type };
        })());
      }
      return attachmentCache.get(cacheKey);
    }

    // Fills every not-yet-loaded ".inline-attach-slot" on the page (the
    // summary card's ticket attachments + each reply's inline
    // attachment) with the real image/video, using the cache above so
    // repeat calls (every poll) skip anything already loaded. Called at
    // the end of updateThreadContent() — see that function.
    function loadInlineAttachments() {
      document.querySelectorAll(".inline-attach-slot[data-attachment-file]:not([data-filled])").forEach((slot) => {
        const fileId = slot.dataset.attachmentFile;
        const name = slot.dataset.attachmentName || "attachment";
        const country = slot.dataset.attachmentCountry || (selectedThread && selectedThread.country) || "";
        slot.setAttribute("data-filled", "1"); // mark now so a poll landing mid-fetch doesn't double-trigger
        getAttachmentUrl(fileId, name, country).then(({ url, type }) => {
          if (!document.body.contains(slot)) return; // a newer poll already replaced this DOM before we resolved
          if (type.startsWith("video/")) {
            slot.innerHTML = `<video src="${url}" controls class="inline-attach-media"></video>`;
          } else if (type.startsWith("image/")) {
            slot.innerHTML = `<img src="${url}" alt="${escapeAttr(name)}" class="inline-attach-media" />`;
          } else {
            // Content-Type couldn't be confirmed as image/video (common
            // for ticket-level attachments — see the comment on the
            // "ticket-attachment-N" placeholder name a few lines up,
            // which has no real extension to guess from, and Telegram
            // itself doesn't always set a specific Content-Type either).
            // Rather than give up and show a download link for what
            // might genuinely be a perfectly normal photo, optimistically
            // try rendering it as an <img> anyway — a browser decodes
            // <img> from the ACTUAL file bytes, not the declared MIME
            // type, so this still displays correctly even when `type`
            // was wrong/generic. Only truly falls back to the download
            // link if the browser actually fails to decode it as an
            // image (this file genuinely isn't one).
            const img = document.createElement("img");
            img.alt = name;
            img.className = "inline-attach-media";
            img.addEventListener("error", () => {
              if (!document.body.contains(slot)) return;
              const downloadName = withExtension(name, type);
              slot.innerHTML = `<a href="${url}" download="${escapeAttr(downloadName)}" class="inline-attach-file">📎 ${escapeHtml(downloadName)} — click to download</a>`;
            }, { once: true });
            slot.innerHTML = "";
            slot.appendChild(img);
            img.src = url; // set last so the error listener above is already attached
          }
          // Clicking an inline image/video also opens the fullscreen
          // lightbox, for a closer look — small bonus on top of what
          // was actually asked for, reuses the cache so it's instant.
          const media = slot.querySelector("img.inline-attach-media, video.inline-attach-media");
          if (media) media.addEventListener("click", () => viewAttachment(fileId, name, country));
        }).catch((err) => {
          if (!document.body.contains(slot)) return;
          // MERGED (2026-08-21) — surfaces the REAL reason now (matches
          // viewAttachment()'s lightbox error, which already did this)
          // instead of always showing the same generic text regardless
          // of what actually went wrong — a real diagnostic gap: with
          // the old hardcoded text there was no way to tell "Telegram
          // genuinely can't resolve this file_id anymore" apart from
          // "the request never even had a country" apart from "network
          // hiccup," which all look identical to an agent (or to
          // anyone debugging a screenshot of one after the fact).
          slot.innerHTML = `<div class="inline-attach-error" title="${escapeAttr(String((err && err.message) || ""))}">⚠️ ${escapeHtml(String((err && err.message) || "Couldn't load this attachment."))}</div>`;
        });
      });
    }

    async function viewAttachment(fileId, name, country) {
      attachLightbox.classList.add("is-open");
      attachLightboxBody.innerHTML = `<div class="attach-lightbox-status">Loading…</div>`;
      try {
        const { url, type } = await getAttachmentUrl(fileId, name, country || (selectedThread && selectedThread.country));
        if (type.startsWith("video/")) {
          attachLightboxBody.innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
        } else if (type.startsWith("image/")) {
          attachLightboxBody.innerHTML = `<img src="${url}" alt="${escapeAttr(name || "attachment")}" />`;
        } else {
          // Content-Type wasn't confirmed as image/video — same situation
          // as loadInlineAttachments() above (see its comment on the
          // "ticket-attachment-N" placeholder name having no real
          // extension). Try rendering as an <img> anyway before assuming
          // it's a genuinely non-previewable file — a browser decodes
          // <img> from the actual bytes, not the declared MIME type.
          const img = document.createElement("img");
          img.alt = name || "attachment";
          img.addEventListener("error", () => {
            // Really isn't an image — hand it off as a normal download
            // instead of pretending we can preview it inline.
            const a = document.createElement("a");
            a.href = url;
            a.download = name || "attachment";
            document.body.appendChild(a);
            a.click();
            a.remove();
            attachLightboxBody.innerHTML = `<div class="attach-lightbox-status">Downloaded — this file type can't be previewed here.</div>`;
          }, { once: true });
          attachLightboxBody.innerHTML = "";
          attachLightboxBody.appendChild(img);
          img.src = url; // set last so the error listener above is already attached
        }
      } catch (e) {
        attachLightboxBody.innerHTML = `<div class="attach-lightbox-status attach-lightbox-error">${escapeHtml(String((e && e.message) || "Couldn't load this attachment."))}</div>`;
      }
    }

    function closeAttachLightbox() {
      attachLightbox.classList.remove("is-open");
      attachLightboxBody.innerHTML = "";
      // NOTE: deliberately NOT revoking the object URL here anymore —
      // it's now a shared cache entry (see attachmentCache above) that
      // an inline thumbnail elsewhere on the page may still be using,
      // not something exclusively owned by the lightbox. Object URLs
      // get cleaned up by the browser when the page/tab itself closes.
    }
    document.getElementById("attachLightboxClose").addEventListener("click", closeAttachLightbox);
    attachLightbox.addEventListener("click", (e) => { if (e.target === attachLightbox) closeAttachLightbox(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && attachLightbox.classList.contains("is-open")) closeAttachLightbox(); });

    // Paste-anywhere, like Telegram desktop: copy a screenshot and just
    // Ctrl+V / ⌘V while a thread is open — no need to click into the
    // reply box first. Scoped with guards instead of to one element:
    //   - no thread open → nothing to attach it to, let it fall through
    //   - an edit/forward modal is open → that modal has its own scoped
    //     paste handling (see onWindowPaste in openForwardModal), let it
    //     own the paste instead of double-queuing onto the reply below
    //   - the attachment lightbox is open → the person is VIEWING an
    //     existing attachment, not composing a new reply
    // Only acts when the clipboard actually contains a file — a normal
    // text paste (kind "string") always falls through untouched,
    // wherever on the page it happens.
    document.addEventListener("paste", (e) => {
      if (!selectedThread) return;
      if (document.querySelector(".edit-details-overlay")) return;
      if (attachLightbox.classList.contains("is-open")) return;
      const items = Array.from(e.clipboardData?.items || []);
      const files = items.filter((it) => it.kind === "file").map((it) => it.getAsFile()).filter(Boolean);
      if (!files.length) return;
      e.preventDefault();
      // Clipboard screenshots often come through with a generic name
      // like "image.png" with no useful info — good enough as-is, but
      // give it a timestamp so multiple pastes don't look identical in
      // the chip row.
      const named = files.map((f, i) => (f.name && f.name !== "image.png") ? f : new File([f], `pasted-${Date.now()}-${i}.${(f.type.split("/")[1] || "png")}`, { type: f.type }));
      queueAttachments(named);
      // Land focus in the reply box so the caption is easy to type right
      // after pasting, same as if the person had clicked 🔗 first.
      document.getElementById("replyInput")?.focus();
    });

    bootDashboard();

    // Browsers throttle background-tab timers, so a poll can lag while the
    // tab is hidden (e.g. agent switches to the Telegram app/tab). Catch up
    // immediately the moment this tab becomes visible again. (Idle-timeout
    // checking itself is authguard.js's job, not this page's.)
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        loadList(document.getElementById("threadSearch").value);
        refreshOpenThread();
      }
    });
  </script>
</body>
</html>
