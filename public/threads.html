<style>
/* Inline placeholder canvas background — first thing the browser parses
   in <head>, so it paints before any network request (external CSS, the
   photo itself) resolves. Values are hard-coded here (can't use var()
   yet — style.css may not have loaded) but are kept in exact sync with
   the "real" html{}/html[data-theme=light]{} rule in style.css, so the
   moment that stylesheet finishes loading there is zero visible change.
   Must stay inline and first — an external <link> here would leave a
   blank gap for a network round trip before anything paints. Only sets
   background on <html>, never <body>: <body> has its own
   theme-toggle transition, and animating from this photo to some other
   background would try to interpolate image -> gradient, which browsers
   can't do and would just look like a broken flash. */
html {
  background-color: #090c1c;
  background-image:
    linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
    url('/assets/img/bg-space.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
html[data-theme="light"] {
  background-color: #dbe7fb;
  background-image:
    radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),
    linear-gradient(160deg, #dbe7fb 0%, #d9cef4 45%, #cdbdf2 75%, #c4b2ee 100%);
}
</style>

  <script src="/assets/hub-nav.js?v=615e67a7"></script>
  <script src="/assets/brand-row.js?v=ea371f55"></script>
  <script>
    window.HubNav.mount("hubNavMount", {});
    window.BrandRow.mount("pageBrandRow");

    // ---- Note on feedback (alert vs. the site-wide toast) --------------
    // This page deliberately keeps native alert() for send/edit/recall/
    // delete failures instead of the /assets/toast.js "click anywhere to
    // dismiss" error toast used elsewhere in the app. Two reasons, both
    // from feedback-toast-system-design.md's list of intentional
    // exceptions, not an oversight:
    //   1. Replying to a thread is the highest-frequency action in the
    //      whole app (this is where agents spend most of their shift). A
    //      toast that has to be clicked away every single time it fails
    //      would be a constant tap-tax on exactly the busiest screen.
    //   2. A few of these messages (the "Telegram updated but the Sheet
    //      row couldn't be updated" ones) carry a real error string the
    //      agent needs to read and act on, not just glance at — alert()
    //      blocking until dismissed suits that better than a popup that
    //      might get missed mid-scroll.
    // Successful sends/edits/deletes aren't toasted either, since the
    // change is already visible in the thread/list right away.
    window.initThemeToggle();

    window.initClock();

    // ---- Auth ----------------------------------------------------------
    // No session/token — see functions/_shared/accounts.js for why. We
    // just keep the username+password the agent logged in with in
    // localStorage and re-send them as headers on every request; the
    // server re-verifies (password + office IP) every single time.
    // Login itself, idle-timeout, and the actual auth headers are all
    // handled by /assets/authguard.js (window.AgentAuth) before this page
    // even renders — by the time this script runs, we're guaranteed to be
    // logged in. authFetch here is just a short alias.
    const authFetch = window.AgentAuth.authFetch;
    const getAuth = window.AgentAuth.getAuth;

    function bootDashboard() {
      const auth = getAuth();
      // Recall Chat History (the old hidden deletion-log dot) is a normal
      // section now, but still admin-or-above only — the server 401s it
      // for anyone else regardless, this just avoids showing a dead-end
      // section to an agent/senior who'd get nothing useful out of it.
      // Rank-based (not a literal "admin" string match) so SuperAdmin
      // sees it too — matches functions/_shared/accounts.js ROLE_RANK.
      // Includes "owner" (2026-07) for the same reason described in
      // index.html's copy of this same constant — otherwise an Owner
      // session would silently compute as rank 0 here via `?? 0` below.
      const ROLE_RANK = { agent: 0, senior: 1, admin: 2, superadmin: 3, owner: 4 };
      const isAdmin = (ROLE_RANK[auth.role] ?? 0) >= ROLE_RANK.admin;
      // Only the TAB BUTTON's visibility is decided here — actual panel
      // visibility (#recallSection's display) is entirely owned by
      // switchTab() now (data-tab-panel), so this must never also poke
      // that style directly or it'd show Recall's panel alongside
      // whichever tab is actually selected.
      isAdminForRecall = isAdmin;
      document.getElementById("tabRecall").style.display = isAdmin ? "" : "none";
      // PKR-MIGRATION-FOLLOWUP (2026-08-23) — mounts the country
      // switcher (was previously missing on this page entirely, so the
      // dropdown either didn't render or, if some other change already
      // added it, never actually filtered anything — see
      // filterByCountry()/renderLists() above). No server refetch
      // needed on change: all countries' threads are already fetched
      // and cached in activeThreads/solvedThreads, so just re-render
      // through the filter.
      if (window.AgentCountry) window.AgentCountry.renderSwitcher("countrySwitcherMount", () => renderLists());
      loadList();
      if (isAdmin) loadRecallLog();
      polishEmoji();
      // Two different rhythms on purpose: refreshOpenThread() reads a
      // single thread directly by ID (cheap, not affected by KV's
      // separate/stricter list() quota — see loadList() below), so it
      // stays fast/responsive since that's what actually matters when
      // someone's actively viewing a conversation. loadList() (the
      // sidebar) is what calls the server's listThreads(), which is
      // itself now cached for 3 minutes server-side — polling it every
      // 6s was just re-fetching the exact same cached data 30 times
      // over for no benefit, while still adding needless request volume.
      // 30s keeps the sidebar feeling reasonably live without that waste.
      pollTimer = setInterval(() => {
        refreshOpenThread();
      }, 6000);
      listPollTimer = setInterval(() => {
        loadList(document.getElementById("threadSearch").value);
        if (isAdmin) loadRecallLog();
      }, 30000);
    }

    // ---------------------------------------------------------------------

    let activeThreads = [];
    let solvedThreads = [];
    let recallEntries = [];
    let selectedId = null;
    let selectedThread = null;
    let pollTimer = null;
    let listPollTimer = null;
    let searchTimer = null;

    // ---- Sidebar diffed rendering ---------------------------------------
    // id -> { el, key } for every thread-item currently in the DOM (active
    // OR solved — one shared map, since a thread can move between the two
    // sections, e.g. a TG follow-up auto-reopening an already-solved
    // ticket server-side, see threads.js). renderLists() below reuses
    // these nodes (and just relocates/patches them) instead of wiping and
    // recreating the whole sidebar on every 6s poll — see renderLists().
    const renderedItemEls = new Map();

    // ---- Virtualized list rendering --------------------------------------
    // MERGED (2026-08-21) — a direct business-owner performance report:
    // clicking "Select" on the Solved tab (2,016 threads in it) froze the
    // tab long enough for Chrome's "Page Unresponsive" prompt to show up.
    // An earlier pass fixed the WORST of that (making select-mode/checked-
    // state changes a cheap in-place patch instead of a full rebuild — see
    // patchItemViewState() below) — but with 2,016 real DOM nodes sitting
    // in the list at all times regardless, there was still a real,
    // permanent baseline cost (layout/paint/memory scaling with total
    // item count) that no amount of cheaper patching alone fixes.
    //
    // The actual fix, ported from the INR original project's own
    // threads.html (it had already solved this exact problem, independent
    // of this merge — see PATTERNS-virtualized-list-rendering.md there):
    // only the rows ACTUALLY VISIBLE in the scrollable viewport (roughly
    // 15–20 of them, plus a small overscan buffer) ever become real DOM
    // nodes. A single "sizer" element gives the container the correct
    // total scrollHeight so the scrollbar feels like a normal, complete
    // list; each visible row is positioned with `top: index * ROW_HEIGHT`
    // instead of relying on normal document flow. Opening the 2,016-item
    // Solved tab now costs the same ~25 DOM nodes as opening a 1-thread
    // tab — the 2,016 only ever affects one number (the sizer's height).
    //
    // ADAPTED, not ported as-is: INR's original had Active/Solved sharing
    // ONE list container with a currentTab-driven switch, and that
    // container was its own independently-scrolling element. This
    // codebase's structure is different — activeList/solvedList are two
    // separate, permanently-present containers, and the actual scrolling
    // happens on their shared ancestor (#threadsSidebar, which also holds
    // the search box and tab bar above them) — restructuring the CSS to
    // match INR's exact layout was judged riskier than adapting the
    // windowing math to work against the real scroll container instead
    // (see getListScrollWindow() below, which is the one genuinely new
    // piece here, not present in INR's version).
    const CARD_HEIGHT = 58; // .thread-item's real rendered height at this codebase's current padding/font-size (9px*2 padding + ~40px of two-line content) — see the CSS comment on .thread-item for why this must stay a forced constant, not something measured from a real row
    const ROW_GAP = 6;      // matches .thread-list's own `gap: 6px` — absolutely-positioned rows don't get flex gap for free, so this has to be added into ROW_HEIGHT explicitly instead
    const ROW_HEIGHT = CARD_HEIGHT + ROW_GAP;
    const OVERSCAN_ROWS = 8; // extra rows rendered just outside the visible viewport so fast scrolling doesn't show blank gaps for a frame
    const threadsSidebarEl = document.getElementById("threadsSidebar");
    // One scaffold per section — "active"/"solved" only (Recall has its
    // own, much smaller, non-virtualized render path — renderRecallList()
    // further down — its item count is capped at 500 server-side and
    // rebuilds wholesale on load, not reconciled, so it doesn't have this
    // problem at anywhere near the same scale).
    const virtualScaffolds = {
      active: { sizerEl: null },
      solved: { sizerEl: null },
    };

    function ensureVirtualScaffold(tab, container) {
      const scaffold = virtualScaffolds[tab];
      if (scaffold.sizerEl && scaffold.sizerEl.parentNode === container) return scaffold;
      container.innerHTML = "";
      const sizerEl = document.createElement("div");
      sizerEl.setAttribute("aria-hidden", "true");
      sizerEl.style.cssText = "position:absolute; top:0; left:0; width:1px; pointer-events:none; visibility:hidden;";
      container.appendChild(sizerEl);
      scaffold.sizerEl = sizerEl;
      return scaffold;
    }

    // Converts #threadsSidebar's own scroll position into "how far
    // scrolled INTO this specific container" — needed because the
    // container itself doesn't scroll independently, its ancestor
    // (#threadsSidebar) does, alongside the search box/tab bar/other
    // section above it. getBoundingClientRect() comparisons (not
    // offsetTop) deliberately, since that stays correct regardless of
    // which element ends up being the nearest positioned ancestor —
    // an easy way to get subtly wrong numbers with offsetTop instead.
    function getListScrollWindow(container) {
      const sidebarRect = threadsSidebarEl.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();
      const containerTopWithinSidebar = (containerRect.top - sidebarRect.top) + threadsSidebarEl.scrollTop;
      const scrollTop = Math.max(0, threadsSidebarEl.scrollTop - containerTopWithinSidebar);
      const viewportH = threadsSidebarEl.clientHeight || 500;
      return { scrollTop, viewportH };
    }

    function renderVirtualWindow(tab, container, items) {
      const scaffold = ensureVirtualScaffold(tab, container);
      scaffold.sizerEl.style.height = (items.length * ROW_HEIGHT) + "px";
      if (!items.length) return;

      const { scrollTop, viewportH } = getListScrollWindow(container);
      let start = Math.floor(scrollTop / ROW_HEIGHT) - OVERSCAN_ROWS;
      let end = Math.ceil((scrollTop + viewportH) / ROW_HEIGHT) + OVERSCAN_ROWS;
      start = Math.max(0, start);
      end = Math.min(items.length, end);

      const touchedEls = [];
      const windowIds = new Set();

      for (let i = start; i < end; i++) {
        const item = items[i];
        windowIds.add(item.id);
        const key = itemRenderKey(item);
        let entry = renderedItemEls.get(item.id);
        if (!entry || entry.key !== key) {
          if (entry && entry.el.parentNode) entry.el.remove();
          entry = { el: renderItem(item), key };
          entry.el.style.position = "absolute";
          entry.el.style.left = "0";
          entry.el.style.right = "0";
          entry.el.style.height = CARD_HEIGHT + "px";
          entry.el.style.overflow = "hidden";
          entry.el.style.boxSizing = "border-box";
          renderedItemEls.set(item.id, entry);
          touchedEls.push(entry.el);
        }
        patchItemViewState(entry.el, item);
        entry.el.style.top = (i * ROW_HEIGHT) + "px"; // every row's top, reused or not — its index can shift even when its own data didn't change (e.g. a new thread landed above it)
        if (entry.el.parentNode !== container) container.appendChild(entry.el);
      }

      // Detach anything that scrolled out of THIS window this pass —
      // stays IN renderedItemEls (not deleted), so scrolling back finds
      // the cached { el, key } and reuses it outright instead of
      // rebuilding, same principle as the rest of this file's diffed
      // rendering. Only touches rows that actually belong to `container`
      // right now — a row that already moved to the OTHER section
      // (Active -> Solved) this same pass must not be ripped back out.
      for (const [id, entry] of renderedItemEls) {
        if (windowIds.has(id)) continue;
        if (entry.el.parentNode === container) entry.el.remove();
      }

      if (touchedEls.length) polishEmoji(container);
    }

    let virtualRafPending = false;
    function scheduleVirtualWindowRender() {
      if (virtualRafPending) return;
      virtualRafPending = true;
      requestAnimationFrame(() => {
        virtualRafPending = false;
        // Only the currently-VISIBLE tab's window can possibly have
        // changed from a scroll — Recall isn't virtualized (see above),
        // and re-deriving the hidden tab's items array here would be
        // wasted work for something the person can't see anyway.
        if (currentTab === "active") renderVirtualWindow("active", activeList, activeThreads);
        else if (currentTab === "solved") renderVirtualWindow("solved", solvedList, solvedThreads);
      });
    }
    threadsSidebarEl.addEventListener("scroll", scheduleVirtualWindowRender, { passive: true });

    // ---- ⋮ menu + Select batch mode -----------------------------------
    let openItemMenuId = null;   // which thread's ⋮ dropdown is currently open (sidebar only, not select mode)
    let selectMode = false;      // sidebar is showing checkboxes instead of ⋮
    let selectedIds = new Set(); // checked thread ids, can span both Active and Solved

    // ---- @ Tag Username --------------------------------------------------
    // Candidates fetched from /api/mention-candidates, cached in memory
    // per brand+module (see loadMentionCandidatesForThread) so re-opening
    // the same thread, or @-ing more than once in it, doesn't re-fetch.
    const mentionCandidatesCache = {}; // "brandId::module" -> [{handle, from}, ...]
    let currentMentionCandidates = []; // merged list for whichever thread is open
    let mentionActiveIndex = -1;

    // ---- Local "optimistic" sidebar patches --------------------------
    // The sidebar list comes from THREADS_KV.list() (see threads.js),
    // which Cloudflare documents as *eventually* consistent across their
    // edge — writing a thread's new metadata (e.g. solved:true) doesn't
    // guarantee list() reflects it on the very next call. But any action
    // WE just took (solve/unsolve/delete/reply) already hands us that
    // thread's true fresh state straight from the POST response — no
    // reason to wait for list() to catch up just to show it. So: patch
    // it into the local sidebar arrays immediately, and keep protecting
    // that entry from being clobbered by a stale server response for a
    // short window, long enough for KV to actually propagate.
    const localPatches = new Map(); // id -> { summary: {...}|null, expiresAt }
    const PATCH_TTL_MS = 20000;

    function summaryFromThread(t) {
      return {
        id: t.id, module: t.module, moduleName: t.moduleName, icon: t.icon, accent: t.accent,
        brand: t.brand, title: t.title, submitter: t.submitter, submittedAt: t.submittedAt,
        lastActivity: t.lastActivity, solved: t.solved, solvedAt: t.solvedAt,
        replyCount: t.messages.length,
      };
    }

    // Call right after a solve/unsolve/reply/edit/recall action succeeds —
    // `t` is the fresh thread record the server just handed back.
    function patchLocalThread(t) {
      localPatches.set(t.id, { summary: summaryFromThread(t), expiresAt: Date.now() + PATCH_TTL_MS });
      applyLocalPatches();
      renderLists();
    }

    // Call right after a delete succeeds.
    function removeLocalThread(id) {
      localPatches.set(id, { summary: null, expiresAt: Date.now() + PATCH_TTL_MS });
      applyLocalPatches();
      renderLists();
    }

    // Re-applies every still-valid local patch on top of whatever
    // activeThreads/solvedThreads currently hold (freshly fetched from the
    // server, or just patched) — expired patches (KV has had plenty of
    // time to catch up by then) are dropped so the server becomes the
    // source of truth again.
    function applyLocalPatches() {
      const now = Date.now();
      for (const [id, patch] of Array.from(localPatches.entries())) {
        if (patch.expiresAt < now) { localPatches.delete(id); continue; }
        activeThreads = activeThreads.filter((t) => t.id !== id);
        solvedThreads = solvedThreads.filter((t) => t.id !== id);
        if (patch.summary) (patch.summary.solved ? solvedThreads : activeThreads).unshift(patch.summary);
      }
    }

    const activeList = document.getElementById("activeList");
    const solvedList = document.getElementById("solvedList");
    const activeCount = document.getElementById("activeCount");
    const solvedCount = document.getElementById("solvedCount");
    const main = document.getElementById("threadsMain");

    // ---- Active/Solved/Recall tabs (2026-08 — replaces the old always-
    // stacked collapsible sections). Only one panel is visible at a
    // time; switching tabs also exits Select mode (selection never
    // spans tabs — simpler than the old two-independent-select-alls
    // design, and matches how the single "Select all" checkbox below is
    // scoped to whichever tab is open). Recall has no Select mode at
    // all (no bulk actions ever applied to it, same as before — its
    // items don't even render a ⋮ menu, see renderRecallList()).
    let currentTab = "active";
    let isAdminForRecall = false; // set in bootDashboard(); gates the Recall tab itself

    function switchTab(tab) {
      if (tab === "recall" && !isAdminForRecall) return;
      if (selectMode) { selectMode = false; selectedIds.clear(); }
      openItemMenuId = null;
      currentTab = tab;
      document.querySelectorAll(".threads-section[data-tab-panel]").forEach((sec) => {
        sec.style.display = sec.dataset.tabPanel === tab ? "" : "none";
      });
      document.querySelectorAll(".threads-tab").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.tab === tab);
      });
      // MERGED (2026-08-21) — #threadsSidebar's scroll position is
      // shared across every tab (it's the one element that actually
      // scrolls — see the virtualized-rendering comment above
      // renderedItemEls), so without this, switching tabs while deep-
      // scrolled into the old one would show the new tab starting from
      // that same leftover scroll offset instead of its own top —
      // confusing regardless of virtualization, but doubly so with it
      // (an offset scroll position combined with a differently-sized
      // list could window in on nothing at all).
      threadsSidebarEl.scrollTop = 0;
      renderLists();
      if (tab === "recall") renderRecallList();
    }
    document.querySelectorAll(".threads-tab").forEach((btn) => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });
    switchTab("active"); // sets the initial panel/tab visual state before any data has loaded

    document.getElementById("selectToggleBtn").addEventListener("click", () => {
      selectMode = !selectMode;
      selectedIds.clear();
      renderLists();
    });
    document.getElementById("bulkReadBtn").addEventListener("click", runBulkReadToggle);
    document.getElementById("bulkSolveBtn").addEventListener("click", runBulkSolveToggle);
    document.getElementById("tabSelectAll").addEventListener("click", (e) => e.stopPropagation());
    document.getElementById("tabSelectAll").addEventListener("change", (e) => {
      selectMode = true;
      const arr = currentTab === "active" ? activeThreads : (currentTab === "solved" ? solvedThreads : []);
      arr.forEach((t) => (e.target.checked ? selectedIds.add(t.id) : selectedIds.delete(t.id)));
      renderLists();
    });
    // Click anywhere outside an open ⋮ dropdown closes it — the menu and
    // its own trigger button both stop propagation on their own clicks
    // (see buildItemMenu/renderItem), so anything that reaches here is
    // genuinely "elsewhere".
    document.addEventListener("click", () => {
      if (openItemMenuId !== null) { openItemMenuId = null; renderLists(); }
    });

    const RECALL_TYPE_META = {
      "delete-thread": { icon: "🗑", badge: "Deleted" },
      "recall-root": { icon: "↩️", badge: "Recalled" },
      "recall-reply": { icon: "↩️", badge: "Recalled reply" },
    };

    // Admin-only — the whole #recallSection is display:none for non-admins
    // (set in bootDashboard), and the server 401s this endpoint for them
    // too, so this never actually runs for a non-admin account.
    async function loadRecallLog() {
      try {
        const res = await authFetch("/api/deletion-log", { cache: "no-store" });
        if (res.status === 401) return; // not admin (or logged out — authFetch already handled that)
        const data = await res.json();
        if (!data.ok) return;
        recallEntries = data.entries || [];
        renderRecallList();
      } catch {
        // Network hiccup — leave the list as-is, try again next poll.
      }
    }

    function renderRecallList() {
      document.getElementById("recallCount").textContent = recallEntries.length;
      const list = document.getElementById("recallList");
      if (!recallEntries.length) {
        list.innerHTML = '<div class="threads-empty">No deletions logged yet.</div>';
        return;
      }
      list.innerHTML = recallEntries.map((e) => {
        const meta = RECALL_TYPE_META[e.type] || { icon: "🗑", badge: e.type };
        return `
          <div class="thread-item recall-item">
            <div class="icon">${meta.icon}</div>
            <div class="meta">
              <div class="t-title"><span class="badge">${escapeHtml(meta.badge)}</span>${escapeHtml(e.threadTitle || "")}</div>
              <div class="t-sub">${escapeHtml(e.by || "unknown")} · ${timeAgo(e.ts)}${e.brand ? " · " + escapeHtml(e.brand) : ""}</div>
              <div class="t-content">${escapeHtml((e.content || "").slice(0, 120))}</div>
            </div>
          </div>`;
      }).join("");
      polishEmoji();
      updateAllThreadsCard();
    }

    document.getElementById("threadSearch").addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      const q = e.target.value;
      searchTimer = setTimeout(() => loadList(q), 250);
    });

    let pendingAttachments = []; // File[] — queued for the next reply, up to MAX_REPLY_ATTACHMENTS
    const MAX_REPLY_ATTACHMENTS = 10; // Telegram's own sendMediaGroup album cap
    const MAX_ATTACHMENT_MB = 45; // stays under Telegram Bot API's ~50MB upload ceiling with some margin
    let replyTarget = null; // { messageId, from, text } | null

    function setReplyTarget(messageId, from, text) {
      replyTarget = { messageId: Number(messageId), from, text };
      renderReplyTargetBanner();
      document.getElementById("replyInput")?.focus();
    }
    function clearReplyTarget() {
      replyTarget = null;
      renderReplyTargetBanner();
    }
    function renderReplyTargetBanner() {
      const el = document.getElementById("replyTargetBanner");
      if (!el) return;
      if (!replyTarget) { el.innerHTML = ""; return; }
      el.innerHTML = `
        <span class="reply-target-chip">
          ↳ Replying to <b>${escapeHtml(replyTarget.from)}</b>: ${escapeHtml((replyTarget.text || "").slice(0, 60))}
          <button type="button" id="cancelReplyTarget">✕</button>
        </span>`;
      document.getElementById("cancelReplyTarget").addEventListener("click", clearReplyTarget);
      polishEmoji();
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderAttachPreview() {
      const el = document.getElementById("replyAttachPreview");
      if (!el) return;
      if (!pendingAttachments.length) { el.innerHTML = ""; return; }
      el.innerHTML = pendingAttachments.map((f, i) => `
        <span class="attach-chip">📎 ${escapeHtml(f.name)} (${Math.round(f.size / 1024)} KB)
          <button type="button" data-clear-attach="${i}">✕</button>
        </span>`).join("");
      el.querySelectorAll("[data-clear-attach]").forEach((btn) => {
        btn.addEventListener("click", () => {
          pendingAttachments.splice(Number(btn.dataset.clearAttach), 1);
          document.getElementById("replyFileInput").value = "";
          renderAttachPreview();
        });
      });
      polishEmoji();
    }

    // Shared by the file picker (change event) and clipboard paste — both
    // just hand this a list of File objects and it applies the same
    // rules: drop anything over MAX_ATTACHMENT_MB (with a heads-up, since
    // a silent drop would look like a bug), cap the total queued at
    // MAX_REPLY_ATTACHMENTS, then re-render the chip row.
    function queueAttachments(files) {
      if (!files.length) return;
      const tooBig = files.filter((f) => f.size > MAX_ATTACHMENT_MB * 1024 * 1024);
      const sized = files.filter((f) => f.size <= MAX_ATTACHMENT_MB * 1024 * 1024);
      if (tooBig.length) alert(`${tooBig.map((f) => f.name).join(", ")} — over ${MAX_ATTACHMENT_MB}MB, Telegram will reject it. Not added.`);
      const room = MAX_REPLY_ATTACHMENTS - pendingAttachments.length;
      if (sized.length > room) alert(`You can attach up to ${MAX_REPLY_ATTACHMENTS} files in one message — only the first ${Math.max(room, 0)} of your new selection were added.`);
      pendingAttachments.push(...sized.slice(0, Math.max(room, 0)));
      renderAttachPreview();
    }

    function timeAgo(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }

    // Unread tracking — per-browser (each agent's "have I seen this" state
    // is naturally their own, not shared team-wide, same as Telegram's own
    // unread counts). Stored as "how many messages had I seen last time".
    function getSeenCount(id) {
      return parseInt(localStorage.getItem(`lastseen:${id}`) || "0", 10);
    }
    function markSeen(id, count) {
      localStorage.setItem(`lastseen:${id}`, String(count));
    }

    // Everything renderItem()'s STRUCTURE/CONTENT depends on — deliberately
    // excludes selectMode/selectedIds/openItemMenuId/selectedId-highlight
    // (see patchItemViewState()
    // below, which handles those separately via a cheap in-place patch
    // instead of a full rebuild). If none of what's listed here changed
    // since the node was last built, the existing DOM node can be reused
    // as-is (see renderLists()) instead of torn down and recreated.
    //
    // MERGED (2026-08-21) — selectMode/selectedIds used to be bundled
    // into this same key, which meant clicking "Select" on a list with
    // thousands of items (a real report: 2,016 Solved tickets) forced
    // EVERY visible row to rebuild its entire DOM node — innerHTML
    // template + re-creating every listener — all synchronously, in one
    // tick, which is exactly what froze the tab long enough for
    // Chrome's "Page Unresponsive" prompt to show up. Toggling select
    // mode (or checking/unchecking one row) doesn't change any of a
    // row's actual CONTENT, so there was never a real reason to rebuild
    // it — see patchItemViewState().
    function itemRenderKey(t) {
      return [
        t.title, t.submitter, t.lastActivity, t.replyCount, t.solved,
        t.accent, t.icon, getSeenCount(t.id), t.country,
      ].join("|");
    }

    // Cheap in-place patch for the 3 things that change WITHOUT
    // affecting a row's content: select-mode on/off, this row's checked
    // state, and the ⋮ menu's open/closed state. Runs on EVERY row on
    // EVERY renderVirtualWindow() call (rebuilt or reused), right after
    // that function decides whether a full rebuild happened —
    // O(1) DOM work per row (a class toggle + swapping one small child
    // element), not a template rebuild, so it stays fast even across
    // thousands of rows. Uses `el.onclick`/`.onchange` (single-slot
    // property assignment, not addEventListener) specifically so
    // re-wiring on a mode flip is just an overwrite — no risk of
    // stacking duplicate listeners across repeated patches the way
    // addEventListener would without careful removeEventListener
    // bookkeeping.
    function patchItemViewState(el, t) {
      el.classList.toggle("selected", t.id === selectedId);
      el.classList.toggle("select-mode", selectMode);

      const existingCheck = el.querySelector(":scope > .thread-item-check");
      const existingIcon = el.querySelector(":scope > .icon");
      const existingMenuBtn = el.querySelector(":scope > .item-menu-btn");

      if (selectMode) {
        if (existingIcon) existingIcon.remove();
        if (existingMenuBtn) existingMenuBtn.remove();
        const openMenu = el.querySelector(":scope > .item-menu");
        if (openMenu) openMenu.remove();
        let check = existingCheck;
        if (!check) {
          check = document.createElement("input");
          check.type = "checkbox";
          check.className = "thread-item-check";
          el.insertBefore(check, el.firstChild);
        }
        check.checked = selectedIds.has(t.id);
        check.onchange = () => toggleThreadSelected(t.id);
        el.onclick = (e) => {
          if (e.target.closest(".thread-item-check")) return; // its own change handler covers this
          toggleThreadSelected(t.id);
        };
      } else {
        if (existingCheck) existingCheck.remove();
        if (!existingIcon) {
          const icon = document.createElement("div");
          icon.className = "icon";
          icon.style.background = (t.accent || "#7c6cf0") + "33";
          icon.textContent = t.icon || "🔔";
          el.insertBefore(icon, el.firstChild);
        }
        let menuBtn = existingMenuBtn;
        if (!menuBtn) {
          menuBtn = document.createElement("button");
          menuBtn.type = "button";
          menuBtn.className = "item-menu-btn";
          menuBtn.title = "More";
          menuBtn.textContent = "⋮";
          el.appendChild(menuBtn);
        }
        menuBtn.onclick = (e) => {
          e.stopPropagation();
          openItemMenuId = openItemMenuId === t.id ? null : t.id;
          renderLists();
        };
        el.onclick = (e) => {
          if (e.target.closest(".item-menu-btn")) return;
          if (t.id !== selectedId) { pendingAttachments = []; replyTarget = null; }
          openThread(t.id, t.country);
        };
        const unread = Math.max(0, (t.replyCount || 0) - getSeenCount(t.id));
        const existingMenuEl = el.querySelector(":scope > .item-menu");
        if (openItemMenuId === t.id && !existingMenuEl) {
          el.appendChild(buildItemMenu(t, unread));
        } else if (openItemMenuId !== t.id && existingMenuEl) {
          existingMenuEl.remove();
        }
      }
    }

    // Builds the CONTENT shell only (title/submitter/unread badge/solved
    // check/country badge) — the select-mode-specific leading
    // icon-or-checkbox and trailing menu-button/open-menu are left for
    // patchItemViewState() (called once right after this, from
    // renderVirtualWindow() below) to fill in, so there's exactly one place
    // that logic lives instead of two copies that could drift apart.
    function renderItem(t) {
      const el = document.createElement("div");
      el.className = "thread-item";
      el.style.setProperty("--thread-accent", t.accent || "#7c6cf0");
      const unread = Math.max(0, (t.replyCount || 0) - getSeenCount(t.id));
      // MERGED (2026-08-20) — country badge, only actually shown when
      // the viewing account can see more than one country (see
      // AgentCountry.getAllowedCountries() — a single-country account
      // never needs to be told which country every ticket is from,
      // that's the only country there is for them). Server already
      // tags every thread with t.country (see GET /api/threads's own
      // comment on why) — this is the first place the frontend actually
      // reads it.
      const showCountryBadge = window.AgentCountry && window.AgentCountry.getAllowedCountries().length > 1 && t.country;
      const countryBadge = showCountryBadge ? `<span class="thread-country-badge">${escapeHtml(t.country)}</span>` : "";
      el.innerHTML = `
        <div class="meta">
          <div class="t-title">${countryBadge}${escapeHtml(t.title)}</div>
          <div class="t-sub">${escapeHtml(t.submitter)} · ${timeAgo(t.lastActivity)}${t.replyCount ? " · " + t.replyCount + " reply" : ""}</div>
        </div>
        ${unread > 0 ? `<span class="unread-badge">${unread > 99 ? "99+" : unread}</span>` : ""}
        ${t.solved ? '<span class="t-done">✓</span>' : ""}
      `;
      return el;
    }

    // The ⋮ dropdown for a single thread row — the last two rows are
    // dynamic (which one shows depends on the ticket's current state),
    // see the feature doc's ⋮ menu table.
    function buildItemMenu(t, unread) {
      const menu = document.createElement("div");
      menu.className = "item-menu";
      menu.innerHTML = `
        <div class="item-menu-option" data-action="select"><span class="item-menu-icon">☐</span>Select</div>
        ${unread > 0
          ? '<div class="item-menu-option" data-action="markread"><span class="item-menu-icon ok">✓</span>Mark as read</div>'
          : '<div class="item-menu-option" data-action="markunread"><span class="item-menu-icon">○</span>Mark as unread</div>'}
        ${t.solved
          ? '<div class="item-menu-option" data-action="unsolve"><span class="item-menu-icon danger">✕</span>Not solved</div>'
          : '<div class="item-menu-option" data-action="solve"><span class="item-menu-icon ok">✅</span>Solved</div>'}
      `;
      menu.addEventListener("click", (e) => {
        e.stopPropagation();
        const opt = e.target.closest("[data-action]");
        if (!opt) return;
        handleItemMenuAction(t, opt.dataset.action);
      });
      return menu;
    }

    function toggleThreadSelected(id) {
      if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
      renderLists();
    }

    function handleItemMenuAction(t, action) {
      openItemMenuId = null;
      if (action === "select") {
        selectMode = true;
        selectedIds.add(t.id);
      } else if (action === "markread") {
        markSeen(t.id, t.replyCount || 0);
      } else if (action === "markunread") {
        markSeen(t.id, 0);
      } else if (action === "solve" || action === "unsolve") {
        setThreadSolvedById(t.id, action === "solve", t.country);
      }
      renderLists();
    }

    // MERGED (2026-08-21) — small helper for the handful of call sites
    // that only have a thread ID on hand (not the full thread object) but
    // need that thread's country to build a request — every mutating
    // /api/threads/<id> call requires it now (see that endpoint's own
    // comment). Looks across both lists since a bulk action can span
    // active + solved threads together.
    function findThreadCountry(id) {
      const t = activeThreads.find((x) => x.id === id) || solvedThreads.find((x) => x.id === id);
      return t ? t.country : (selectedThread && selectedThread.id === id ? selectedThread.country : undefined);
    }

    // Toggles solved/unsolved for an arbitrary thread id — used by the ⋮
    // menu and by bulk actions below, neither of which necessarily has
    // that thread open as selectedThread (toggleSolved() further down
    // stays as the top-of-ticket status-chip's own version of this, which
    // always operates on selectedThread).
    async function setThreadSolvedById(id, solved, country) {
      try {
        const res = await authFetch(`/api/threads/${id}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: solved ? "solve" : "unsolve", country: country || findThreadCountry(id) }),
        });
        const data = await res.json();
        if (!data.ok) return;
        patchLocalThread(data.thread);
        if (selectedId === id) {
          selectedThread = data.thread;
          updateThreadContent(selectedThread, true);
        }
      } catch {
        // Network hiccup — leave state as-is, agent can retry from the menu.
      }
    }

    // ---- Select batch mode bulk actions ---------------------------------
    function renderBulkBar() {
      const bar = document.getElementById("bulkActionBar");
      if (!selectMode) { bar.style.display = "none"; return; }
      bar.style.display = "flex";
      const inSelection = [...activeThreads, ...solvedThreads].filter((t) => selectedIds.has(t.id));
      const readBtn = document.getElementById("bulkReadBtn");
      const solveBtn = document.getElementById("bulkSolveBtn");
      const nothingSelected = inSelection.length === 0;
      readBtn.disabled = nothingSelected;
      solveBtn.disabled = nothingSelected;
      if (nothingSelected) return; // leave whatever label was already showing — just greyed out, not clickable
      const anyUnread = inSelection.some((t) => Math.max(0, (t.replyCount || 0) - getSeenCount(t.id)) > 0);
      readBtn.textContent = anyUnread ? "✓ Mark as read" : "○ Mark as unread";
      readBtn.classList.toggle("tone-positive", anyUnread);
      readBtn.classList.toggle("tone-negative", !anyUnread);
      readBtn.dataset.mode = anyUnread ? "read" : "unread";
      const anyUnsolved = inSelection.some((t) => !t.solved);
      solveBtn.textContent = anyUnsolved ? "✅ Solved" : "✕ Not solved";
      solveBtn.classList.toggle("tone-positive", anyUnsolved);
      solveBtn.classList.toggle("tone-negative", !anyUnsolved);
      solveBtn.dataset.mode = anyUnsolved ? "solve" : "unsolve";
    }

    // The single "Select all" checkbox (now shared by both tabs instead
    // of one per section) reflects whether every thread in the CURRENTLY
    // OPEN tab is selected — Recall never renders this row at all (no
    // bulk actions there), so this is never called while currentTab is
    // "recall" in practice, but guards anyway.
    function syncTabSelectAll() {
      const cb = document.getElementById("tabSelectAll");
      const arr = currentTab === "active" ? activeThreads : (currentTab === "solved" ? solvedThreads : []);
      cb.checked = arr.length > 0 && arr.every((t) => selectedIds.has(t.id));
    }

    // Drives the "All threads" card's subtitle, count badge, and the
    // Select/Cancel button label+visibility — recomputed after every
    // render (renderLists() for Active/Solved, renderRecallList() for
    // Recall) so it always reflects whichever tab is currently open.
    function updateAllThreadsCard() {
      const labelMap = { active: "Active", solved: "Solved", recall: "Recall" };
      const sub = document.getElementById("allThreadsSub");
      const countEl = document.getElementById("allThreadsCount");
      const toggleBtn = document.getElementById("selectToggleBtn");
      toggleBtn.style.display = currentTab === "recall" ? "none" : "";
      toggleBtn.textContent = selectMode ? "Cancel" : "Select";
      if (currentTab === "recall") {
        sub.textContent = `Recall log · ${recallEntries.length} ${recallEntries.length === 1 ? "entry" : "entries"}`;
        countEl.textContent = recallEntries.length;
        return;
      }
      const arr = currentTab === "active" ? activeThreads : solvedThreads;
      const unread = arr.filter((t) => Math.max(0, (t.replyCount || 0) - getSeenCount(t.id)) > 0).length;
      sub.textContent = `${labelMap[currentTab]} threads · ${unread} new ${unread === 1 ? "reply" : "replies"}`;
      countEl.textContent = selectMode ? selectedIds.size : arr.length;
    }

    function runBulkReadToggle() {
      const makeRead = document.getElementById("bulkReadBtn").dataset.mode === "read";
      [...activeThreads, ...solvedThreads].forEach((t) => {
        if (selectedIds.has(t.id)) markSeen(t.id, makeRead ? (t.replyCount || 0) : 0);
      });
      selectMode = false;
      selectedIds.clear();
      renderLists();
    }

    async function runBulkSolveToggle() {
      const readBtn = document.getElementById("bulkReadBtn");
      const solveBtn = document.getElementById("bulkSolveBtn");
      const solving = solveBtn.dataset.mode === "solve";
      const ids = Array.from(selectedIds);
      readBtn.disabled = true;
      solveBtn.disabled = true;
      await Promise.all(ids.map((id) => setThreadSolvedById(id, solving)));
      readBtn.disabled = false;
      solveBtn.disabled = false;
      selectMode = false;
      selectedIds.clear();
      renderLists();
      loadList(document.getElementById("threadSearch").value);
    }

    function polishEmoji(root) {
      if (window.twemoji) window.twemoji.parse(root || document.body, { folder: "svg", ext: ".svg" });
    }

    // Reconciles the sidebar to match activeThreads/solvedThreads without
    // rebuilding it from scratch — reuses each thread's existing DOM node
    // (same identity, same listeners) whenever its itemRenderKey() hasn't
    // changed, only relocating it if it moved between/within a section and
    // only rebuilding its innerHTML when something it displays actually
    // changed. This is what keeps a 6-second poll cheap even with a large
    // Solved history: on a typical poll nothing in that history changed,
    // so nothing there gets touched at all.
    // Renders whichever of Active/Solved is `tab` — empty-state placeholder
    // if there's nothing, else the virtualized window (see
    // renderVirtualWindow() above). The OTHER (currently hidden) section
    // is deliberately left untouched here — its scaffold just stays
    // whatever it last was, picked back up correctly next time
    // switchTab() calls this for it (see ensureVirtualScaffold() reusing
    // an existing scaffold when the container wasn't cleared out from
    // under it). Skipping the hidden section's rendering entirely (not
    // just windowing it small) is itself part of the fix — the pre-
    // virtualization version reconciled BOTH sections on every single
    // poll/update regardless of which one anyone could actually see.
    function renderSection(tab, container, threads) {
      const emptyEl = container.querySelector(".threads-empty");
      if (!threads.length) {
        if (!emptyEl) {
          container.innerHTML = tab === "active"
            ? '<div class="threads-empty">No active threads.<br/>Submit a form to start one.</div>'
            : '<div class="threads-empty">No solved threads yet.</div>';
          virtualScaffolds[tab].sizerEl = null; // that innerHTML assignment just destroyed the scaffold, if one existed
        }
        return;
      }
      if (emptyEl) emptyEl.remove();
      renderVirtualWindow(tab, container, threads);
    }

    // PKR-MIGRATION-FOLLOWUP (2026-08-23) — the country switcher
    // (#countrySwitcherMount, agent-country.js) lets an agent pick
    // "All Countries" / a specific country, but GET /api/threads always
    // returns every allowed country merged together (see threads.js's
    // own doc comment: "the frontend needs this to show a country
    // badge/filter" — filtering was meant to happen HERE, client-side,
    // and never actually got wired up). This filters the already-
    // fetched activeThreads/solvedThreads down to whichever country is
    // currently selected, without touching those underlying arrays
    // (other code — findThreadCountry, delete bookkeeping, etc. — still
    // needs the full unfiltered list).
    function filterByCountry(threads) {
      if (!window.AgentCountry) return threads;
      const selected = AgentCountry.getCountry();
      if (!selected || AgentCountry.isAll(selected)) return threads;
      return threads.filter((t) => t.country === selected);
    }

    function renderLists() {
      const filteredActive = filterByCountry(activeThreads);
      const filteredSolved = filterByCountry(solvedThreads);

      activeCount.textContent = filteredActive.length;
      solvedCount.textContent = filteredSolved.length;

      if (currentTab === "active") renderSection("active", activeList, filteredActive);
      else if (currentTab === "solved") renderSection("solved", solvedList, filteredSolved);

      // Drop tracked nodes for threads that no longer exist in either list
      // at all (deleted, filtered out by the current search, or hidden by
      // switching to a different country) — this still has to check BOTH
      // arrays regardless of currentTab (a thread could've been removed
      // from the tab that's currently hidden), but it's a cheap
      // Set-membership pass over whatever's already in the Map, not a
      // re-render of anything.
      const currentIds = new Set([...filteredActive, ...filteredSolved].map((t) => t.id));
      for (const [id, entry] of renderedItemEls) {
        if (!currentIds.has(id)) {
          entry.el.remove();
          renderedItemEls.delete(id);
        }
      }

      renderBulkBar();
      syncTabSelectAll();
      updateAllThreadsCard();
    }

    async function loadList(q) {
      try {
        const res = await authFetch(`/api/threads${q ? "?q=" + encodeURIComponent(q) : ""}`, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) return;
        activeThreads = data.active || [];
        solvedThreads = data.solved || [];
        applyLocalPatches();
        renderLists();
      } catch {
        // Network hiccup — keep showing the last known list, try again next poll.
      }
    }

    async function openThread(id, country) {
      selectedId = id;
      renderLists();
      // MERGED (2026-08-21) — this call was still missing `?country=`
      // entirely, even after this file's other fetch calls (attachments,
      // forward) were fixed to send it during the D1-migration pass —
      // a real gap this specific call site fell through the cracks on.
      // GET /api/threads/<id> has required this since that same pass
      // (country-scoped storage resolution) — without it, EVERY click
      // on a thread was failing with "Couldn't load this thread." no
      // matter which country it belonged to.
      if (!country) {
        main.innerHTML = `<div class="threads-placeholder">Couldn't load this thread — missing country.</div>`;
        return;
      }
      try {
        const res = await authFetch(`/api/threads/${id}?country=${encodeURIComponent(country)}`, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) {
          main.innerHTML = `<div class="threads-placeholder">Couldn't load this thread.</div>`;
          return;
        }
        selectedThread = data.thread;
        renderDetail();
        markSeen(id, selectedThread.messages.length);
        renderLists();
      } catch {
        main.innerHTML = `<div class="threads-placeholder">Couldn't load this thread — check your connection.</div>`;
      }
    }

    // Called by the poll (and only the poll) — fetches fresh data for the
    // open thread but updates it in place via updateThreadContent, so a
    // reply the agent is mid-typing is never interrupted.
    async function refreshOpenThread() {
      if (!selectedId) return;
      try {
        const res = await authFetch(`/api/threads/${selectedId}?country=${encodeURIComponent((selectedThread && selectedThread.country) || "")}`, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) return;
        selectedThread = data.thread;
        updateThreadContent(selectedThread);
        markSeen(selectedId, selectedThread.messages.length);
        renderLists();
        loadMentionCandidatesForThread(selectedThread);
      } catch {
        // Network hiccup — leave the panel as-is, try again next poll.
      }
    }

    // The header bar only (icon/title/status/action buttons) — this is
    // the part that stays visually frozen at the top of the panel,
    // never scrolls, regardless of ticket detail or conversation length.
    function buildHeaderHTML(t) {
      return `
        <div class="thread-detail-header">
          <div>
            <div class="thread-detail-title"><span>${t.icon || "🔔"}</span> ${escapeHtml(t.title)}</div>
            <div class="thread-detail-sub">👤 ${escapeHtml(t.submitter)} &nbsp;·&nbsp; 📅 ${timeAgo(t.submittedAt)} &nbsp;·&nbsp; ${escapeHtml(t.brand)}${t.country ? ` (${escapeHtml(t.country)})` : ""}</div>
          </div>
          <div class="thread-detail-actions">
            <button class="status-chip ${t.solved ? "solved" : "unsolved"}" id="solveBtn">${t.solved ? "✅ Solved" : "❌ Not Solved"}</button>
            ${!t.rootRecalled && (!t.fieldMap || !t.brandId) ? '<button class="icon-btn labeled" id="editRootBtn" title="Edit the original Telegram message (plain text — this ticket predates field-level editing)">✏️ Edit</button>' : ""}
            ${!t.rootRecalled && t.fieldMap && t.brandId ? '<button class="icon-btn labeled" id="editDetailsBtn" title="Edit fields — syncs the Telegram message + the Sheet row (if any)">📊 Edit</button>' : ""}
            ${t.fieldMap && t.brandId ? '<button class="icon-btn labeled" id="forwardBtn" title="Generate a new ticket in another Topic, pre-filled from this one">↗️ Forward</button>' : ""}
            ${!t.rootRecalled ? '<button class="icon-btn labeled" id="recallRootBtn" title="Recall (delete) the original Telegram message">↩️ Recall</button>' : ""}
            <button class="icon-btn labeled" id="deleteBtn" title="Delete this tracking record (Telegram + Sheet are untouched)">🗑 Delete</button>
            <button class="icon-btn labeled" id="refreshBtn" title="Refresh this thread">🔄 Refresh</button>
          </div>
        </div>
        <hr class="thread-divider" />
      `;
    }

    // The ticket detail card (recalled notice + summary/rootText +
    // attachments) — this now scrolls together with the conversation
    // instead of staying pinned, since only the header bar above should
    // stay frozen.
    function buildSummaryHTML(t) {
      return `
        ${t.rootRecalled ? `
          <div class="edit-modal-note err" style="font-size:12.5px; margin-bottom:14px;">
            ⚠️ The original message was recalled from Telegram — this ticket no longer exists in the group.
          </div>` : ""}

        ${(() => {
          // Clickable "View attachment" buttons for the ORIGINAL ticket's
          // own photo(s)/document(s) — reuses the exact same lightbox
          // (viewAttachment(), see the script below) and the same
          // /api/attachment/<fileId> live-proxy endpoint that reply
          // attachments use. Only present for tickets submitted after
          // this feature shipped — attachmentFileIds is simply empty/
          // undefined for older ones, so this cleanly renders nothing
          // rather than a broken button.
          const fileIds = t.attachmentFileIds || [];
          const attachmentButtons = fileIds.length ? `
            <div class="thread-summary-attachments">
              ${fileIds.map((fid, i) => `
                <div class="inline-attach-slot" data-attachment-file="${escapeAttr(fid)}" data-attachment-name="ticket-attachment-${i + 1}" data-attachment-country="${escapeAttr(t.country || "")}">
                  <div class="inline-attach-loading">Loading attachment…</div>
                </div>
              `).join("")}
            </div>` : "";

          if (t.rootEdited) {
            return `
              <div class="thread-summary-card">
                <div class="row" style="margin-bottom:6px;"><b style="color:var(--accent-gold);">✏️ Edited — current message text:</b></div>
                <div style="white-space:pre-wrap; font-size:13px;">${escapeHtml(stripHtmlTags(t.rootText || ""))}</div>
                ${attachmentButtons}
              </div>`;
          }
          // The exact text originally sent to Telegram — same emoji,
          // same line breaks, same wording an agent would see in the
          // Telegram group itself (just with the <b> HTML tags stripped,
          // since this renders as plain text, not HTML). Falls back to
          // the old simplified field-list (t.summary) only in the
          // unlikely case rootText itself is empty for some reason.
          if (t.rootText) {
            return `
              <div class="thread-summary-card">
                <div style="white-space:pre-wrap; font-size:13px; line-height:1.6;">${escapeHtml(stripHtmlTags(t.rootText))}</div>
                ${attachmentButtons}
              </div>`;
          }
          if (t.summary && t.summary.length) {
            return `
              <div class="thread-summary-card">
                ${t.summary.map((s) => `<div class="row"><b>${escapeHtml(s.label)}:</b> <span>${escapeHtml(s.value)}</span></div>`).join("")}
                ${attachmentButtons}
              </div>`;
          }
          return "";
        })()}

        ${t.forwardedFrom ? `
          <div class="forward-link-card" data-goto-thread="${escapeAttr(t.forwardedFrom.threadId)}" data-goto-country="${escapeAttr(t.country || "")}">
            ↩️ Forwarded from <b>${escapeHtml(t.forwardedFrom.moduleName)}</b> — ${escapeHtml(t.forwardedFrom.title)}
          </div>` : ""}
        ${(t.forwardedTo || []).map((link) => `
          <div class="forward-link-card" data-goto-thread="${escapeAttr(link.threadId)}" data-goto-country="${escapeAttr(t.country || "")}">
            ↗️ Forwarded to <b>${escapeHtml(link.moduleName)}</b> — ${escapeHtml(link.title)} &nbsp;<span class="forward-link-time">${timeAgo(link.at)}</span>
          </div>`).join("")}
      `;
    }

    function stripHtmlTags(str) {
      return String(str).replace(/<[^>]*>/g, "");
    }

    // ---- Conversation diffed rendering (2026-08) -------------------------
    // Same reuse-DOM-nodes-instead-of-rebuilding pattern as the sidebar's
    // renderVirtualWindow()/renderedItemEls above, applied to the open
    // thread's message list. Before this, updateThreadContent() replaced
    // #threadScrollArea's ENTIRE innerHTML on every single poll (every 6s
    // while a thread is open) even when nothing had actually changed —
    // browsers reset a scrollable element's scrollTop to 0 the instant its
    // own innerHTML is reassigned, so an agent scrolled up reading older
    // messages got yanked back to the top of the conversation every few
    // seconds ("page jumping"). The fix has two parts: (1) the scroll
    // container's OWN innerHTML is never touched again after the initial
    // open — only its persistent children (#threadSummaryBlock,
    // #conversationTitle, #conversationList) get updated, and reassigning
    // a CHILD's innerHTML does not reset the ancestor's scrollTop; (2)
    // within #conversationList, each message keeps its own real DOM node
    // across polls (reconcileConversation() below) instead of the whole
    // list being torn down and rebuilt, so an unrelated new message
    // arriving doesn't even touch the DOM of messages already on screen.
    let renderedMsgEls = new Map(); // key -> { el, sig } — valid only for whichever thread is CURRENTLY open; cleared in renderDetail() every time a different thread is opened, since these nodes belong to that thread's own #conversationList container.

    // messageId is the natural stable key (present on every message this
    // dashboard itself sent, and on genuine incoming Telegram replies —
    // see appendMessage() server-side); the ts+from fallback only ever
    // matters for older, pre-messageId-tracking rows that might still be
    // sitting in an old thread's history.
    function msgKey(m) {
      return m.messageId != null ? `id:${m.messageId}` : `i:${m.ts || ""}:${m.from || ""}`;
    }

    // Builds the {rootMessageId/messageId -> {from, text}} lookup
    // renderMsg() needs to show a quoted preview above a reply-to-message
    // — shared logic pulled out of the old buildConversationHTML() so
    // both the full render and the diffed update use the exact same
    // lookup, never two slightly different copies drifting apart.
    function buildMsgById(t) {
      const msgById = {};
      if (t.rootMessageId) {
        msgById[t.rootMessageId] = { from: "Original ticket", text: stripHtmlTags(t.rootText || t.title || "") };
      }
      t.messages.forEach((m) => {
        if (m.messageId) msgById[m.messageId] = { from: m.from, text: m.text };
      });
      return msgById;
    }

    function reconcileConversation(container, messages, msgById) {
      let prevEl = null;
      const seen = new Set();
      messages.forEach((m) => {
        const key = msgKey(m);
        seen.add(key);
        const sig = JSON.stringify(m); // any field renderMsg() reads is covered — simplest correct signature for a small per-message object
        let entry = renderedMsgEls.get(key);
        if (!entry || entry.sig !== sig) {
          if (entry) entry.el.remove(); // detach the stale node before replacing the Map pointer, or it leaks as an orphan
          const wrapper = document.createElement("div");
          wrapper.innerHTML = renderMsg(m, msgById).trim();
          const el = wrapper.firstElementChild;
          wireMessageRowButtons(el); // exactly once, right here — see that function's own comment for why
          entry = { el, sig };
          renderedMsgEls.set(key, entry);
        }
        const wantPos = prevEl ? prevEl.nextSibling : container.firstChild;
        if (entry.el.parentNode !== container || entry.el !== wantPos) {
          container.insertBefore(entry.el, wantPos);
        }
        prevEl = entry.el;
      });
      // Drop nodes for messages that no longer exist (a recall/delete) —
      // everything still present was already repositioned/reused above.
      for (const [key, entry] of renderedMsgEls) {
        if (!seen.has(key)) {
          entry.el.remove();
          renderedMsgEls.delete(key);
        }
      }
    }

    // Full (re)build of the conversation list — used only when opening/
    // switching threads (renderDetail()), where starting completely fresh
    // is correct and simpler; polls afterward go through
    // reconcileConversation() via updateThreadContent() instead.
    // Ticket-level summary content essentially never changes after
    // creation except via a few specific actions (rootEdited, a forward
    // link added, a recall) — this signature deliberately excludes
    // anything about the ticket's OWN attachment slots' load state
    // (buildSummaryHTML() always emits the same "Loading attachment…"
    // placeholder markup regardless of whether loadInlineAttachments()
    // has since filled it in with a real <img>/<video>). Comparing raw
    // rebuilt HTML against the live DOM's innerHTML would therefore
    // "detect a change" on every single poll once an attachment finishes
    // loading — the DOM has an <img>, the freshly-built string still has
    // the placeholder — endlessly rebuilding the block, discarding the
    // loaded image, and re-showing "Loading attachment…" forever. This
    // signature only tracks the fields that actually matter.
    function summarySignature(t) {
      return JSON.stringify({
        rootRecalled: t.rootRecalled, rootEdited: t.rootEdited, rootText: t.rootText,
        attachmentFileIds: t.attachmentFileIds, summary: t.summary,
        forwardedFrom: t.forwardedFrom, forwardedTo: t.forwardedTo,
      });
    }
    let lastSummarySig = null; // reset in renderDetail() whenever a different thread opens

    function renderConversationList(t) {
      const listEl = document.getElementById("conversationList");
      if (!listEl) return;
      if (!t.messages.length) {
        renderedMsgEls.clear();
        listEl.innerHTML = '<div class="threads-empty">No replies yet — they\'ll show up here as soon as someone replies in Telegram.</div>';
        return;
      }
      // Covers the empty→non-empty transition (first reply landing while
      // the thread is already open) — the placeholder above isn't a
      // tracked message node, so reconcileConversation() would otherwise
      // just insert the new message next to it instead of replacing it.
      const placeholder = listEl.querySelector(".threads-empty");
      if (placeholder) placeholder.remove();
      reconcileConversation(listEl, t.messages, buildMsgById(t));
    }

    function wireTopButtons() {
      document.getElementById("solveBtn")?.addEventListener("click", () => toggleSolved());
      document.getElementById("deleteBtn")?.addEventListener("click", () => deleteThread());
      document.getElementById("editRootBtn")?.addEventListener("click", () => editRoot());
      document.getElementById("editDetailsBtn")?.addEventListener("click", () => openEditDetailsModal());
      document.getElementById("forwardBtn")?.addEventListener("click", () => openForwardModal());
      document.getElementById("recallRootBtn")?.addEventListener("click", () => recallRoot());
      document.getElementById("refreshBtn")?.addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        btn.classList.add("spinning");
        btn.disabled = true;
        const startedAt = Date.now();
        const MIN_VISIBLE_MS = 2000;
        try {
          await loadList(document.getElementById("threadSearch").value);
          await refreshOpenThread();
        } finally {
          const elapsed = Date.now() - startedAt;
          if (elapsed < MIN_VISIBLE_MS) await new Promise((r) => setTimeout(r, MIN_VISIBLE_MS - elapsed));
          document.getElementById("refreshBtn")?.classList.remove("spinning");
          if (document.getElementById("refreshBtn")) document.getElementById("refreshBtn").disabled = false;
        }
      });
    }

    // Scoped to #threadSummaryBlock only — that block's own innerHTML IS
    // fully replaced whenever it changes (see updateThreadContent()), so
    // re-wiring its cards every time is safe/correct (always fresh
    // nodes). This is now separate from message-row buttons below, which
    // persist across polls and must NOT be re-wired on every one (see
    // reconcileConversation()'s new-node branch, where they're wired
    // exactly once, at creation).
    function wireGotoThreadCards(root) {
      root.querySelectorAll("[data-goto-thread]").forEach((card) => {
        card.addEventListener("click", () => openThread(card.dataset.gotoThread, card.dataset.gotoCountry));
      });
    }

    // Wires a single freshly-created message row's own action buttons —
    // called once, at creation time, from reconcileConversation() below.
    // NEVER called again for a node that's being reused across polls, or
    // every poll would stack another duplicate listener on top of the
    // last one (a real regression the old "rebuild everything, rewire
    // everything" approach never had to worry about, since every node
    // really was fresh every time — now that nodes persist, wiring has
    // to happen exactly once per node instead).
    function wireMessageRowButtons(el) {
      el.querySelectorAll("[data-edit-reply]").forEach((btn) => {
        btn.addEventListener("click", () => editReply(btn.dataset.editReply, btn.dataset.currentText));
      });
      el.querySelectorAll("[data-recall-reply]").forEach((btn) => {
        btn.addEventListener("click", () => recallReply(btn.dataset.recallReply));
      });
      el.querySelectorAll("[data-reply-target]").forEach((btn) => {
        btn.addEventListener("click", () => setReplyTarget(btn.dataset.replyTarget, btn.dataset.replyFrom, btn.dataset.replyText));
      });
    }

    function isNearBottom(el) {
      return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    }

    function scrollConversation(force) {
      const area = document.getElementById("threadScrollArea");
      if (!area) return;
      if (force || isNearBottom(area)) area.scrollTop = area.scrollHeight;
    }

    // Full render — used when opening/switching threads. Builds the reply
    // box fresh (it's fine to lose focus here since the panel just opened).
    function renderDetail() {
      const t = selectedThread;
      if (!t) return;
      main.innerHTML = `
        <div class="thread-top-fixed" id="threadTopFixed">${buildHeaderHTML(t)}</div>
        <div class="thread-scroll-area" id="threadScrollArea">
          <div id="threadSummaryBlock">${buildSummaryHTML(t)}</div>
          <div class="conversation-title" id="conversationTitle">Conversation (${t.messages.length})</div>
          <div class="conversation" id="conversationList"></div>
        </div>
        <div class="thread-reply-fixed">
          <div id="replyTargetBanner"></div>
          <div class="reply-attach-preview" id="replyAttachPreview"></div>
          <div class="reply-box">
            <div class="reply-input-wrap">
              <button class="attach-btn" id="attachBtn" title="Attach images, videos, or PDFs (multiple allowed, or paste an image directly into the box)">🔗</button>
              <input type="file" id="replyFileInput" accept="image/*,video/*,application/pdf" multiple hidden />
              <input type="text" id="replyInput" placeholder="Reply into the Telegram thread..." autocomplete="off" />
              <div class="mention-dropdown" id="mentionDropdown" style="display:none;"></div>
            </div>
            <button id="replySend">Send</button>
          </div>
        </div>
      `;
      // Opening a fresh thread invalidates every message DOM node from
      // whatever was open before — see reconcileConversation()'s own
      // comment for why this map can't just carry over between threads.
      renderedMsgEls.clear();
      lastSummarySig = summarySignature(t);
      renderConversationList(t);
      wireGotoThreadCards(document.getElementById("threadSummaryBlock"));
      wireTopButtons();
      document.getElementById("replySend").addEventListener("click", sendReply);
      document.getElementById("replyInput").addEventListener("input", handleMentionInput);
      document.getElementById("replyInput").addEventListener("keydown", (e) => {
        if (handleMentionKeydown(e)) return; // dropdown consumed this key (nav/select/close)
        if (e.key === "Enter") sendReply();
      });
      document.getElementById("attachBtn").addEventListener("click", () => document.getElementById("replyFileInput").click());
      document.getElementById("replyFileInput").addEventListener("change", (e) => {
        // Accumulate across multiple picks (the attach button can be clicked
        // again to add more) rather than replacing the queue.
        queueAttachments(Array.from(e.target.files || []));
        e.target.value = ""; // reset so picking the same file again still fires "change"
      });
      renderAttachPreview();
      scrollConversation(true);
      polishEmoji();
      loadInlineAttachments();
      loadMentionCandidatesForThread(t);
    }

    // ---- @ Tag Username --------------------------------------------------
    // Pulls the "people who've replied here before" list for this ticket's
    // brand+module (see functions/api/mention-candidates.js), cached in
    // memory per brand+module so re-opening the same thread or @-ing more
    // than once doesn't re-fetch. Also merges in THIS thread's own
    // conversation participants on top — covers the gap between someone
    // just replying in Telegram and the KV registry write becoming visible
    // (KV list/get is eventually consistent), see tg-reply-threads-
    // features doc, Step 4.
    async function loadMentionCandidatesForThread(t) {
      currentMentionCandidates = [];
      if (!t.brandId || !t.module) return;
      const cacheKey = `${t.brandId}::${t.module}`;
      let fromServer = mentionCandidatesCache[cacheKey];
      if (!fromServer) {
        try {
          const res = await authFetch(`/api/mention-candidates?brandId=${encodeURIComponent(t.brandId)}&module=${encodeURIComponent(t.module)}`, { cache: "no-store" });
          const data = await res.json();
          fromServer = data.ok ? (data.candidates || []) : [];
        } catch {
          fromServer = [];
        }
        mentionCandidatesCache[cacheKey] = fromServer;
      }
      const merged = new Map();
      fromServer.forEach((c) => merged.set(c.handle, { handle: c.handle, from: c.from }));
      (t.messages || []).forEach((m) => {
        if (!m.self && m.handle) merged.set(m.handle, { handle: m.handle, from: m.from });
      });
      // Only apply if we're still looking at the same thread — a slow
      // fetch shouldn't clobber a newer thread's candidates if the agent
      // already switched away by the time this resolves.
      if (selectedThread && selectedThread.id === t.id) {
        currentMentionCandidates = Array.from(merged.values());
      }
    }

    function closeMentionDropdown() {
      const dd = document.getElementById("mentionDropdown");
      if (dd) { dd.style.display = "none"; dd.innerHTML = ""; }
      mentionActiveIndex = -1;
    }

    // Fires on every keystroke in the reply box — looks for an @fragment
    // right before the cursor (only when it's at the end of the text, or
    // more precisely at the end of what's typed so far — same simple
    // "trailing @word" match the feature doc specifies) and filters
    // currentMentionCandidates by that fragment as a prefix, case-insensitive.
    function handleMentionInput(e) {
      const input = e.target;
      const match = input.value.match(/(?:^|\s)@(\w*)$/);
      if (!match || !currentMentionCandidates.length) { closeMentionDropdown(); return; }
      const frag = match[1].toLowerCase();
      const matches = currentMentionCandidates.filter((c) => c.handle.slice(1).toLowerCase().startsWith(frag));
      if (!matches.length) { closeMentionDropdown(); return; }
      renderMentionDropdown(matches);
    }

    function renderMentionDropdown(matches) {
      const dd = document.getElementById("mentionDropdown");
      if (!dd) return;
      mentionActiveIndex = 0;
      dd.innerHTML = matches.map((c, i) => `
        <div class="mention-option${i === 0 ? " active" : ""}" data-handle="${escapeAttr(c.handle)}" data-idx="${i}">
          <span class="mention-handle">${escapeHtml(c.handle)}</span>
          <span class="mention-from">${escapeHtml(c.from || "")}</span>
        </div>
      `).join("");
      dd.style.display = "block";
      dd.querySelectorAll(".mention-option").forEach((opt) => {
        opt.addEventListener("mousedown", (e) => {
          e.preventDefault(); // keep focus in the input instead of the dropdown
          selectMentionCandidate(opt.dataset.handle);
        });
      });
    }

    // Replaces the trailing @fragment the agent just typed with the full
    // "@username " (trailing space so they can keep typing the message).
    function selectMentionCandidate(handle) {
      const input = document.getElementById("replyInput");
      if (!input) return;
      input.value = input.value.replace(/(?:^|\s)@(\w*)$/, (m) => (m[0] === " " ? " " : "") + handle + " ");
      closeMentionDropdown();
      input.focus();
    }

    // Returns true if it handled the keypress (dropdown was open and the
    // key was one of its own — nav/select/close), so the caller's own
    // Enter-to-send handling gets skipped for that keystroke.
    function handleMentionKeydown(e) {
      const dd = document.getElementById("mentionDropdown");
      if (!dd || dd.style.display === "none") return false;
      const options = Array.from(dd.querySelectorAll(".mention-option"));
      if (!options.length) return false;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        mentionActiveIndex = (mentionActiveIndex + 1) % options.length;
        options.forEach((o, i) => o.classList.toggle("active", i === mentionActiveIndex));
        return true;
      }
      if (e.key === "ArrowUp") {
        e.preventDefault();
        mentionActiveIndex = (mentionActiveIndex - 1 + options.length) % options.length;
        options.forEach((o, i) => o.classList.toggle("active", i === mentionActiveIndex));
        return true;
      }
      if (e.key === "Enter" || e.key === "Tab") {
        e.preventDefault();
        const chosen = options[mentionActiveIndex] || options[0];
        selectMentionCandidate(chosen.dataset.handle);
        return true;
      }
      if (e.key === "Escape") {
        e.preventDefault();
        closeMentionDropdown();
        return true;
      }
      return false;
    }

    // Light refresh — used by polling and after in-place actions (solve,
    // send, edit, recall). Only touches the top info block and the
    // conversation; the reply box (and whatever the agent is mid-typing)
    // is never rebuilt, so focus/cursor/draft text all survive.
    //
    // 2026-08: no longer reassigns #threadScrollArea's own innerHTML at
    // all (that's what caused the scrollTop-reset "page jumping" on every
    // poll — see reconcileConversation()'s comment above for the full
    // explanation) — only its persistent children get touched, and the
    // conversation list is now diffed message-by-message instead of
    // rebuilt wholesale.
    function updateThreadContent(t, forceScroll) {
      const topFixed = document.getElementById("threadTopFixed");
      const scrollArea = document.getElementById("threadScrollArea");
      const summaryBlock = document.getElementById("threadSummaryBlock");
      const titleEl = document.getElementById("conversationTitle");
      if (!topFixed || !scrollArea || !summaryBlock || !titleEl) { renderDetail(); return; }
      const wasNearBottom = isNearBottom(scrollArea);
      const newHeaderHTML = buildHeaderHTML(t);
      if (topFixed.innerHTML !== newHeaderHTML) {
        topFixed.innerHTML = newHeaderHTML;
        wireTopButtons();
      }
      const newSig = summarySignature(t);
      if (newSig !== lastSummarySig) {
        summaryBlock.innerHTML = buildSummaryHTML(t);
        wireGotoThreadCards(summaryBlock); // only when actually rebuilt — same one-wire-per-fresh-node rule as message rows
        lastSummarySig = newSig;
      }
      titleEl.textContent = `Conversation (${t.messages.length})`;
      renderConversationList(t);
      if (forceScroll || wasNearBottom) scrollConversation(true);
      polishEmoji(topFixed);
      polishEmoji(scrollArea);
      loadInlineAttachments();
    }

    const AVATAR_COLORS = ["#60A5FA", "#FBBF24", "#F87171", "#F472B6", "#34D399", "#A78BFA", "#38bdf8", "#fb923c"];
    function colorFor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[hash % AVATAR_COLORS.length];
    }

    function renderMsg(m, msgById) {
      // A multi-attachment reply went out as a Telegram album (one
      // message_id per photo) — Telegram doesn't support text-editing an
      // album item, so the ✏️ button is hidden for those; ↩️ Recall still
      // works and deletes every message in the group.
      const isAlbum = m.messageIds && m.messageIds.length > 1;
      const selfControls = m.self && m.messageId ? `
        <span class="msg-actions">
          ${isAlbum ? "" : `<button data-edit-reply="${m.messageId}" data-current-text="${escapeAttr(m.text)}" title="Edit">✏️</button>`}
          <button data-recall-reply="${m.messageId}" title="Recall">↩️</button>
        </span>` : "";
      const replyTargetBtn = m.messageId
        ? `<button class="reply-target-btn" data-reply-target="${m.messageId}" data-reply-from="${escapeAttr(m.from)}" data-reply-text="${escapeAttr(m.text)}" title="Reply to this message">↳</button>`
        : "";
      const quoted = m.replyToMessageId && msgById && msgById[m.replyToMessageId];
      const replyQuote = quoted
        ? `<div class="reply-quote-preview"><b>${escapeHtml(quoted.from)}</b>${escapeHtml((quoted.text || "").slice(0, 80))}</div>`
        : "";
      const initials = (m.from || "?").trim().slice(0, 2).toUpperCase();
      const color = m.self ? "var(--accent-gold)" : colorFor(m.from || "?");
      const deliveredTick = m.self ? '<span class="msg-tick" title="Delivered">✓</span>' : "";
      const attachTag = m.hasAttachment
        ? (m.attachmentFileIds && m.attachmentFileIds.length > 1
            ? `<div class="msg-multi-attach">${m.attachmentFileIds.map((fid, i) => `
                <div class="inline-attach-slot msg-inline-attach" data-attachment-file="${escapeAttr(fid)}" data-attachment-name="${escapeAttr((m.attachmentNames && m.attachmentNames[i]) || `attachment-${i + 1}`)}" data-attachment-country="${escapeAttr((selectedThread && selectedThread.country) || "")}">
                  <div class="inline-attach-loading">Loading attachment…</div>
                </div>`).join("")}</div>`
            : (m.attachmentFileId
